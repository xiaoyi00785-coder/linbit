      security: []
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, example: 10 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /home/newcomer:
    get:
      tags: [Home]
      summary: 新人任务卡片；可匿名（带合法 Bearer 时返回个人进度）
      operationId: getHomeNewcomer
      security: [{}, { bearerAuth: [] }]
      responses:
        "200":
          description: OK（无活动时 available=false、tasks=[]；状态读取失败时 degraded=true 返回模板）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeNewcomer" }
  /market/fiat-rates:
    get:
      tags: [Market]
      summary: 法币汇率（USDT=1 USD），公开
      description: 免费 FX 源（FIAT_RATES_URLS 可配置，多源回退），缓存 10 分钟；失败时返回上次成功值（stale=true），从未成功则返回静态表（source=static, updatedAt=null）。
      operationId: getFiatRates
      security: []
      parameters:
        - { name: base, in: query, required: false, schema: { type: string, enum: [USDT, USDC, USD], default: USDT } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiatRates" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /app/features:
    get:
      tags: [App]
      summary: 功能开关，公开（缓存 30s）
      operationId: getAppFeatures
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppFeatures" }
  /account/favorites:
    get:
      tags: [Account]
      summary: 自选列表
      operationId: listFavorites
      parameters:
        - { name: market, in: query, required: false, schema: { type: string, enum: [spot, futures], default: spot } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Favorites" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Account]
      summary: 整体替换自选（顺序即 sort，上限 200）
      operationId: replaceFavorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbols]
              properties:
                market: { type: string, enum: [spot, futures], default: spot }
                symbols: { type: array, items: { type: string, pattern: "^[A-Z0-9]{2,24}$" }, example: [BTCUSDT, ETHUSDT] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Favorites" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /account/favorites/{symbol}:
    parameters:
      - { name: symbol, in: path, required: true, schema: { type: string, example: BTCUSDT } }
      - { name: market, in: query, required: false, schema: { type: string, enum: [spot, futures], default: spot } }
    put:
      tags: [Account]
      summary: 添加自选（幂等；超过 200 返回 FAVORITES_LIMIT）
      operationId: addFavorite
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Favorites" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Account]
      summary: 删除自选（幂等）
      operationId: removeFavorite
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Favorites" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /assets/transfer:
    post:
      tags: [Assets]
      summary: 账户间划转（spot ⇄ futures），按 clientId 幂等，记入账本
      description: |
        复用 /futures/transfer 内部实现（旧接口保持可用）。earn 不是划转账户：理财为按产品的持仓并计息，请使用申购/赎回接口。
        错误码：INSUFFICIENT_BALANCE、ACCOUNT_NOT_SUPPORTED（如 earn）、SAME_ACCOUNT、VALIDATION_ERROR、IDEMPOTENCY_CONFLICT（同 clientId 不同参数）。
      operationId: createAssetTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "200":
          description: 完成（或同 clientId 重放返回原结果）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/BadRequest" }
  /assets/transfers:
    get:
      tags: [Assets]
      summary: 划转历史（含旧 /futures/transfer 记录，clientId 为 null）
      operationId: listAssetTransfers
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: asset, in: query, required: false, schema: { type: string, example: USDT } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Transfer" } }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/home/placements:
    get:
      tags: [Admin]
      summary: 运营位列表（?slot= 过滤）
      operationId: adminListPlacements
      parameters:
        - { name: slot, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Placement" } } } } } } }
    post:
      tags: [Admin]
      summary: 创建运营位（需 content 权限 + totpCode + reason，审计 levelHigh）
      operationId: adminCreatePlacement
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementChange" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /admin/v1/home/placements/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Admin]
      summary: 更新运营位（totpCode + reason）
      operationId: adminUpdatePlacement
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementChange" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Admin]
      summary: 删除运营位（body 含 totpCode + reason）
      operationId: adminDeletePlacement
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminWriteMeta" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementChange" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/v1/app/features:
    get:
      tags: [Admin]
      summary: 功能开关（含默认值与可用 key）
      operationId: adminGetAppFeatures
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    put:
      tags: [Admin]
      summary: 部分更新功能开关（未知 key 400；totpCode + reason，审计）
      operationId: adminSetAppFeatures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/AdminWriteMeta" }
                - type: object
                  required: [features]
                  properties:
                    features: { type: object, additionalProperties: { type: boolean }, example: { chat: true } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  features: { type: object, additionalProperties: { type: boolean } }
                  updatedAt: { type: string, format: date-time, nullable: true }
                  before: { type: object, additionalProperties: { type: boolean } }
                  after: { type: object, additionalProperties: { type: boolean } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /chat/rooms:
    get:
      tags: [Chat]
      summary: 聊天室列表（公开；general + spot.{SYM} + futures.{SYM}，含在线人数与发言规则；功能开关 chat 关闭时 403 FEATURE_DISABLED）
      description: |
        实时推送：在现有 /ws 上订阅频道 `chat:{room}`（如 `chat:spot.BTCUSDT`）。
        帧 data 为 `{type:"message", message: ChatMessage}` 或 `{type:"delete", id}`。
      operationId: listChatRooms
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms: { type: array, items: { $ref: "#/components/schemas/ChatRoom" } }
                  rules: { $ref: "#/components/schemas/ChatRules" }
        "403": { description: FEATURE_DISABLED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /chat/rooms/{room}/messages:
    parameters:
      - { name: room, in: path, required: true, schema: { type: string, example: spot.BTCUSDT } }
    get:
      tags: [Chat]
      summary: 历史消息（公开，新→旧；before=消息 id 游标，limit 默认 50，上限 historyLimitMax）
      operationId: listChatMessages
      security: []
      parameters:
        - { name: before, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
                  hasMore: { type: boolean }
        "403": { description: FEATURE_DISABLED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Chat]
      summary: 发言（需登录 + KYC ≥ minKycLevel；服务端拦截链接/联系方式/屏蔽词；频率与长度限制；clientId 幂等）
      description: |
        错误码：CHAT_KYC_REQUIRED/CHAT_MUTED(含 mutedUntil)/CHAT_BANNED/FEATURE_DISABLED (403)，
        CHAT_RATE_LIMITED (429，含 retryAfterMs 与 Retry-After)，CHAT_TOO_LONG/CHAT_LINK_BLOCKED/CHAT_CONTACT_BLOCKED/CHAT_WORD_BLOCKED/VALIDATION_ERROR (400)，
        CHAT_UNAVAILABLE (503)。相同 clientId 重放返回 200 与原消息。
      operationId: postChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, text]
              properties:
                clientId: { type: string, maxLength: 64 }
                text: { type: string, maxLength: 200 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ChatMessage" } } } }
        "200": { description: 幂等重放, content: { application/json: { schema: { $ref: "#/components/schemas/ChatMessage" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: CHAT_RATE_LIMITED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /chat/messages/{id}/report:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [Chat]
      summary: 举报消息（需登录；不可举报自己；同一人重复举报幂等）
      operationId: reportChatMessage
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 200 } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/v1/chat/config:
    get:
      tags: [Admin]
      summary: 聊天配置（content 权限）
      operationId: adminGetChatConfig
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChatConfig" } } } }
    put:
      tags: [Admin]
      summary: 部分更新聊天配置（未知 key 400；totpCode + reason，审计 chat_config_update）
      operationId: adminUpdateChatConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/AdminWriteMeta" }
                - { $ref: "#/components/schemas/ChatConfig" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChatChange" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /admin/v1/chat/messages:
    get:
      tags: [Admin]
      summary: 消息检索（room/uid/status/q/before/limit；含完整 uid 与举报数）
      operationId: adminListChatMessages
      parameters:
        - { name: room, in: query, required: false, schema: { type: string } }
        - { name: uid, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [visible, deleted] } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: before, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ChatAdminMessage" } }, hasMore: { type: boolean } } } } } }
  /admin/v1/chat/messages/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [Admin]
      summary: 删除消息（WS 推送 delete；关联未处理举报置为 resolved；totpCode + reason）
      operationId: adminDeleteChatMessage
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminWriteMeta" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChatChange" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/v1/chat/sanctions:
    get:
      tags: [Admin]
      summary: 禁言/封禁名单
      operationId: adminListChatSanctions
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ChatSanction" } } } } } } }
  /admin/v1/chat/mutes:
    post:
      tags: [Admin]
      summary: 禁言（durationMinutes 1-525600；totpCode + reason）
      operationId: adminMuteChatUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/AdminWriteMeta" }
                - type: object
                  required: [uid, durationMinutes]
                  properties:
                    uid: { type: string }
                    durationMinutes: { type: integer, minimum: 1, maximum: 525600 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChatChange" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /admin/v1/chat/mutes/{uid}:
    parameters:
      - { name: uid, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Admin]
      summary: 解除禁言（totpCode + reason）
      operationId: adminUnmuteChatUser
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminWriteMeta" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChatChange" } } } }
  /admin/v1/chat/bans:
    post:
      tags: [Admin]
      summary: 封禁发言（永久，直至解除；totpCode + reason）
      operationId: adminBanChatUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/AdminWriteMeta" }
                - { type: object, required: [uid], properties: { uid: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChatChange" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /admin/v1/chat/bans/{uid}:
    parameters:
      - { name: uid, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Admin]
      summary: 解除封禁（totpCode + reason）
      operationId: adminUnbanChatUser
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminWriteMeta" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChatChange" } } } }
  /admin/v1/chat/reports:
    get:
      tags: [Admin]
      summary: 举报列表（status=open|resolved|dismissed|all，默认 open）
      operationId: adminListChatReports
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, resolved, dismissed, all] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ChatReport" } } } } } } }
  /admin/v1/chat/reports/{id}/resolve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [Admin]
      summary: 处理举报（action=resolve|dismiss；totpCode + reason）
      operationId: adminResolveChatReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/AdminWriteMeta" }
                - { type: object, required: [action], properties: { action: { type: string, enum: [resolve, dismiss] } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChatChange" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: VALIDATION_ERROR
            message: 请求参数不合法
            requestId: req_400demo
    Unauthorized:
      description: 未认证或令牌失效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: AUTH_UNAUTHORIZED
            message: 请先登录
            requestId: req_401demo
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: NOT_FOUND
            message: 资源不存在
            requestId: req_404demo

  schemas:
    ChatRoom:
      type: object
      properties:
        id: { type: string, example: spot.BTCUSDT }
        kind: { type: string, enum: [general, spot, futures] }
        symbol: { type: string }
        online: { type: integer }
    ChatRules:
      type: object
      properties:
        maxLength: { type: integer }
        minIntervalMs: { type: integer }
        minKycLevel: { type: integer }
        blockLinks: { type: boolean }
        blockContacts: { type: boolean }
    ChatMessage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        room: { type: string }
        sender: { type: string, description: 脱敏昵称，如 用户***1234 }
        text: { type: string }
        mine: { type: boolean }
        createdAt: { type: string, format: date-time }
    ChatAdminMessage:
      allOf:
        - { $ref: "#/components/schemas/ChatMessage" }
        - type: object
          properties:
            uid: { type: string }
            clientId: { type: string }
            status: { type: string, enum: [visible, deleted] }
            deletedBy: { type: string, nullable: true }
            deletedReason: { type: string, nullable: true }
            reports: { type: integer }
    ChatConfig:
      type: object
      properties:
        minIntervalMs: { type: integer, default: 3000 }
        maxLength: { type: integer, default: 200 }
        minKycLevel: { type: integer, default: 1, minimum: 0, maximum: 3 }
        blockLinks: { type: boolean, default: true }
        blockContacts: { type: boolean, default: true }
        bannedWords: { type: array, items: { type: string } }
        historyLimitMax: { type: integer, default: 100 }
        generalRoom: { type: boolean, default: true }
        futuresRooms: { type: boolean, default: true }
        reportsToHide: { type: integer, default: 0, description: 达到该举报数自动隐藏（0=关闭） }
    ChatSanction:
      type: object
      properties:
        uid: { type: string }
        mutedUntil: { type: string, format: date-time, nullable: true }
        banned: { type: boolean }
        reason: { type: string }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    ChatReport:
      type: object
      properties:
        id: { type: integer, format: int64 }
        messageId: { type: integer, format: int64 }
        reporter: { type: string }
        reason: { type: string }
        status: { type: string, enum: [open, resolved, dismissed] }
        handledBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        message: { $ref: "#/components/schemas/ChatAdminMessage" }
    ChatChange:
      type: object
      properties:
        before: { type: object, additionalProperties: true, nullable: true }
        after: { type: object, additionalProperties: true, nullable: true }
    LoanMarket:
      type: object
      properties:
        asset: { type: string, example: USDT }
        terms:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              term: { type: string }
              hourlyRate: { type: string, description: 十进制字符串 }
              status: { type: string }
        collaterals:
          type: array
          items:
            type: object
            properties:
              asset: { type: string }
              cap: { type: string, description: 十进制字符串 }
              price: { type: string, description: 十进制字符串 }
        initialLtv: { type: string, description: 十进制字符串 }
        warnLtv: { type: string, description: 十进制字符串 }
        liquidationLtv: { type: string, description: 十进制字符串 }
        userLimit: { type: string, description: 十进制字符串 }
        minAmount: { type: string, description: 十进制字符串 }
        overdueMultiplier: { type: string, description: 十进制字符串 }
        overdueLiquidationDays: { type: integer }
        liquidationFeeRate: { type: string, description: 十进制字符串 }
        earlyRepayPenaltyRate: { type: string, description: 十进制字符串 }
    LoanQuote:
      type: object
      properties:
        amount: { type: string, description: 十进制字符串 }
        collateral: { type: string, description: 十进制字符串 }
        price: { type: string, description: 十进制字符串 }
        ltv: { type: string, description: 十进制字符串 }
        hourlyRate: { type: string, description: 十进制字符串 }
        hourlyInterest: { type: string, description: 十进制字符串 }
        termInterest: { type: string, description: 十进制字符串 }
        liquidationPrice: { type: string, description: 十进制字符串 }
    BorrowRequest:
      type: object
      required: [collateralAsset, amount, term]
      properties:
        collateralAsset: { type: string, example: BTC }
        amount: { type: string, example: "1000" }
        collateralAmount: { type: string, description: 不填则按初始质押率 }
        term: { type: string, example: flexible }
    Loan:
      type: object
      properties:
        id: { type: integer }
        asset: { type: string }
        collateralAsset: { type: string }
        term: { type: string }
        hourlyRate: { type: string, description: 十进制字符串 }
        initialPrincipal: { type: string, description: 十进制字符串 }
        initialCollateral: { type: string, description: 十进制字符串 }
        principal: { type: string, description: 十进制字符串 }
        collateral: { type: string, description: 十进制字符串 }
        interest: { type: string, description: 十进制字符串 }
        interestPaid: { type: string, description: 十进制字符串 }
        debt: { type: string, description: 十进制字符串 }
        status: { type: string, example: active }
        hoursCharged: { type: integer }
        startedAt: { type: integer, format: int64 }
        dueAt: { type: integer, format: int64 }
        closedAt: { type: integer, format: int64 }
        overdue: { type: boolean }
        price: { type: string, description: 十进制字符串 }
        ltv: { type: string, description: 十进制字符串 }
        liquidationPrice: { type: string, description: 十进制字符串 }
        warning: { type: boolean }
    LoanList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Loan" } }
    LoanRepayResult:
      allOf:
        - $ref: "#/components/schemas/Loan"
        - type: object
          properties:
            repaid:
              type: object
              properties:
                principal: { type: string, description: 十进制字符串 }
                interest: { type: string, description: 十进制字符串 }
                penalty: { type: string, description: 十进制字符串 }
                total: { type: string, description: 十进制字符串 }
                collateralReleased: { type: string, description: 十进制字符串 }
    LoanSummary:
      type: object
      properties:
        active: { type: integer }
        totalDebt: { type: string, description: 十进制字符串 }
        totalCollateralValue: { type: string, description: 十进制字符串 }
        asset: { type: string }
    LoanRecord:
      type: object
      properties:
        id: { type: integer }
        loanId: { type: integer }
        type: { type: string }
        amount: { type: string, description: 十进制字符串 }
        interest: { type: string, description: 十进制字符串 }
        penalty: { type: string, description: 十进制字符串 }
        collateral: { type: string, description: 十进制字符串 }
        price: { type: string, description: 十进制字符串 }
        ltv: { type: string, description: 十进制字符串 }
        term: { type: string }
        asset: { type: string }
        collateralAsset: { type: string }
        time: { type: integer, format: int64 }
        detail: { type: object, additionalProperties: true }
    LoanRecordList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LoanRecord" } }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 业务错误码
          example: VALIDATION_ERROR
        message:
          type: string
          description: 可读错误信息
          example: 请求参数不合法
        requestId:
          type: string
          nullable: true
          description: 便于排查的请求 ID
          example: req_8c1f2a
        details:
          type: array
          nullable: true
          description: 字段级错误明细
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }

    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        total: { type: integer, example: 42 }

    SendCodeRequest:
      type: object
      required: [purpose]
      description: >
        请求邮箱/短信验证码。register / reset_password 为公开接口；二选一提供
        email 或 phone（手机号可用 E.164 的 "+8613800138000"，或 phone + countryCode
        拨号区号组合）。为避免账号枚举，reset_password 对不存在的账号也返回 200。
      properties:
        purpose:
          type: string
          enum: [register, reset_password]
          example: register
        email: { type: string, format: email, nullable: true, example: trader@example.com }
        phone: { type: string, nullable: true, description: E.164 或本地号, example: "13800138000" }
        countryCode: { type: string, nullable: true, description: 国家拨号码（如 86）, example: "86" }

    SendCodeResponse:
      type: object
      required: [sent, channel]
      description: 发送验证码的统一响应（/auth/code/send 与 /account/code/send 共用）。
      properties:
        sent: { type: boolean, example: true }
        channel: { type: string, enum: [email, sms], example: sms }
        ttlSeconds: { type: integer, description: 验证码有效期（秒）, example: 600 }

    RegisterRequest:
      type: object
      required: [password, code]
      description: 邮箱或手机号二选一；注册需验证码（先调用 /auth/code/send）。
      properties:
        email: { type: string, format: email, nullable: true, example: trader@example.com }
        phone: { type: string, nullable: true, example: "13800138000" }
        countryCode: { type: string, nullable: true, example: "86" }
        password: { type: string, format: password, minLength: 8, example: "Str0ng-Passw0rd!" }
        code: { type: string, description: 6 位验证码, example: "123456" }
        inviteCode: { type: string, nullable: true, example: LB8DEMO }

    LoginRequest:
      type: object
      required: [password]
      description: >
        邮箱或手机号二选一 + 密码。密码正确后若需二次验证（已开启 TOTP、或新设备
        登录触发邮箱/短信验证），返回 LoginChallenge 而非 AuthTokens。
      properties:
        email: { type: string, format: email, nullable: true, example: trader@example.com }
        phone: { type: string, nullable: true, description: E.164 或本地号, example: "+8613800138000" }
        countryCode: { type: string, nullable: true, description: 手机号为本地号时提供国家拨号码（如 86）, example: "86" }
        password: { type: string, format: password, example: "Str0ng-Passw0rd!" }
        deviceId: { type: string, nullable: true, description: 客户端稳定设备标识；缺省时按 User-Agent 推断, example: web-7f3a }
        deviceName: { type: string, nullable: true, example: Chrome on macOS }

    LoginChallenge:
      type: object
      required: [challengeToken, methods, expiresIn]
      description: 二次验证票据。用 challengeToken 调 /auth/login/verify 换取令牌。
      properties:
        challengeToken: { type: string, example: 3kZ9...challenge }
        methods:
          type: array
          description: 需要完成的二次验证方式（当前恒为单个）。
          items: { type: string, enum: [totp, email, sms] }
          example: [sms]
        expiresIn: { type: integer, description: 票据有效期（秒）, example: 300 }

    LoginVerifyRequest:
      type: object
      required: [challengeToken]
      properties:
        challengeToken: { type: string, example: 3kZ9...challenge }
        totpCode: { type: string, nullable: true, description: method=totp 时必填, example: "123456" }
        code: { type: string, nullable: true, description: method=email/sms 时必填, example: "123456" }

    VerifyResetCodeRequest:
      type: object
      required: [code]
      description: 找回密码第一步请求：邮箱或手机号二选一 + 验证码。
      properties:
        email: { type: string, format: email, nullable: true, example: trader@example.com }
        phone: { type: string, nullable: true, example: "13800138000" }
        countryCode: { type: string, nullable: true, example: "86" }
        code: { type: string, example: "123456" }

    VerifyResetCodeResponse:
      type: object
      required: [resetToken, expiresIn]
      description: 一次性重置令牌（默认 10 分钟有效），用于 /auth/password/reset。
      properties:
        resetToken: { type: string, example: "3kZ9...resetTok" }
        expiresIn: { type: integer, description: resetToken 有效期（秒）, example: 600 }

    PasswordResetRequest:
      type: object
      required: [resetToken, newPassword]
      description: 校验验证码后重置密码，并撤销该用户全部会话（refresh token）。
      properties:
        resetToken: { type: string, description: 由 /auth/password/verify-code 返回, example: "3kZ9...resetTok" }
        newPassword: { type: string, format: password, minLength: 8, example: "N3w-Passw0rd!" }

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, enum: [Bearer], example: Bearer }
        expiresIn: { type: integer, description: accessToken 有效期（秒）, example: 3600 }

    TotpBinding:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, example: JBSWY3DPEHPK3PXP }
        otpauthUri:
          type: string
          example: otpauth://totp/Linbit:trader@example.com?secret=JBSWY3DPEHPK3PXP&issuer=Linbit

    TwoFactorStatus:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean, example: true }
        method:
          type: string
          nullable: true
          enum: [totp, null]
          example: totp

    Account:
      type: object
      required: [uid, kycLevel, twoFactorEnabled, createdAt]
      properties:
        uid: { type: string, example: "80000001" }
        email: { type: string, format: email, nullable: true, example: trader@example.com }
        phone: { type: string, nullable: true, description: E.164, example: "+8613800138000" }
        countryCode: { type: string, example: "86" }
        nickname: { type: string, nullable: true, example: lb_Trader }
        avatarUrl: { type: string, nullable: true, example: https://cdn.example.com/avatar/lb.png }
        kycLevel: { type: integer, example: 1 }
        twoFactorEnabled: { type: boolean, example: true }
        emailVerified: { type: boolean, example: true }
        phoneVerified: { type: boolean, example: true }
        withdrawWhitelistEnabled: { type: boolean, example: false }
        createdAt: { type: string, format: date-time, example: "2026-01-05T08:30:00Z" }

    UpdateProfileRequest:
      type: object
      description: 至少提供一个字段。头像一期只存 URL（http/https，≤512）。
      properties:
        nickname: { type: string, nullable: true, minLength: 1, maxLength: 32, example: lb_Trader }
        avatarUrl: { type: string, nullable: true, example: https://cdn.example.com/avatar/lb.png }

    SendCodeAuthedRequest:
      type: object
      required: [purpose]
      description: 向当前登录用户自己的邮箱/手机发送验证码，用于敏感操作前置校验。
      properties:
        purpose: { type: string, enum: [address, bind, reset_password], example: address }
        channel: { type: string, nullable: true, enum: [email, sms], description: 缺省按账户已绑定的联系方式, example: sms }

    Device:
      type: object
      required: [deviceId, firstSeen, lastSeen]
      properties:
        deviceId: { type: string, description: 设备指纹（移除设备时回传）, example: "cid:web-7f3a" }
        name: { type: string, example: Chrome on macOS }
        userAgent: { type: string, example: "Mozilla/5.0 ..." }
        ip: { type: string, example: "203.0.113.7" }
        current: { type: boolean, description: 是否为当前请求所在设备, example: true }
        firstSeen: { type: string, format: date-time, example: "2026-11-01T10:00:00Z" }
        lastSeen: { type: string, format: date-time, example: "2026-11-03T08:30:00Z" }

    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Device" }

    WhitelistStatus:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean, example: false }

    SetWhitelistRequest:
      type: object
      required: [enabled]
      description: 开关提现白名单；需验证码或 2FA（二选一）。
      properties:
        enabled: { type: boolean, example: true }
        totpCode: { type: string, nullable: true, description: 已开启 2FA 时提供, example: "123456" }
        code: { type: string, nullable: true, description: 未开启 2FA 时提供（purpose=address）, example: "123456" }

    WithdrawAddress:
      type: object
      required: [id, asset, network, address, whitelisted, createdAt]
      properties:
        id: { type: string, example: "1" }
        asset: { type: string, example: USDT }
        network: { type: string, example: TRC20 }
        address: { type: string, example: TXy1Z9DemoAddr000000000000000000000 }
        memo: { type: string, example: "" }
        label: { type: string, example: cold-wallet }
        whitelisted: { type: boolean, example: true }
        createdAt: { type: string, format: date-time, example: "2026-11-03T08:30:00Z" }

    WithdrawAddressList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WithdrawAddress" }

    CreateWithdrawAddressRequest:
      type: object
      required: [asset, network, address]
      description: 新增地址簿条目；需验证码或 2FA（二选一）。
      properties:
        asset: { type: string, example: USDT }
        network: { type: string, example: TRC20 }
        address: { type: string, example: TXy1Z9DemoAddr000000000000000000000 }
        memo: { type: string, nullable: true, example: "" }
        label: { type: string, nullable: true, example: cold-wallet }
        whitelisted: { type: boolean, nullable: true, example: true }
        totpCode: { type: string, nullable: true, example: "123456" }
        code: { type: string, nullable: true, example: "123456" }

    KycSubmission:
      type: object
      required: [firstName, lastName, country, idType, idNumber, dateOfBirth]
      properties:
        firstName: { type: string, example: San }
        lastName: { type: string, example: Zhang }
        country: { type: string, description: ISO 3166-1 alpha-2, example: SG }
        idType:
          type: string
          enum: [passport, id_card, driver_license]
          example: passport
        idNumber: { type: string, example: E12345678 }
        dateOfBirth: { type: string, format: date, example: "1992-04-18" }
        level:
          type: integer
          enum: [1, 2]
          description: 1 = 基础认证（不填默认 1）；2 = 高级认证（需基础认证已通过）
        documents:
          type: object
          description: |
            由 POST /kyc/documents 返回的 fileId；front 与 selfie 必填，back 可选；
            高级认证（level 2）还必须提供 proofOfAddress（side=proof_of_address 的地址证明），
            缺失时返回 400 DOCUMENT_REQUIRED。
          properties:
            front: { type: string, example: doc_1 }
            selfie: { type: string, example: doc_2 }
            back: { type: string, example: doc_3 }
            proofOfAddress: { type: string, example: doc_4, description: 地址证明（level 2 必填） }

    KycDocument:
      type: object
      required: [fileId, side]
      properties:
        fileId: { type: string, example: doc_1 }
        side: { type: string, enum: [front, selfie, back, proof_of_address] }

    KycApplication:
      type: object
      required: [id, userId, level, status, submittedAt]
      properties:
        id: { type: string, example: app_1 }
        userId: { type: string }
        level: { type: integer, enum: [1, 2] }
        status: { type: string, enum: [pending, approved, rejected] }
        firstName: { type: string }
        lastName: { type: string }
        country: { type: string }
        idType: { type: string, enum: [passport, id_card, driver_license] }
        idNumber: { type: string }
        dateOfBirth: { type: string, format: date }
        reason: { type: string, nullable: true }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time, nullable: true }
        documents:
          type: array
          description: 仅详情接口返回；url 为受控读取地址（同样需要内部令牌）
          items:
            type: object
            properties:
              side: { type: string, enum: [front, selfie, back, proof_of_address] }
              fileId: { type: string }
              url: { type: string, example: /admin/kyc/documents/doc_1 }

    KycStatus:
      type: object
      required: [level, status]
      properties:
        level: { type: integer, example: 1 }
        status:
          type: string
          enum: [none, pending, approved, rejected]
          example: approved
        submittedAt: { type: string, format: date-time, nullable: true, example: "2026-11-01T10:00:00Z" }
        reason: { type: string, nullable: true, example: null }

    Balance:
      type: object
      required: [asset, free, locked, total]
      properties:
        asset: { type: string, example: USDT }
        free: { type: string, description: 可用（字符串防精度丢失）, example: "10520.33000000" }
        locked: { type: string, example: "250.00000000" }
        total: { type: string, example: "10770.33000000" }
        valuationUsd: { type: string, nullable: true, example: "10770.33" }

    PaginatedBalances:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Balance" }

    DepositAddress:
      type: object
      required: [asset, network, address]
      properties:
        asset: { type: string, example: USDT }
        network: { type: string, example: TRC20 }
        address: { type: string, example: TXy1Z9DemoAddr000000000000000000000 }
        memo: { type: string, nullable: true, example: null }
        minDeposit: { type: string, nullable: true, example: "1.00000000" }

    Deposit:
      type: object
      required: [id, asset, network, amount, status, createdAt]
      properties:
        id: { type: string, example: dep_0001 }
        asset: { type: string, example: USDT }
        network: { type: string, example: TRC20 }
        amount: { type: string, example: "500.00000000" }
        txId: { type: string, nullable: true, example: 9a7b...demo }
        status:
          type: string
          enum: [pending, completed, failed]
          example: completed
        confirmations: { type: integer, nullable: true, example: 20 }
        createdAt: { type: string, format: date-time, example: "2026-10-30T12:00:00Z" }

    PaginatedDeposits:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Deposit" }

    WithdrawRequest:
      type: object
      required: [asset, network, address, amount]
      properties:
        asset: { type: string, example: USDT }
        network: { type: string, example: TRC20 }
        address: { type: string, example: TXy1Z9DemoAddr000000000000000000000 }
        amount: { type: string, example: "100.00000000" }
        memo: { type: string, nullable: true, example: null }
        totpCode:
          type: string
          nullable: true
          description: 已开启 2FA 时必填
          example: "123456"
        code:
          type: string
          nullable: true
          description: >
            未开启 2FA 时必填：发到用户邮箱/手机的验证码（purpose=withdraw）。
            与 totpCode 二选一，由服务端按账户状态校验。
          example: "123456"

    Withdrawal:
      type: object
      required: [id, asset, network, address, amount, fee, status, createdAt]
      properties:
        id: { type: string, example: wd_0001 }
        asset: { type: string, example: USDT }
        network: { type: string, example: TRC20 }
        address: { type: string, example: TXy1Z9DemoAddr000000000000000000000 }
        amount: { type: string, example: "100.00000000" }
        fee:
          type: string
          description: >
            链上 Gas 费（不含平台手续费——提现不收平台手续费）。等同于 gasFee，保留
            以兼容既有字段。
          example: "1.00000000"
        gasFee:
          type: string
          nullable: true
          description: 实际结算的链上 Gas 费；下单时按 gasFeeEstimate 估算。
          example: "1.00000000"
        gasFeeAsset:
          type: string
          nullable: true
          description: Gas 费计价资产（通常为该网络的原生币或被提资产）。
          example: USDT
        status:
          type: string
          enum: [pending, processing, completed, failed, canceled]
          example: pending
        createdAt: { type: string, format: date-time, example: "2026-11-02T10:05:00Z" }

    WithdrawNetwork:
      type: object
      required: [network]
      properties:
        network: { type: string, example: TRC20 }
        minWithdraw: { type: string, nullable: true, example: "12.00000000" }
        maxWithdraw:
          type: string
          nullable: true
          description: 单笔最大提现数量；USDT 各网络为 20000。为空表示无上限。
          example: "20000.00000000"
        gasFeeEstimate:
          type: string
          nullable: true
          description: 预估链上 Gas 费（提现唯一费用，无平台手续费）。实现前可为 null。
          example: "1.00000000"
        gasFeeAsset:
          type: string
          nullable: true
          description: Gas 费计价资产。
          example: USDT
        confirmations:
          type: integer
          nullable: true
          description: 该网络的到账确认数（充值需达到该确认数才入账；提现完成后等待该确认数结算）。
          example: 19

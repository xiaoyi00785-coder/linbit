  /market/ticker:
    get:
      tags: [Market]
      summary: 24 小时行情 ticker（单个或全部）
      description: >
        传入 `symbol` 时返回该交易对的单个 Ticker 对象；不传 `symbol` 时返回全部
        交易对的 Ticker 数组。响应为二者之一（见 oneOf）。价格、quoteVolume 按交易对
        计价币精度，base 成交量按数量精度，均为十进制字符串。
      operationId: getTicker
      security: []
      parameters:
        - name: symbol
          in: query
          required: false
          description: 传入则返回单个对象；不传则返回全部交易对的数组
          schema: { type: string }
          example: BTCUSDT
      responses:
        "200":
          description: >
            行情数据。带 `symbol` 为单个 Ticker 对象；不带为 Ticker 数组。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Ticker"
                  - type: array
                    items: { $ref: "#/components/schemas/Ticker" }
              examples:
                single:
                  summary: 带 symbol — 单个对象
                  value:
                    symbol: BTCUSDT
                    lastPrice: "76771.90"
                    priceChangePercent: "-1.71"
                    high: "78878.00"
                    low: "76705.00"
                    volume: "371.65"
                    quoteVolume: "28915681.30"
                all:
                  summary: 不带 symbol — 数组
                  value:
                    - symbol: BTCUSDT
                      lastPrice: "76771.90"
                      priceChangePercent: "-1.71"
                      high: "78878.00"
                      low: "76705.00"
                      volume: "371.65"
                      quoteVolume: "28915681.30"
                    - symbol: ETHUSDT
                      lastPrice: "2252.77"
                      priceChangePercent: "-0.82"
                      high: "2301.10"
                      low: "2230.00"
                      volume: "12850.40"
                      quoteVolume: "28996512.10"

  /market/depth:
    get:
      tags: [Market]
      summary: 订单簿深度
      operationId: getDepth
      security: []
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string }
          example: BTCUSDT
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 200
      responses:
        "200":
          description: 订单簿
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Depth" }
              example:
                symbol: BTCUSDT
                lastUpdateId: 123456789
                bids:

openapi: 3.0.3
info:
  title: Linbit Exchange API
  description: |
    Linbit 加密货币交易所 REST API。

    - 统一错误模型（`Error`），业务错误码放在 `code` 字段。
    - 除公开行情接口外，均需 `Authorization: Bearer <accessToken>`。
    - 列表接口统一使用 `page` / `pageSize` 游标分页，返回 `Paginated*` 包装。

    该文档同时用于 Prism mock（`pnpm mock`）、生成 TypeScript 类型（`@linbit/api-client`），
    以及未来生成 Kotlin / Swift 客户端，请保持 `examples` 完整。
  version: 1.0.0
  contact:
    name: Linbit Platform
    url: https://linbit.example.com
  license:
    name: Proprietary
servers:
  - url: https://api.cowa.click
    description: Cowa 生产网关
  - url: http://localhost:4010
    description: 本地 Prism mock
  - url: https://api.linbit.example.com/v1
    description: 生产环境
tags:
  - name: Auth
    description: 注册、登录、令牌刷新与登出
  - name: 2FA
    description: 基于 TOTP 的双重验证
  - name: Account
    description: 账户信息
  - name: KYC
    description: 身份认证（基础认证 level 1、高级认证 level 2）
  - name: KYC Admin
    description: KYC 审核（仅内部，需 X-Internal-Token；网关不转发 /admin/*）
  - name: Assets
    description: 资产余额
  - name: Wallet
    description: 充值与提现
  - name: Spot
    description: 现货交易
  - name: Notifications
    description: 站内信 / 消息中心（account 服务）
  - name: Coupons
    description: 卡券中心（体验金、抵扣金；growth 服务）
  - name: Partner
    description: 合伙人（返佣 4 档 + 上级额外返佣最多两级；growth 服务）
  - name: Copy Trading
    description: 合约跟单（仅合约，带单分润 0–50%，按天结算；futures 服务）
  - name: Market
    description: 行情数据（公开）
  - name: Loans
    description: 质押借币（借 USDT，质押 BTC/ETH 等；earn 服务；USDC 不可借）
  - name: Chat
    description: 交易对聊天室（market-data 服务；功能开关 chat；WS 频道 chat:{room}）

paths:
  /auth/code/send:
    post:
      tags: [Auth]
      summary: 发送注册/找回密码验证码
      operationId: sendAuthCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendCodeRequest" }
            example:
              purpose: register
              phone: "13800138000"
              countryCode: "86"
      responses:
        "200":
          description: 已发送（reset_password 对不存在账号也返回 200）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendCodeResponse" }
              example: { sent: true, channel: sms, ttlSeconds: 600 }
        "400":
          description: 参数错误（VALIDATION_ERROR），或收件邮箱无效/无法投递（INVALID_EMAIL）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: INVALID_EMAIL, message: 邮箱地址无效或无法接收邮件，请检查后重试 }
        "429":
          description: 发送过于频繁
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: RATE_LIMITED, message: 验证码发送过于频繁，请稍后再试 }
        "503":
          description: 邮件/短信通道不可用（EMAIL_UNAVAILABLE / SMS_UNAVAILABLE），原因见服务端日志
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: EMAIL_UNAVAILABLE, message: email delivery unavailable }

  /auth/register:
    post:
      tags: [Auth]
      summary: 注册新账户
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: trader@example.com
              password: "Str0ng-Passw0rd!"
              code: "123456"
              inviteCode: LB8DEMO
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access
                refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh
                tokenType: Bearer
                expiresIn: 3600
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: 邮箱已被注册
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: AUTH_EMAIL_EXISTS
                message: 该邮箱已被注册
                requestId: req_8c1f2a

  /auth/login:
    post:
      tags: [Auth]
      summary: 登录
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: trader@example.com
              password: "Str0ng-Passw0rd!"
              deviceId: web-7f3a
      responses:
        "200":
          description: >
            密码正确。若无需二次验证返回 AuthTokens；若需要（已开启 TOTP 或新设备
            触发邮箱/短信验证）返回 LoginChallenge。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthTokens"
                  - $ref: "#/components/schemas/LoginChallenge"
              examples:
                tokens:
                  summary: 无需二次验证
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access
                    refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh
                    tokenType: Bearer
                    expiresIn: 3600
                challenge:
                  summary: 需二次验证
                  value:
                    challengeToken: 3kZ9...challenge
                    methods: [sms]
                    expiresIn: 300
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/login/verify:
    post:
      tags: [Auth]
      summary: 提交二次验证，换取令牌
      operationId: loginVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginVerifyRequest" }
            example: { challengeToken: 3kZ9...challenge, code: "123456" }
      responses:
        "200":
          description: 验证通过
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/login/code:
    post:
      tags: [Auth]
      summary: 重新发送登录二次验证码（email/sms）
      operationId: loginResendCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken]
              properties:
                challengeToken: { type: string }
            example: { challengeToken: 3kZ9...challenge }
      responses:
        "200": { description: 已发送 }
        "400":
          description: 参数错误（VALIDATION_ERROR），或收件邮箱无效/无法投递（INVALID_EMAIL）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: INVALID_EMAIL, message: 邮箱地址无效或无法接收邮件，请检查后重试 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: 发送过于频繁 }
        "503":
          description: 邮件/短信通道不可用（EMAIL_UNAVAILABLE / SMS_UNAVAILABLE），原因见服务端日志
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: EMAIL_UNAVAILABLE, message: email delivery unavailable }

  /auth/password/verify-code:
    post:
      tags: [Auth]
      summary: 找回密码-校验验证码并换取重置令牌
      description: >
        找回密码第一步：校验邮箱/短信验证码，成功后返回短期有效（默认 10 分钟）、
        一次性的 resetToken，随后用它调用 /auth/password/reset 设置新密码。
      operationId: verifyPasswordResetCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyResetCodeRequest" }
            example:
              phone: "13800138000"
              countryCode: "86"
              code: "123456"
      responses:
        "200":
          description: 验证码正确，返回重置令牌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyResetCodeResponse" }
              example: { resetToken: "3kZ9...resetTok", expiresIn: 600 }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/password/reset:
    post:
      tags: [Auth]
      summary: 使用重置令牌设置新密码（撤销全部会话）
      description: 找回密码第二步：用 /auth/password/verify-code 返回的 resetToken 设置新密码。
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
            example:
              resetToken: "3kZ9...resetTok"
              newPassword: "N3w-Passw0rd!"
      responses:
        "204": { description: 重置成功 }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新访问令牌
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
            example:
              refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.newaccess
                refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.newrefresh
                tokenType: Bearer
                expiresIn: 3600
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: 登出（吊销当前刷新令牌）
      operationId: logout
      responses:
        "204":
          description: 已登出
        "401": { $ref: "#/components/responses/Unauthorized" }

  /2fa/totp/bind:
    post:
      tags: [2FA]
      summary: 开始绑定 TOTP（返回密钥与 otpauth URI）
      operationId: bindTotp
      responses:
        "200":
          description: 返回待绑定的密钥
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpBinding" }
              example:
                secret: JBSWY3DPEHPK3PXP
                otpauthUri: otpauth://totp/Linbit:trader@example.com?secret=JBSWY3DPEHPK3PXP&issuer=Linbit
        "401": { $ref: "#/components/responses/Unauthorized" }

  /2fa/totp/verify:
    post:
      tags: [2FA]
      summary: 校验 TOTP 验证码并启用 2FA
      operationId: verifyTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 6 位 TOTP 验证码
            example:
              code: "123456"
      responses:
        "200":
          description: 2FA 已启用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorStatus" }
              example:
                enabled: true
                method: totp
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /2fa/totp/disable:
    post:
      tags: [2FA]
      summary: 关闭 TOTP 二次验证
      operationId: disableTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
            example:
              code: "123456"
      responses:
        "200":
          description: 2FA 已关闭
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorStatus" }
              example:
                enabled: false
                method: null
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account:
    get:
      tags: [Account]
      summary: 获取当前账户信息
      operationId: getAccount
      responses:
        "200":
          description: 账户信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
              example:
                uid: "80000001"
                email: trader@example.com
                nickname: lb_Trader
                kycLevel: 1
                twoFactorEnabled: true
                createdAt: "2026-01-05T08:30:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/profile:
    patch:
      tags: [Account]
      summary: 修改昵称 / 头像
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
            example: { nickname: lb_Trader, avatarUrl: https://cdn.example.com/avatar/lb.png }
      responses:
        "200":
          description: 更新后的账户信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/avatar:
    post:
      tags: [Account]
      summary: 上传头像（multipart）
      description: >
        以 multipart/form-data 上传头像图片（字段名 file）。服务端按内容嗅探类型
        （仅支持 jpeg/png/webp），并限制大小（默认 2MB，可配置）。存储后返回更新后的
        账户信息，其中 avatarUrl 指向受控访问路由 /account/avatars/{file}。
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 头像图片（jpeg/png/webp，≤2MB）
      responses:
        "200":
          description: 上传成功，返回更新后的账户信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: 文件过大
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: FILE_TOO_LARGE, message: 头像超过大小限制 }
        "415":
          description: 不支持的图片类型
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: UNSUPPORTED_MEDIA_TYPE, message: 仅支持 JPEG/PNG/WEBP 图片 }

  /account/avatars/{file}:
    get:
      tags: [Account]
      summary: 读取已上传头像（受控访问路由，公开）
      description: 由本地存储后端通过受控路由提供头像访问；仅服务存储目录内文件，阻止路径穿越。
      operationId: getAvatar
      security: []
      parameters:
        - name: file
          in: path
          required: true
          description: 相对存储键（如 80000001/ab12cd.png）
          schema: { type: string }
      responses:
        "200":
          description: 头像图片
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }

  /account/code/send:
    post:
      tags: [Account]
      summary: 向本人发送敏感操作验证码
      operationId: sendAccountCode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendCodeAuthedRequest" }
            example: { purpose: address, channel: sms }
      responses:
        "200":
          description: 已发送
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendCodeResponse" }
              example: { sent: true, channel: sms, ttlSeconds: 600 }
        "400":
          description: 参数错误（VALIDATION_ERROR），或收件邮箱无效/无法投递（INVALID_EMAIL）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: INVALID_EMAIL, message: 邮箱地址无效或无法接收邮件，请检查后重试 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: 发送过于频繁 }
        "503":
          description: 邮件/短信通道不可用（EMAIL_UNAVAILABLE / SMS_UNAVAILABLE），原因见服务端日志
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: EMAIL_UNAVAILABLE, message: email delivery unavailable }

  /account/devices:
    get:
      tags: [Account]
      summary: 列出登录设备
      operationId: listDevices
      responses:
        "200":
          description: 设备列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/devices/{deviceId}:
    delete:
      tags: [Account]
      summary: 移除设备（撤销该设备会话）
      operationId: removeDevice
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: 已移除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /account/withdraw-whitelist:
    get:
      tags: [Account]
      summary: 查询提现白名单开关
      operationId: getWithdrawWhitelist
      responses:
        "200":
          description: 开关状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhitelistStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Account]
      summary: 开关提现白名单（需验证码或 2FA）
      operationId: setWithdrawWhitelist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetWhitelistRequest" }
            example: { enabled: true, code: "123456" }
      responses:
        "200":
          description: 新状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhitelistStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/withdraw-addresses:
    get:
      tags: [Account]
      summary: 提现地址簿列表
      operationId: listWithdrawAddresses
      responses:
        "200":
          description: 地址簿
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithdrawAddressList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Account]
      summary: 新增提现地址（需验证码或 2FA）
      operationId: createWithdrawAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWithdrawAddressRequest" }
            example:
              asset: USDT
              network: TRC20
              address: TXy1Z9DemoAddr000000000000000000000
              label: cold-wallet
              code: "123456"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithdrawAddress" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: 地址已存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: ADDRESS_EXISTS, message: 该地址已在地址簿中 }

  /account/withdraw-addresses/{id}:
    delete:
      tags: [Account]
      summary: 删除提现地址（需验证码或 2FA）
      operationId: deleteWithdrawAddress
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: false
          description: 未开启 2FA 时提供（purpose=address）
          schema: { type: string }
        - name: totpCode
          in: query
          required: false
          description: 已开启 2FA 时提供
          schema: { type: string }
      responses:
        "204": { description: 已删除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /kyc:
    post:
      tags: [KYC]
      summary: 提交 KYC 认证资料
      operationId: submitKyc
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KycSubmission" }
            example:
              firstName: San
              lastName: Zhang
              country: SG
              idType: passport
              idNumber: E12345678
              dateOfBirth: "1992-04-18"
      responses:
        "202":
          description: 已受理，进入审核
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
              example:
                level: 1
                status: pending
                submittedAt: "2026-11-02T10:00:00Z"
                reason: null
        "400":
          description: |
            参数错误：VALIDATION_ERROR、UNDERAGE（默认未满 18 岁，KYC_MIN_AGE 可配）、
            KYC_LEVEL_REQUIRED（高级认证需先通过基础认证）、DOCUMENT_NOT_FOUND、DOCUMENT_SIDE_MISMATCH
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: KYC_PENDING（已有审核中的申请）或 ID_NUMBER_TAKEN（证件已被其他账户认证） }

  /kyc/status:
    get:
      tags: [KYC]
      summary: 查询 KYC 状态
      operationId: getKycStatus
      responses:
        "200":
          description: KYC 状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
              example:
                level: 1
                status: approved
                submittedAt: "2026-11-01T10:00:00Z"
                reason: null
        "401": { $ref: "#/components/responses/Unauthorized" }


  /kyc/documents:
    post:
      tags: [KYC]
      summary: 上传 KYC 证件图片
      description: |
        multipart/form-data。按文件内容识别类型，仅支持 JPEG/PNG；默认上限 10MB
        （KYC_DOC_MAX_BYTES 可配）。文件只属于上传者，提交 /kyc 时校验归属与 side。
      operationId: uploadKycDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, side]
              properties:
                file: { type: string, format: binary }
                side: { type: string, enum: [front, selfie, back, proof_of_address] }
      responses:
        "201":
          description: 已上传
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: 文件过大（FILE_TOO_LARGE） }
        "415": { description: 不支持的文件类型（UNSUPPORTED_MEDIA_TYPE） }

  /admin/kyc/applications:
    get:
      tags: [KYC Admin]
      summary: 审核列表
      operationId: adminListKycApplications
      security: [{ internalToken: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        "200":
          description: 申请列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/KycApplication" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/kyc/applications/{id}:
    get:
      tags: [KYC Admin]
      summary: 申请详情（含证件受控读取地址）
      operationId: adminGetKycApplication
      security: [{ internalToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: app_1 } }
      responses:
        "200":
          description: 申请详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycApplication" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/kyc/applications/{id}/approve:
    post:
      tags: [KYC Admin]
      summary: 审核通过（同步账户 kycLevel，只升不降）
      operationId: adminApproveKyc
      security: [{ internalToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 已通过
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycApplication" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: 不在待审核状态（NOT_PENDING）或证件已被他人认证（ID_NUMBER_TAKEN） }

  /admin/kyc/applications/{id}/reject:
    post:
      tags: [KYC Admin]
      summary: 驳回（reason 必填，用户可重新提交）
      operationId: adminRejectKyc
      security: [{ internalToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, example: 证件照片模糊 }
      responses:
        "200":
          description: 已驳回
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycApplication" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: 不在待审核状态（NOT_PENDING） }

  /admin/kyc/documents/{id}:
    get:
      tags: [KYC Admin]
      summary: 受控读取证件图片
      operationId: adminGetKycDocument
      security: [{ internalToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: doc_1 } }
      responses:
        "200":
          description: 图片内容
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/kyc/level-sync:
    get:
      tags: [KYC Admin]
      summary: 待同步到账户服务的认证等级（失败自动重试队列）
      description: |
        审核通过后先持久化同步任务再立即尝试；失败按指数退避（默认 5s 起翻倍，
        上限 1h，KYC_SYNC_BASE_SECONDS / KYC_SYNC_MAX_SECONDS）自动重试直至成功。
      operationId: adminListKycLevelSync
      security: [{ internalToken: [] }]
      responses:
        "200":
          description: 未完成的同步任务
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        userId: { type: string }
                        level: { type: integer }
                        attempts: { type: integer }
                        nextAttemptAt: { type: string, format: date-time }
                        lastError: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /assets/balances:
    get:
      tags: [Assets]
      summary: 获取资产余额列表
      operationId: getBalances
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 余额列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedBalances" }
              example:
                items:
                  - asset: USDT
                    free: "10520.33000000"
                    locked: "250.00000000"
                    total: "10770.33000000"
                    valuationUsd: "10770.33"
                  - asset: BTC
                    free: "0.52100000"
                    locked: "0.00000000"
                    total: "0.52100000"
                    valuationUsd: "39994.40"
                page: 1
                pageSize: 20
                total: 2
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wallet/deposit/address:
    get:
      tags: [Wallet]
      summary: 获取充值地址
      operationId: getDepositAddress
      parameters:
        - name: asset
          in: query
          required: true
          schema: { type: string }
          example: USDT
        - name: network
          in: query
          required: true
          schema: { type: string }
          example: TRC20
      responses:
        "200":
          description: 充值地址
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositAddress" }
              example:
                asset: USDT
                network: TRC20
                address: TXy1Z9DemoAddr000000000000000000000
                memo: null
                minDeposit: "1.00000000"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wallet/deposit/records:
    get:
      tags: [Wallet]
      summary: 充值记录
      operationId: listDeposits
      parameters:
        - name: asset
          in: query
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 充值记录列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedDeposits" }
              example:
                items:
                  - id: dep_0001
                    asset: USDT
                    network: TRC20
                    amount: "500.00000000"
                    txId: 9a7b...demo
                    status: completed
                    confirmations: 20
                    createdAt: "2026-10-30T12:00:00Z"
                page: 1
                pageSize: 20
                total: 1
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wallet/withdraw:
    post:
      tags: [Wallet]
      summary: 发起提现申请
      operationId: createWithdrawal
      description: |
        Gas 从提现数量中扣除：冻结且扣减的是 amount，用户实际到账 amount − gas；
        amount 必须大于 gas 且不低于网络最小提现数量（否则 MIN_WITHDRAW）。
        未完成 KYC（level 0）不可提现（403 KYC_REQUIRED）。
      x-error-codes: [MIN_WITHDRAW, WITHDRAW_LIMIT_EXCEEDED, PRICE_UNAVAILABLE, KYC_REQUIRED]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WithdrawRequest" }
            example:
              asset: USDT
              network: TRC20
              address: TXy1Z9DemoAddr000000000000000000000
              amount: "100.00000000"
              memo: null
              totpCode: "123456"
      responses:
        "202":
          description: 提现申请已受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Withdrawal" }
              example:
                id: wd_0001
                asset: USDT
                network: TRC20
                address: TXy1Z9DemoAddr000000000000000000000
                amount: "100.00000000"
                fee: "1.00000000"
                status: pending
                createdAt: "2026-11-02T10:05:00Z"
        "400":
          description: |
            参数错误；MIN_WITHDRAW 表示低于最小提现数量或 amount 不大于 Gas；
            WITHDRAW_LIMIT_EXCEEDED 表示超过当前 KYC 等级的 24 小时提现额度
            （USDT 等值，默认 level1=50000、level2=200000，可配置）；非 USDT 资产按
            market-data 实时价格（{ASSET}USDT 最新成交价）折算，无可用价格时拒绝提现并返回
            PRICE_UNAVAILABLE。
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            KYC_REQUIRED：未完成身份认证（KYC level 0）不可提现；或已开启提现白名单，
            但目标地址不在白名单内
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /wallet/withdraw/networks:
    get:
      tags: [Wallet]
      summary: 可提现网络与 Gas 估算
      description: >
        返回某资产可用的提现网络列表及每个网络的链上 Gas 估算。提现不收取平台
        手续费，仅收取链上 Gas，因此前端据此向用户展示预计到账金额。
      operationId: listWithdrawNetworks
      parameters:
        - name: asset
          in: query
          required: true
          schema: { type: string }
          example: USDT
      responses:
        "200":
          description: 网络与 Gas 估算
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithdrawNetworkOptions" }
              example:
                asset: USDT
                networks:
                  - network: TRC20
                    minWithdraw: "12.00000000"
                    gasFeeEstimate: "1.00000000"
                    gasFeeAsset: USDT
                    estimatedArrivalMinutes: 5
                  - network: ERC20
                    minWithdraw: "12.00000000"
                    gasFeeEstimate: "6.50000000"
                    gasFeeAsset: USDT
                    estimatedArrivalMinutes: 10
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wallet/withdraw/records:
    get:
      tags: [Wallet]
      summary: 提现记录
      operationId: listWithdrawals
      parameters:
        - name: asset
          in: query
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 提现记录列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedWithdrawals" }
              example:
                items:
                  - id: wd_0001
                    asset: USDT
                    network: TRC20
                    address: TXy1Z9DemoAddr000000000000000000000
                    amount: "100.00000000"
                    fee: "1.00000000"
                    status: completed
                    createdAt: "2026-10-28T09:00:00Z"
                page: 1
                pageSize: 20
                total: 1
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wallet/withdraw/{id}/cancel:
    post:
      tags: [Wallet]
      summary: 撤销提现申请
      description: >
        仅可撤销处于待人工审核（pending）状态的提现；撤销后冻结金额解冻退回可用余额。
      operationId: cancelWithdrawal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: wd_0001
      responses:
        "200":
          description: 已撤销
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Withdrawal" }
        "409":
          description: 该提现无法撤销（不存在或已进入处理）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }


openapi: 3.0.3
info:
  title: Linbit Exchange API
  description: |
    Linbit 加密货币交易所 REST API。

    - 统一错误模型（`Error`），业务错误码放在 `code` 字段。
    - 除公开行情接口外，均需 `Authorization: Bearer <accessToken>`。
    - 列表接口统一使用 `page` / `pageSize` 游标分页，返回 `Paginated*` 包装。

    该文档同时用于 Prism mock（`pnpm mock`）、生成 TypeScript 类型（`@linbit/api-client`），
    以及未来生成 Kotlin / Swift 客户端，请保持 `examples` 完整。
  version: 1.0.0
  contact:
    name: Linbit Platform
    url: https://linbit.example.com
  license:
    name: Proprietary
servers:
  - url: http://localhost:4010
    description: 本地 Prism mock
  - url: https://api.linbit.example.com/v1
    description: 生产环境
tags:
  - name: Auth
    description: 注册、登录、令牌刷新与登出
  - name: 2FA
    description: 基于 TOTP 的双重验证
  - name: Account
    description: 账户信息
  - name: KYC
    description: 身份认证
  - name: Assets
    description: 资产余额
  - name: Wallet
    description: 充值与提现
  - name: Spot
    description: 现货交易
  - name: Market
    description: 行情数据（公开）

paths:
  /auth/code/send:
    post:
      tags: [Auth]
      summary: 发送注册/找回密码验证码
      operationId: sendAuthCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendCodeRequest" }
            example:
              purpose: register
              phone: "13800138000"
              countryCode: "86"
      responses:
        "200":
          description: 已发送（reset_password 对不存在账号也返回 200）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendCodeResponse" }
              example: { sent: true, channel: sms, ttlSeconds: 600 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429":
          description: 发送过于频繁
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: RATE_LIMITED, message: 验证码发送过于频繁，请稍后再试 }

  /auth/register:
    post:
      tags: [Auth]
      summary: 注册新账户
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: trader@example.com
              password: "Str0ng-Passw0rd!"
              code: "123456"
              inviteCode: LB8DEMO
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access
                refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh
                tokenType: Bearer
                expiresIn: 3600
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: 邮箱已被注册
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: AUTH_EMAIL_EXISTS
                message: 该邮箱已被注册
                requestId: req_8c1f2a

  /auth/login:
    post:
      tags: [Auth]
      summary: 登录
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: trader@example.com
              password: "Str0ng-Passw0rd!"
              deviceId: web-7f3a
      responses:
        "200":
          description: >
            密码正确。若无需二次验证返回 AuthTokens；若需要（已开启 TOTP 或新设备
            触发邮箱/短信验证）返回 LoginChallenge。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthTokens"
                  - $ref: "#/components/schemas/LoginChallenge"
              examples:
                tokens:
                  summary: 无需二次验证
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access
                    refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh
                    tokenType: Bearer
                    expiresIn: 3600
                challenge:
                  summary: 需二次验证
                  value:
                    challengeToken: 3kZ9...challenge
                    methods: [sms]
                    expiresIn: 300
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/login/verify:
    post:
      tags: [Auth]
      summary: 提交二次验证，换取令牌
      operationId: loginVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginVerifyRequest" }
            example: { challengeToken: 3kZ9...challenge, code: "123456" }
      responses:
        "200":
          description: 验证通过
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/login/code:
    post:
      tags: [Auth]
      summary: 重新发送登录二次验证码（email/sms）
      operationId: loginResendCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken]
              properties:
                challengeToken: { type: string }
            example: { challengeToken: 3kZ9...challenge }
      responses:
        "200": { description: 已发送 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: 发送过于频繁 }

  /auth/password/verify-code:
    post:
      tags: [Auth]
      summary: 找回密码-校验验证码并换取重置令牌
      description: >
        找回密码第一步：校验邮箱/短信验证码，成功后返回短期有效（默认 10 分钟）、
        一次性的 resetToken，随后用它调用 /auth/password/reset 设置新密码。
      operationId: verifyPasswordResetCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyResetCodeRequest" }
            example:
              phone: "13800138000"
              countryCode: "86"
              code: "123456"
      responses:
        "200":
          description: 验证码正确，返回重置令牌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyResetCodeResponse" }
              example: { resetToken: "3kZ9...resetTok", expiresIn: 600 }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/password/reset:
    post:
      tags: [Auth]
      summary: 使用重置令牌设置新密码（撤销全部会话）
      description: 找回密码第二步：用 /auth/password/verify-code 返回的 resetToken 设置新密码。
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
            example:
              resetToken: "3kZ9...resetTok"
              newPassword: "N3w-Passw0rd!"
      responses:
        "204": { description: 重置成功 }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新访问令牌
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
            example:
              refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.newaccess
                refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.newrefresh
                tokenType: Bearer
                expiresIn: 3600
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: 登出（吊销当前刷新令牌）
      operationId: logout
      responses:
        "204":
          description: 已登出
        "401": { $ref: "#/components/responses/Unauthorized" }

  /2fa/totp/bind:
    post:
      tags: [2FA]
      summary: 开始绑定 TOTP（返回密钥与 otpauth URI）
      operationId: bindTotp
      responses:
        "200":
          description: 返回待绑定的密钥
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpBinding" }
              example:
                secret: JBSWY3DPEHPK3PXP
                otpauthUri: otpauth://totp/Linbit:trader@example.com?secret=JBSWY3DPEHPK3PXP&issuer=Linbit
        "401": { $ref: "#/components/responses/Unauthorized" }

  /2fa/totp/verify:
    post:
      tags: [2FA]
      summary: 校验 TOTP 验证码并启用 2FA
      operationId: verifyTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 6 位 TOTP 验证码
            example:
              code: "123456"
      responses:
        "200":
          description: 2FA 已启用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorStatus" }
              example:
                enabled: true
                method: totp
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /2fa/totp/disable:
    post:
      tags: [2FA]
      summary: 关闭 TOTP 二次验证
      operationId: disableTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
            example:
              code: "123456"
      responses:
        "200":
          description: 2FA 已关闭
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorStatus" }
              example:
                enabled: false
                method: null
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account:
    get:
      tags: [Account]
      summary: 获取当前账户信息
      operationId: getAccount
      responses:
        "200":
          description: 账户信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
              example:
                uid: "80000001"
                email: trader@example.com
                nickname: lb_Trader
                kycLevel: 1
                twoFactorEnabled: true
                createdAt: "2026-01-05T08:30:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/profile:
    patch:
      tags: [Account]
      summary: 修改昵称 / 头像
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
            example: { nickname: lb_Trader, avatarUrl: https://cdn.example.com/avatar/lb.png }
      responses:
        "200":
          description: 更新后的账户信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/avatar:
    post:
      tags: [Account]
      summary: 上传头像（multipart）
      description: >
        以 multipart/form-data 上传头像图片（字段名 file）。服务端按内容嗅探类型
        （仅支持 jpeg/png/webp），并限制大小（默认 2MB，可配置）。存储后返回更新后的
        账户信息，其中 avatarUrl 指向受控访问路由 /account/avatars/{file}。
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 头像图片（jpeg/png/webp，≤2MB）
      responses:
        "200":
          description: 上传成功，返回更新后的账户信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: 文件过大
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: FILE_TOO_LARGE, message: 头像超过大小限制 }
        "415":
          description: 不支持的图片类型
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: UNSUPPORTED_MEDIA_TYPE, message: 仅支持 JPEG/PNG/WEBP 图片 }

  /account/avatars/{file}:
    get:
      tags: [Account]
      summary: 读取已上传头像（受控访问路由，公开）
      description: 由本地存储后端通过受控路由提供头像访问；仅服务存储目录内文件，阻止路径穿越。
      operationId: getAvatar
      security: []
      parameters:
        - name: file
          in: path
          required: true
          description: 相对存储键（如 80000001/ab12cd.png）
          schema: { type: string }
      responses:
        "200":
          description: 头像图片
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }

  /account/code/send:
    post:
      tags: [Account]
      summary: 向本人发送敏感操作验证码
      operationId: sendAccountCode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendCodeAuthedRequest" }
            example: { purpose: address, channel: sms }
      responses:
        "200":
          description: 已发送
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendCodeResponse" }
              example: { sent: true, channel: sms, ttlSeconds: 600 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: 发送过于频繁 }

  /account/devices:
    get:
      tags: [Account]
      summary: 列出登录设备
      operationId: listDevices
      responses:
        "200":
          description: 设备列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/devices/{deviceId}:
    delete:
      tags: [Account]
      summary: 移除设备（撤销该设备会话）
      operationId: removeDevice
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: 已移除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /account/withdraw-whitelist:
    get:
      tags: [Account]
      summary: 查询提现白名单开关
      operationId: getWithdrawWhitelist
      responses:
        "200":
          description: 开关状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhitelistStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Account]
      summary: 开关提现白名单（需验证码或 2FA）
      operationId: setWithdrawWhitelist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetWhitelistRequest" }
            example: { enabled: true, code: "123456" }
      responses:
        "200":
          description: 新状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhitelistStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/withdraw-addresses:
    get:
      tags: [Account]
      summary: 提现地址簿列表
      operationId: listWithdrawAddresses
      responses:
        "200":
          description: 地址簿
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithdrawAddressList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Account]
      summary: 新增提现地址（需验证码或 2FA）
      operationId: createWithdrawAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWithdrawAddressRequest" }
            example:
              asset: USDT
              network: TRC20
              address: TXy1Z9DemoAddr000000000000000000000
              label: cold-wallet
              code: "123456"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithdrawAddress" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: 地址已存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: ADDRESS_EXISTS, message: 该地址已在地址簿中 }

  /account/withdraw-addresses/{id}:
    delete:
      tags: [Account]
      summary: 删除提现地址（需验证码或 2FA）
      operationId: deleteWithdrawAddress
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: false
          description: 未开启 2FA 时提供（purpose=address）
          schema: { type: string }
        - name: totpCode
          in: query
          required: false
          description: 已开启 2FA 时提供
          schema: { type: string }
      responses:
        "204": { description: 已删除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /kyc:
    post:
      tags: [KYC]
      summary: 提交 KYC 认证资料
      operationId: submitKyc
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KycSubmission" }
            example:
              firstName: San
              lastName: Zhang
              country: SG
              idType: passport
              idNumber: E12345678
              dateOfBirth: "1992-04-18"
      responses:
        "202":
          description: 已受理，进入审核
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
              example:
                level: 1
                status: pending
                submittedAt: "2026-11-02T10:00:00Z"
                reason: null
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /kyc/status:
    get:
      tags: [KYC]
      summary: 查询 KYC 状态
      operationId: getKycStatus
      responses:
        "200":
          description: KYC 状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
              example:
                level: 1
                status: approved
                submittedAt: "2026-11-01T10:00:00Z"
                reason: null
        "401": { $ref: "#/components/responses/Unauthorized" }

  /assets/balances:
    get:
      tags: [Assets]
      summary: 获取资产余额列表
      operationId: getBalances
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 余额列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedBalances" }
              example:
                items:
                  - asset: USDT
                    free: "10520.33000000"
                    locked: "250.00000000"
                    total: "10770.33000000"
                    valuationUsd: "10770.33"
                  - asset: BTC
                    free: "0.52100000"
                    locked: "0.00000000"
                    total: "0.52100000"
                    valuationUsd: "39994.40"
                page: 1
                pageSize: 20
                total: 2
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wallet/deposit/address:
    get:
      tags: [Wallet]
      summary: 获取充值地址
      operationId: getDepositAddress
      parameters:
        - name: asset
          in: query
          required: true
          schema: { type: string }
          example: USDT
        - name: network
          in: query
          required: true
          schema: { type: string }
          example: TRC20
      responses:
        "200":
          description: 充值地址
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositAddress" }
              example:
                asset: USDT
                network: TRC20
                address: TXy1Z9DemoAddr000000000000000000000
                memo: null
                minDeposit: "1.00000000"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wallet/deposit/records:
    get:
      tags: [Wallet]
      summary: 充值记录
      operationId: listDeposits
      parameters:
        - name: asset
          in: query
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 充值记录列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedDeposits" }
              example:
                items:
                  - id: dep_0001
                    asset: USDT
                    network: TRC20
                    amount: "500.00000000"
                    txId: 9a7b...demo
                    status: completed
                    confirmations: 20
                    createdAt: "2026-10-30T12:00:00Z"
                page: 1
                pageSize: 20
                total: 1
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wallet/withdraw:
    post:
      tags: [Wallet]
      summary: 发起提现申请
      operationId: createWithdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WithdrawRequest" }
            example:
              asset: USDT
              network: TRC20
              address: TXy1Z9DemoAddr000000000000000000000
              amount: "100.00000000"
              memo: null
              totpCode: "123456"
      responses:
        "202":
          description: 提现申请已受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Withdrawal" }
              example:
                id: wd_0001
                asset: USDT
                network: TRC20
                address: TXy1Z9DemoAddr000000000000000000000
                amount: "100.00000000"
                fee: "1.00000000"
                status: pending
                createdAt: "2026-11-02T10:05:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: 已开启提现白名单，但目标地址不在白名单内
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /wallet/withdraw/networks:
    get:
      tags: [Wallet]
      summary: 可提现网络与 Gas 估算
      description: >
        返回某资产可用的提现网络列表及每个网络的链上 Gas 估算。提现不收取平台
        手续费，仅收取链上 Gas，因此前端据此向用户展示预计到账金额。
      operationId: listWithdrawNetworks
      parameters:
        - name: asset
          in: query
          required: true
          schema: { type: string }
          example: USDT
      responses:
        "200":
          description: 网络与 Gas 估算
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithdrawNetworkOptions" }
              example:
                asset: USDT
                networks:
                  - network: TRC20
                    minWithdraw: "12.00000000"
                    gasFeeEstimate: "1.00000000"
                    gasFeeAsset: USDT
                    estimatedArrivalMinutes: 5
                  - network: ERC20
                    minWithdraw: "12.00000000"
                    gasFeeEstimate: "6.50000000"
                    gasFeeAsset: USDT
                    estimatedArrivalMinutes: 10
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wallet/withdraw/records:
    get:
      tags: [Wallet]
      summary: 提现记录
      operationId: listWithdrawals
      parameters:
        - name: asset
          in: query
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 提现记录列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedWithdrawals" }
              example:
                items:
                  - id: wd_0001
                    asset: USDT
                    network: TRC20
                    address: TXy1Z9DemoAddr000000000000000000000
                    amount: "100.00000000"
                    fee: "1.00000000"
                    status: completed
                    createdAt: "2026-10-28T09:00:00Z"
                page: 1
                pageSize: 20
                total: 1
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wallet/withdraw/{id}/cancel:
    post:
      tags: [Wallet]
      summary: 撤销提现申请
      description: >
        仅可撤销处于待人工审核（pending）状态的提现；撤销后冻结金额解冻退回可用余额。
      operationId: cancelWithdrawal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: wd_0001
      responses:
        "200":
          description: 已撤销
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Withdrawal" }
        "409":
          description: 该提现无法撤销（不存在或已进入处理）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /spot/orders:
    post:
      tags: [Spot]
      summary: 现货下单
      operationId: placeSpotOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceOrderRequest" }
            example:
              symbol: BTCUSDT
              side: buy
              type: limit
              price: "76768.40"
              quantity: "0.010000"
              timeInForce: GTC
              clientOrderId: cli-20261102-001
      responses:
        "201":
          description: 下单成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
              example:
                orderId: "1000000001"
                clientOrderId: cli-20261102-001
                symbol: BTCUSDT
                side: buy
                type: limit
                price: "76768.40"
                quantity: "0.010000"
                filledQuantity: "0.000000"
                status: new
                timeInForce: GTC
                createdAt: "2026-11-02T10:10:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /spot/orders/{orderId}:
    delete:
      tags: [Spot]
      summary: 撤销现货订单
      operationId: cancelSpotOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
          example: "1000000001"
        - name: symbol
          in: query
          required: true
          schema: { type: string }
          example: BTCUSDT
      responses:
        "200":
          description: 撤单成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
              example:
                orderId: "1000000001"
                clientOrderId: cli-20261102-001
                symbol: BTCUSDT
                side: buy
                type: limit
                price: "76768.40"
                quantity: "0.010000"
                filledQuantity: "0.000000"
                status: canceled
                timeInForce: GTC
                createdAt: "2026-11-02T10:10:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /spot/orders/open:
    get:
      tags: [Spot]
      summary: 当前委托（未成交/部分成交）
      operationId: listOpenOrders
      parameters:
        - name: symbol
          in: query
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 当前委托列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedOrders" }
              example:
                items:
                  - orderId: "1000000001"
                    clientOrderId: cli-20261102-001
                    symbol: BTCUSDT
                    side: buy
                    type: limit
                    price: "76768.40"
                    quantity: "0.010000"
                    filledQuantity: "0.000000"
                    status: new
                    timeInForce: GTC
                    createdAt: "2026-11-02T10:10:00Z"
                page: 1
                pageSize: 20
                total: 1
        "401": { $ref: "#/components/responses/Unauthorized" }

  /spot/orders/history:
    get:
      tags: [Spot]
      summary: 历史订单
      operationId: listOrderHistory
      parameters:
        - name: symbol
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 历史订单列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedOrders" }
              example:
                items:
                  - orderId: "0999999900"
                    clientOrderId: cli-20261030-009
                    symbol: BTCUSDT
                    side: sell
                    type: limit
                    price: "78000.00"
                    quantity: "0.020000"
                    filledQuantity: "0.020000"
                    status: filled
                    timeInForce: GTC
                    createdAt: "2026-10-30T11:00:00Z"
                page: 1
                pageSize: 20
                total: 1
        "401": { $ref: "#/components/responses/Unauthorized" }

  /spot/trades:
    get:
      tags: [Spot]
      summary: 个人成交记录
      operationId: listMyTrades
      parameters:
        - name: symbol
          in: query
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 成交记录列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedTrades" }
              example:
                items:
                  - tradeId: "5000000001"
                    orderId: "0999999900"
                    symbol: BTCUSDT
                    side: sell
                    price: "78000.00"
                    quantity: "0.020000"
                    fee: "1.56"
                    feeAsset: USDT
                    role: maker
                    createdAt: "2026-10-30T11:05:00Z"
                page: 1
                pageSize: 20
                total: 1
        "401": { $ref: "#/components/responses/Unauthorized" }

  /market/symbols:
    get:
      tags: [Market]
      summary: 交易对列表
      operationId: listSymbols
      security: []
      responses:
        "200":
          description: 交易对列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Symbol" }
              example:
                - symbol: BTCUSDT
                  base: BTC
                  quote: USDT
                  pricePrecision: 1
                  quantityPrecision: 6
                  minQuantity: "0.000010"
                  status: trading
                - symbol: ETHUSDT
                  base: ETH
                  quote: USDT
                  pricePrecision: 2
                  quantityPrecision: 5
                  minQuantity: "0.00100"
                  status: trading

  /market/ticker:
    get:
      tags: [Market]
      summary: 24 小时行情 ticker（单个或全部）
      description: >
        传入 `symbol` 时返回该交易对的单个 Ticker 对象；不传 `symbol` 时返回全部
        交易对的 Ticker 数组。响应为二者之一（见 oneOf）。价格、quoteVolume 按交易对
        计价币精度，base 成交量按数量精度，均为十进制字符串。
      operationId: getTicker
      security: []
      parameters:
        - name: symbol
          in: query
          required: false
          description: 传入则返回单个对象；不传则返回全部交易对的数组
          schema: { type: string }
          example: BTCUSDT
      responses:
        "200":
          description: >
            行情数据。带 `symbol` 为单个 Ticker 对象；不带为 Ticker 数组。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Ticker"
                  - type: array
                    items: { $ref: "#/components/schemas/Ticker" }
              examples:
                single:
                  summary: 带 symbol — 单个对象
                  value:
                    symbol: BTCUSDT
                    lastPrice: "76771.90"
                    priceChangePercent: "-1.71"
                    high: "78878.00"
                    low: "76705.00"
                    volume: "371.65"
                    quoteVolume: "28915681.30"
                all:
                  summary: 不带 symbol — 数组
                  value:
                    - symbol: BTCUSDT
                      lastPrice: "76771.90"
                      priceChangePercent: "-1.71"
                      high: "78878.00"
                      low: "76705.00"
                      volume: "371.65"
                      quoteVolume: "28915681.30"
                    - symbol: ETHUSDT
                      lastPrice: "2252.77"
                      priceChangePercent: "-0.82"
                      high: "2301.10"
                      low: "2230.00"
                      volume: "12850.40"
                      quoteVolume: "28996512.10"

  /market/depth:
    get:
      tags: [Market]
      summary: 订单簿深度
      operationId: getDepth
      security: []
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string }
          example: BTCUSDT
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 200
      responses:
        "200":
          description: 订单簿
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Depth" }
              example:
                symbol: BTCUSDT
                lastUpdateId: 123456789
                bids:
                  - ["76768.40", "0.51230"]
                  - ["76768.30", "1.20100"]
                asks:
                  - ["76768.50", "0.33200"]
                  - ["76768.60", "0.89500"]

  /market/klines:
    get:
      tags: [Market]
      summary: K 线数据
      operationId: getKlines
      security: []
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string }
          example: BTCUSDT
        - name: interval
          in: query
          required: true
          schema: { $ref: "#/components/schemas/KlineInterval" }
          example: 15m
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 160
            maximum: 1000
      responses:
        "200":
          description: K 线数组（每根含 time/open/high/low/close/volume）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Kline" }
              example:
                - time: 1762070400
                  open: "76500.00"
                  high: "76820.00"
                  low: "76410.00"
                  close: "76768.40"
                  volume: "123.45"
                - time: 1762071300
                  open: "76768.40"
                  high: "76900.00"
                  low: "76700.00"
                  close: "76771.90"
                  volume: "98.76"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: VALIDATION_ERROR
            message: 请求参数不合法
            requestId: req_400demo
    Unauthorized:
      description: 未认证或令牌失效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: AUTH_UNAUTHORIZED
            message: 请先登录
            requestId: req_401demo
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: NOT_FOUND
            message: 资源不存在
            requestId: req_404demo

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 业务错误码
          example: VALIDATION_ERROR
        message:
          type: string
          description: 可读错误信息
          example: 请求参数不合法
        requestId:
          type: string
          nullable: true
          description: 便于排查的请求 ID
          example: req_8c1f2a
        details:
          type: array
          nullable: true
          description: 字段级错误明细
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }

    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        total: { type: integer, example: 42 }

    SendCodeRequest:
      type: object
      required: [purpose]
      description: >
        请求邮箱/短信验证码。register / reset_password 为公开接口；二选一提供
        email 或 phone（手机号可用 E.164 的 "+8613800138000"，或 phone + countryCode
        拨号区号组合）。为避免账号枚举，reset_password 对不存在的账号也返回 200。
      properties:
        purpose:
          type: string
          enum: [register, reset_password]
          example: register
        email: { type: string, format: email, nullable: true, example: trader@example.com }
        phone: { type: string, nullable: true, description: E.164 或本地号, example: "13800138000" }
        countryCode: { type: string, nullable: true, description: 国家拨号码（如 86）, example: "86" }

    SendCodeResponse:
      type: object
      required: [sent, channel]
      description: 发送验证码的统一响应（/auth/code/send 与 /account/code/send 共用）。
      properties:
        sent: { type: boolean, example: true }
        channel: { type: string, enum: [email, sms], example: sms }
        ttlSeconds: { type: integer, description: 验证码有效期（秒）, example: 600 }

    RegisterRequest:
      type: object
      required: [password, code]
      description: 邮箱或手机号二选一；注册需验证码（先调用 /auth/code/send）。
      properties:
        email: { type: string, format: email, nullable: true, example: trader@example.com }
        phone: { type: string, nullable: true, example: "13800138000" }
        countryCode: { type: string, nullable: true, example: "86" }
        password: { type: string, format: password, minLength: 8, example: "Str0ng-Passw0rd!" }
        code: { type: string, description: 6 位验证码, example: "123456" }
        inviteCode: { type: string, nullable: true, example: LB8DEMO }

    LoginRequest:
      type: object
      required: [password]
      description: >
        邮箱或手机号二选一 + 密码。密码正确后若需二次验证（已开启 TOTP、或新设备
        登录触发邮箱/短信验证），返回 LoginChallenge 而非 AuthTokens。
      properties:
        email: { type: string, format: email, nullable: true, example: trader@example.com }
        phone: { type: string, nullable: true, description: E.164 或本地号, example: "+8613800138000" }
        countryCode: { type: string, nullable: true, description: 手机号为本地号时提供国家拨号码（如 86）, example: "86" }
        password: { type: string, format: password, example: "Str0ng-Passw0rd!" }
        deviceId: { type: string, nullable: true, description: 客户端稳定设备标识；缺省时按 User-Agent 推断, example: web-7f3a }
        deviceName: { type: string, nullable: true, example: Chrome on macOS }

    LoginChallenge:
      type: object
      required: [challengeToken, methods, expiresIn]
      description: 二次验证票据。用 challengeToken 调 /auth/login/verify 换取令牌。
      properties:
        challengeToken: { type: string, example: 3kZ9...challenge }
        methods:
          type: array
          description: 需要完成的二次验证方式（当前恒为单个）。
          items: { type: string, enum: [totp, email, sms] }
          example: [sms]
        expiresIn: { type: integer, description: 票据有效期（秒）, example: 300 }

    LoginVerifyRequest:
      type: object
      required: [challengeToken]
      properties:
        challengeToken: { type: string, example: 3kZ9...challenge }
        totpCode: { type: string, nullable: true, description: method=totp 时必填, example: "123456" }
        code: { type: string, nullable: true, description: method=email/sms 时必填, example: "123456" }

    VerifyResetCodeRequest:
      type: object
      required: [code]
      description: 找回密码第一步请求：邮箱或手机号二选一 + 验证码。
      properties:
        email: { type: string, format: email, nullable: true, example: trader@example.com }
        phone: { type: string, nullable: true, example: "13800138000" }
        countryCode: { type: string, nullable: true, example: "86" }
        code: { type: string, example: "123456" }

    VerifyResetCodeResponse:
      type: object
      required: [resetToken, expiresIn]
      description: 一次性重置令牌（默认 10 分钟有效），用于 /auth/password/reset。
      properties:
        resetToken: { type: string, example: "3kZ9...resetTok" }
        expiresIn: { type: integer, description: resetToken 有效期（秒）, example: 600 }

    PasswordResetRequest:
      type: object
      required: [resetToken, newPassword]
      description: 校验验证码后重置密码，并撤销该用户全部会话（refresh token）。
      properties:
        resetToken: { type: string, description: 由 /auth/password/verify-code 返回, example: "3kZ9...resetTok" }
        newPassword: { type: string, format: password, minLength: 8, example: "N3w-Passw0rd!" }

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, enum: [Bearer], example: Bearer }
        expiresIn: { type: integer, description: accessToken 有效期（秒）, example: 3600 }

    TotpBinding:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, example: JBSWY3DPEHPK3PXP }
        otpauthUri:
          type: string
          example: otpauth://totp/Linbit:trader@example.com?secret=JBSWY3DPEHPK3PXP&issuer=Linbit

    TwoFactorStatus:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean, example: true }
        method:
          type: string
          nullable: true
          enum: [totp, null]
          example: totp

    Account:
      type: object
      required: [uid, kycLevel, twoFactorEnabled, createdAt]
      properties:
        uid: { type: string, example: "80000001" }
        email: { type: string, format: email, nullable: true, example: trader@example.com }
        phone: { type: string, nullable: true, description: E.164, example: "+8613800138000" }
        countryCode: { type: string, example: "86" }
        nickname: { type: string, nullable: true, example: lb_Trader }
        avatarUrl: { type: string, nullable: true, example: https://cdn.example.com/avatar/lb.png }
        kycLevel: { type: integer, example: 1 }
        twoFactorEnabled: { type: boolean, example: true }
        emailVerified: { type: boolean, example: true }
        phoneVerified: { type: boolean, example: true }
        withdrawWhitelistEnabled: { type: boolean, example: false }
        createdAt: { type: string, format: date-time, example: "2026-01-05T08:30:00Z" }

    UpdateProfileRequest:
      type: object
      description: 至少提供一个字段。头像一期只存 URL（http/https，≤512）。
      properties:
        nickname: { type: string, nullable: true, minLength: 1, maxLength: 32, example: lb_Trader }
        avatarUrl: { type: string, nullable: true, example: https://cdn.example.com/avatar/lb.png }

    SendCodeAuthedRequest:
      type: object
      required: [purpose]
      description: 向当前登录用户自己的邮箱/手机发送验证码，用于敏感操作前置校验。
      properties:
        purpose: { type: string, enum: [address, bind, reset_password], example: address }
        channel: { type: string, nullable: true, enum: [email, sms], description: 缺省按账户已绑定的联系方式, example: sms }

    Device:
      type: object
      required: [deviceId, firstSeen, lastSeen]
      properties:
        deviceId: { type: string, description: 设备指纹（移除设备时回传）, example: "cid:web-7f3a" }
        name: { type: string, example: Chrome on macOS }
        userAgent: { type: string, example: "Mozilla/5.0 ..." }
        ip: { type: string, example: "203.0.113.7" }
        current: { type: boolean, description: 是否为当前请求所在设备, example: true }
        firstSeen: { type: string, format: date-time, example: "2026-11-01T10:00:00Z" }
        lastSeen: { type: string, format: date-time, example: "2026-11-03T08:30:00Z" }

    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Device" }

    WhitelistStatus:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean, example: false }

    SetWhitelistRequest:
      type: object
      required: [enabled]
      description: 开关提现白名单；需验证码或 2FA（二选一）。
      properties:
        enabled: { type: boolean, example: true }
        totpCode: { type: string, nullable: true, description: 已开启 2FA 时提供, example: "123456" }
        code: { type: string, nullable: true, description: 未开启 2FA 时提供（purpose=address）, example: "123456" }

    WithdrawAddress:
      type: object
      required: [id, asset, network, address, whitelisted, createdAt]
      properties:
        id: { type: string, example: "1" }
        asset: { type: string, example: USDT }
        network: { type: string, example: TRC20 }
        address: { type: string, example: TXy1Z9DemoAddr000000000000000000000 }
        memo: { type: string, example: "" }
        label: { type: string, example: cold-wallet }
        whitelisted: { type: boolean, example: true }
        createdAt: { type: string, format: date-time, example: "2026-11-03T08:30:00Z" }

    WithdrawAddressList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WithdrawAddress" }

    CreateWithdrawAddressRequest:
      type: object
      required: [asset, network, address]
      description: 新增地址簿条目；需验证码或 2FA（二选一）。
      properties:
        asset: { type: string, example: USDT }
        network: { type: string, example: TRC20 }
        address: { type: string, example: TXy1Z9DemoAddr000000000000000000000 }
        memo: { type: string, nullable: true, example: "" }
        label: { type: string, nullable: true, example: cold-wallet }
        whitelisted: { type: boolean, nullable: true, example: true }
        totpCode: { type: string, nullable: true, example: "123456" }
        code: { type: string, nullable: true, example: "123456" }

    KycSubmission:
      type: object
      required: [firstName, lastName, country, idType, idNumber, dateOfBirth]
      properties:
        firstName: { type: string, example: San }
        lastName: { type: string, example: Zhang }
        country: { type: string, description: ISO 3166-1 alpha-2, example: SG }
        idType:
          type: string
          enum: [passport, id_card, driver_license]
          example: passport
        idNumber: { type: string, example: E12345678 }
        dateOfBirth: { type: string, format: date, example: "1992-04-18" }

    KycStatus:
      type: object
      required: [level, status]
      properties:
        level: { type: integer, example: 1 }
        status:
          type: string
          enum: [none, pending, approved, rejected]
          example: approved
        submittedAt: { type: string, format: date-time, nullable: true, example: "2026-11-01T10:00:00Z" }
        reason: { type: string, nullable: true, example: null }

    Balance:
      type: object
      required: [asset, free, locked, total]
      properties:
        asset: { type: string, example: USDT }
        free: { type: string, description: 可用（字符串防精度丢失）, example: "10520.33000000" }
        locked: { type: string, example: "250.00000000" }
        total: { type: string, example: "10770.33000000" }
        valuationUsd: { type: string, nullable: true, example: "10770.33" }

    PaginatedBalances:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Balance" }

    DepositAddress:
      type: object
      required: [asset, network, address]
      properties:
        asset: { type: string, example: USDT }
        network: { type: string, example: TRC20 }
        address: { type: string, example: TXy1Z9DemoAddr000000000000000000000 }
        memo: { type: string, nullable: true, example: null }
        minDeposit: { type: string, nullable: true, example: "1.00000000" }

    Deposit:
      type: object
      required: [id, asset, network, amount, status, createdAt]
      properties:
        id: { type: string, example: dep_0001 }
        asset: { type: string, example: USDT }
        network: { type: string, example: TRC20 }
        amount: { type: string, example: "500.00000000" }
        txId: { type: string, nullable: true, example: 9a7b...demo }
        status:
          type: string
          enum: [pending, completed, failed]
          example: completed
        confirmations: { type: integer, nullable: true, example: 20 }
        createdAt: { type: string, format: date-time, example: "2026-10-30T12:00:00Z" }

    PaginatedDeposits:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Deposit" }

    WithdrawRequest:
      type: object
      required: [asset, network, address, amount]
      properties:
        asset: { type: string, example: USDT }
        network: { type: string, example: TRC20 }
        address: { type: string, example: TXy1Z9DemoAddr000000000000000000000 }
        amount: { type: string, example: "100.00000000" }
        memo: { type: string, nullable: true, example: null }
        totpCode:
          type: string
          nullable: true
          description: 已开启 2FA 时必填
          example: "123456"
        code:
          type: string
          nullable: true
          description: >
            未开启 2FA 时必填：发到用户邮箱/手机的验证码（purpose=withdraw）。
            与 totpCode 二选一，由服务端按账户状态校验。
          example: "123456"

    Withdrawal:
      type: object
      required: [id, asset, network, address, amount, fee, status, createdAt]
      properties:
        id: { type: string, example: wd_0001 }
        asset: { type: string, example: USDT }
        network: { type: string, example: TRC20 }
        address: { type: string, example: TXy1Z9DemoAddr000000000000000000000 }
        amount: { type: string, example: "100.00000000" }
        fee:
          type: string
          description: >
            链上 Gas 费（不含平台手续费——提现不收平台手续费）。等同于 gasFee，保留
            以兼容既有字段。
          example: "1.00000000"
        gasFee:
          type: string
          nullable: true
          description: 实际结算的链上 Gas 费；下单时按 gasFeeEstimate 估算。
          example: "1.00000000"
        gasFeeAsset:
          type: string
          nullable: true
          description: Gas 费计价资产（通常为该网络的原生币或被提资产）。
          example: USDT
        status:
          type: string
          enum: [pending, processing, completed, failed, canceled]
          example: pending
        createdAt: { type: string, format: date-time, example: "2026-11-02T10:05:00Z" }

    WithdrawNetwork:
      type: object
      required: [network]
      properties:
        network: { type: string, example: TRC20 }
        minWithdraw: { type: string, nullable: true, example: "12.00000000" }
        maxWithdraw:
          type: string
          nullable: true
          description: 单笔最大提现数量；USDT 各网络为 20000。为空表示无上限。
          example: "20000.00000000"
        gasFeeEstimate:
          type: string
          nullable: true
          description: 预估链上 Gas 费（提现唯一费用，无平台手续费）。实现前可为 null。
          example: "1.00000000"
        gasFeeAsset:
          type: string
          nullable: true
          description: Gas 费计价资产。
          example: USDT
        confirmations:
          type: integer
          nullable: true
          description: 该网络的到账确认数（充值需达到该确认数才入账；提现完成后等待该确认数结算）。
          example: 19
        estimatedArrivalMinutes:
          type: integer
          nullable: true
          description: 预计到账时间（分钟）。
          example: 5

    WithdrawNetworkOptions:
      type: object
      required: [asset, networks]
      properties:
        asset: { type: string, example: USDT }
        networks:
          type: array
          items: { $ref: "#/components/schemas/WithdrawNetwork" }

    PaginatedWithdrawals:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Withdrawal" }

    OrderSide:
      type: string
      enum: [buy, sell]

    OrderType:
      type: string
      enum: [limit, market]

    OrderStatus:
      type: string
      enum: [new, partially_filled, filled, canceled, rejected]

    TimeInForce:
      type: string
      enum: [GTC, IOC, FOK]

    PlaceOrderRequest:
      type: object
      required: [symbol, side, type, quantity]
      properties:
        symbol: { type: string, example: BTCUSDT }
        side: { $ref: "#/components/schemas/OrderSide" }
        type: { $ref: "#/components/schemas/OrderType" }
        price:
          type: string
          nullable: true
          description: limit 单必填
          example: "76768.40"
        quantity: { type: string, example: "0.01000000" }
        timeInForce: { $ref: "#/components/schemas/TimeInForce" }
        clientOrderId: { type: string, nullable: true, example: cli-20261102-001 }

    Order:
      type: object
      description: >
        现货订单。所有价格/数量字段均为十进制字符串（非浮点），并按交易对精度格式化输出：
        price 按 pricePrecision、quantity/filledQuantity 按 quantityPrecision 补齐定长小数位。
        示例按 BTCUSDT（pricePrecision=2, quantityPrecision=6）。
      required: [orderId, symbol, side, type, quantity, filledQuantity, status, createdAt]
      properties:
        orderId: { type: string, example: "1000000001" }
        clientOrderId: { type: string, nullable: true, example: cli-20261102-001 }
        symbol: { type: string, example: BTCUSDT }
        side: { $ref: "#/components/schemas/OrderSide" }
        type: { $ref: "#/components/schemas/OrderType" }
        price:
          type: string
          nullable: true
          description: 限价，按 pricePrecision 格式化的十进制字符串；市价单为 null。
          example: "76768.40"
        quantity:
          type: string
          description: 下单数量，按 quantityPrecision 格式化的十进制字符串。
          example: "0.010000"
        filledQuantity:
          type: string
          description: 已成交数量，按 quantityPrecision 格式化的十进制字符串。
          example: "0.000000"
        status: { $ref: "#/components/schemas/OrderStatus" }
        timeInForce: { $ref: "#/components/schemas/TimeInForce" }
        createdAt: { type: string, format: date-time, example: "2026-11-02T10:10:00Z" }

    PaginatedOrders:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Order" }

    Trade:
      type: object
      description: >
        成交记录。price/quantity/fee 均为十进制字符串（非浮点）并按交易对精度格式化：
        price 按 pricePrecision、quantity 按 quantityPrecision；fee 按其计价资产精度
        （base 计价按 quantityPrecision、quote 计价按 pricePrecision）。示例按 BTCUSDT。
      required: [tradeId, orderId, symbol, side, price, quantity, createdAt]
      properties:
        tradeId: { type: string, example: "5000000001" }
        orderId: { type: string, example: "0999999900" }
        symbol: { type: string, example: BTCUSDT }
        side: { $ref: "#/components/schemas/OrderSide" }
        price:
          type: string
          description: 成交价，按 pricePrecision 格式化的十进制字符串。
          example: "78000.00"
        quantity:
          type: string
          description: 成交数量，按 quantityPrecision 格式化的十进制字符串。
          example: "0.020000"
        fee:
          type: string
          nullable: true
          description: 手续费，按其计价资产（feeAsset）精度格式化的十进制字符串。
          example: "1.56"
        feeAsset: { type: string, nullable: true, example: USDT }
        role:
          type: string
          enum: [maker, taker]
          example: maker
        createdAt: { type: string, format: date-time, example: "2026-10-30T11:05:00Z" }

    PaginatedTrades:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Trade" }

    Symbol:
      type: object
      required: [symbol, base, quote, pricePrecision, quantityPrecision, status]
      properties:
        symbol: { type: string, example: BTCUSDT }
        base: { type: string, example: BTC }
        quote: { type: string, example: USDT }
        pricePrecision: { type: integer, example: 1 }
        quantityPrecision: { type: integer, example: 6 }
        minQuantity: { type: string, nullable: true, example: "0.000010" }
        status:
          type: string
          enum: [trading, halted, delisted]
          example: trading

    Ticker:
      type: object
      required: [symbol, lastPrice, priceChangePercent, high, low, volume, quoteVolume]
      properties:
        symbol: { type: string, example: BTCUSDT }
        lastPrice: { type: string, example: "76771.90" }
        priceChangePercent: { type: string, example: "-1.71" }
        high: { type: string, example: "78878.00" }
        low: { type: string, example: "76705.00" }
        volume: { type: string, example: "371.65" }
        quoteVolume: { type: string, example: "28915681.30" }

    Depth:
      type: object
      required: [symbol, lastUpdateId, bids, asks]
      properties:
        symbol: { type: string, example: BTCUSDT }
        lastUpdateId: { type: integer, example: 123456789 }
        bids:
          type: array
          description: "[price, quantity] 数组，买盘从高到低"
          items:
            type: array
            items: { type: string }
            minItems: 2
            maxItems: 2
        asks:
          type: array
          description: "[price, quantity] 数组，卖盘从低到高"
          items:
            type: array
            items: { type: string }
            minItems: 2
            maxItems: 2

    KlineInterval:
      type: string
      enum: ["1m", "5m", "15m", "30m", "1h", "4h", "1d", "1w"]

    Kline:
      type: object
      required: [time, open, high, low, close, volume]
      properties:
        time: { type: integer, description: 秒级时间戳（K 线开始时间）, example: 1762070400 }
        open: { type: string, example: "76500.00" }
        high: { type: string, example: "76820.00" }
        low: { type: string, example: "76410.00" }
        close: { type: string, example: "76768.40" }
        volume: { type: string, example: "123.45" }

security:
  - bearerAuth: []

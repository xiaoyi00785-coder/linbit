          items:
            type: object
            properties:
              symbol: { type: string }
              market: { type: string }
              sort: { type: integer }
              createdAt: { type: string, format: date-time }
    TransferRequest:
      type: object
      required: [clientId, asset, amount, from, to]
      properties:
        clientId: { type: string, maxLength: 64, example: "c-20261103-0001" }
        asset: { type: string, example: USDT }
        amount: { type: string, example: "100" }
        from: { type: string, enum: [spot, futures] }
        to: { type: string, enum: [spot, futures] }
    Transfer:
      type: object
      properties:
        id: { type: string, example: fut-4e77c5c8769ee51d }
        clientId: { type: string, nullable: true }
        asset: { type: string }
        amount: { type: string }
        from: { type: string }
        to: { type: string }
        status: { type: string, enum: [pending, done, failed] }
        kind: { type: string, example: transfer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

security:
  - bearerAuth: []

        按 sort 排序。symbols 只包含当前已上线的现货交易对；暂无交易对的分类
        （如贵金属 metals）返回空数组。id 固定：layer1 公链, metals 贵金属,
        commodities 大宗商品, stocks 股票, meme Meme, ai AI, defi DeFi,

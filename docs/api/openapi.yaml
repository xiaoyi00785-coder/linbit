        networks:
          type: array
          items: { $ref: "#/components/schemas/WithdrawNetwork" }

    PaginatedWithdrawals:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Withdrawal" }

    OrderSide:
      type: string
      enum: [buy, sell]

    OrderType:
      type: string
      enum: [limit, market]

    OrderStatus:
      type: string
      enum: [new, partially_filled, filled, canceled, rejected]

    TimeInForce:
      type: string
      enum: [GTC, IOC, FOK]

    PlaceOrderRequest:
      type: object
      required: [symbol, side, type, quantity]
      properties:
        symbol: { type: string, example: BTCUSDT }
        side: { $ref: "#/components/schemas/OrderSide" }
        type: { $ref: "#/components/schemas/OrderType" }
        price:
          type: string
          nullable: true
          description: limit 单必填
          example: "76768.40"
        quantity: { type: string, example: "0.01000000" }
        timeInForce: { $ref: "#/components/schemas/TimeInForce" }
        clientOrderId: { type: string, nullable: true, example: cli-20261102-001 }

    Order:
      type: object
      description: >
        现货订单。所有价格/数量字段均为十进制字符串（非浮点），并按交易对精度格式化输出：
        price 按 pricePrecision、quantity/filledQuantity 按 quantityPrecision 补齐定长小数位。
        示例按 BTCUSDT（pricePrecision=2, quantityPrecision=6）。
      required: [orderId, symbol, side, type, quantity, filledQuantity, status, createdAt]
      properties:
        orderId: { type: string, example: "1000000001" }
        clientOrderId: { type: string, nullable: true, example: cli-20261102-001 }
        symbol: { type: string, example: BTCUSDT }
        side: { $ref: "#/components/schemas/OrderSide" }
        type: { $ref: "#/components/schemas/OrderType" }
        price:
          type: string
          nullable: true
          description: 限价，按 pricePrecision 格式化的十进制字符串；市价单为 null。
          example: "76768.40"
        quantity:
          type: string
          description: 下单数量，按 quantityPrecision 格式化的十进制字符串。
          example: "0.010000"
        filledQuantity:
          type: string
          description: 已成交数量，按 quantityPrecision 格式化的十进制字符串。
          example: "0.000000"
        status: { $ref: "#/components/schemas/OrderStatus" }
        timeInForce: { $ref: "#/components/schemas/TimeInForce" }
        createdAt: { type: string, format: date-time, example: "2026-11-02T10:10:00Z" }

    PaginatedOrders:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Order" }

    Trade:
      type: object
      description: >
        成交记录。price/quantity/fee 均为十进制字符串（非浮点）并按交易对精度格式化：
        price 按 pricePrecision、quantity 按 quantityPrecision；fee 按其计价资产精度
        （base 计价按 quantityPrecision、quote 计价按 pricePrecision）。示例按 BTCUSDT。
      required: [tradeId, orderId, symbol, side, price, quantity, createdAt]
      properties:
        tradeId: { type: string, example: "5000000001" }
        orderId: { type: string, example: "0999999900" }
        symbol: { type: string, example: BTCUSDT }
        side: { $ref: "#/components/schemas/OrderSide" }
        price:
          type: string
          description: 成交价，按 pricePrecision 格式化的十进制字符串。
          example: "78000.00"
        quantity:
          type: string
          description: 成交数量，按 quantityPrecision 格式化的十进制字符串。
          example: "0.020000"
        fee:
          type: string
          nullable: true
          description: 手续费，按其计价资产（feeAsset）精度格式化的十进制字符串。
          example: "1.56"
        feeAsset: { type: string, nullable: true, example: USDT }
        role:
          type: string
          enum: [maker, taker]
          example: maker
        createdAt: { type: string, format: date-time, example: "2026-10-30T11:05:00Z" }

    PaginatedTrades:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Trade" }

    Symbol:
      type: object
      required: [symbol, base, quote, pricePrecision, quantityPrecision, status]
      properties:
        symbol: { type: string, example: BTCUSDT }
        base: { type: string, example: BTC }
        quote: { type: string, example: USDT }
        pricePrecision: { type: integer, example: 1 }
        quantityPrecision: { type: integer, example: 6 }
        minQuantity: { type: string, nullable: true, example: "0.000010" }
        status:
          type: string
          enum: [trading, halted, delisted]

[package]
name = "matching-engine"
version = "0.1.0"
edition = "2021"
description = "Linbit spot matching engine: per-symbol single-threaded, price-time priority, WAL + snapshot recovery."

[[bin]]
name = "matching-engine"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
rskafka = "0.6.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[features]
# Kept so existing `--features kafka` builds still succeed. The producer is
# always compiled; it connects only when KAFKA_BROKERS is set.
kafka = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

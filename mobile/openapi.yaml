openapi: 3.0.3
info:
  title: Linbit Exchange API
  description: |
    Linbit 加密货币交易所 REST API。

    - 统一错误模型（`Error`），业务错误码放在 `code` 字段。
    - 除公开行情接口外，均需 `Authorization: Bearer <accessToken>`。
    - 列表接口统一使用 `page` / `pageSize` 游标分页，返回 `Paginated*` 包装。

    该文档同时用于 Prism mock（`pnpm mock`）、生成 TypeScript 类型（`@linbit/api-client`），
    以及未来生成 Kotlin / Swift 客户端，请保持 `examples` 完整。
  version: 1.0.0
  contact:
    name: Linbit Platform
    url: https://linbit.example.com
  license:
    name: Proprietary
servers:
  - url: http://localhost:4010
    description: 本地 Prism mock
  - url: https://api.cowa.click
    description: 测试网 / 生产网关（无 /v1 前缀）
tags:
  - { name: Convert, description: 闪兑 }
  - { name: Home, description: 首页聚合 }
  - { name: App, description: 客户端功能开关 }
  - { name: SubAccount, description: 子账户 }
  - { name: Chat, description: 聊天室 }
  - { name: Event, description: 事件合约 }
  - { name: TradFi, description: 传统金融资产 }
  - { name: Admin, description: 运营后台 }
  - name: Auth
    description: 注册、登录、令牌刷新与登出
  - name: 2FA
    description: 基于 TOTP 的双重验证
  - name: Account
    description: 账户信息
  - name: KYC
    description: 身份认证（基础认证 level 1、高级认证 level 2）
  - name: KYC Admin
    description: KYC 审核（仅内部，需 X-Internal-Token；网关不转发 /admin/*）
  - name: Assets
    description: 资产余额
  - name: Wallet
    description: 充值与提现
  - name: Spot
    description: 现货交易
  - name: Notifications
    description: 站内信 / 消息中心（account 服务）
  - name: Coupons
    description: 卡券中心（体验金、抵扣金；growth 服务）
  - name: Partner
    description: 合伙人（返佣 4 档 + 上级额外返佣最多两级；growth 服务）
  - name: Copy Trading
    description: 合约跟单（仅合约，带单分润 0–50%，按天结算；futures 服务）
  - name: Market
    description: 行情数据（公开）
  - name: Loans
    description: 质押借币（借 USDT，质押 BTC/ETH 等；earn 服务；USDC 不可借）
  - name: Futures
    description: U 本位永续合约（futures 服务）；/futures/market/* 公开
  - name: Earn
    description: 理财（活期 / 定期；earn 服务）
  - name: Strategy
    description: 现货网格策略（strategy 服务）；/strategy/config 与广场公开
  - name: Announcements
    description: 公告（公开只读）

paths:
  /auth/code/send:
    post:
      tags: [Auth]
      summary: 发送注册/找回密码验证码
      operationId: sendAuthCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendCodeRequest" }
            example:
              purpose: register
              phone: "13800138000"
              countryCode: "86"
      responses:
        "200":
          description: 已发送（reset_password 对不存在账号也返回 200）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendCodeResponse" }
              example: { sent: true, channel: sms, ttlSeconds: 600 }
        "400":
          description: 参数错误（VALIDATION_ERROR），或收件邮箱无效/无法投递（INVALID_EMAIL）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: INVALID_EMAIL, message: 邮箱地址无效或无法接收邮件，请检查后重试 }
        "429":
          description: 发送过于频繁
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: RATE_LIMITED, message: 验证码发送过于频繁，请稍后再试 }
        "503":
          description: 邮件/短信通道不可用（EMAIL_UNAVAILABLE / SMS_UNAVAILABLE），原因见服务端日志
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: EMAIL_UNAVAILABLE, message: email delivery unavailable }

  /auth/register:
    post:
      tags: [Auth]
      summary: 注册新账户
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: trader@example.com
              password: "Str0ng-Passw0rd!"
              code: "123456"
              inviteCode: LB8DEMO
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access
                refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh
                tokenType: Bearer
                expiresIn: 3600
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: 邮箱已被注册
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: AUTH_EMAIL_EXISTS
                message: 该邮箱已被注册
                requestId: req_8c1f2a

  /auth/login:
    post:
      tags: [Auth]
      summary: 登录
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: trader@example.com
              password: "Str0ng-Passw0rd!"
              deviceId: web-7f3a
      responses:
        "200":
          description: >
            密码正确。若无需二次验证返回 AuthTokens；若需要（已开启 TOTP 或新设备
            触发邮箱/短信验证）返回 LoginChallenge。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthTokens"
                  - $ref: "#/components/schemas/LoginChallenge"
              examples:
                tokens:
                  summary: 无需二次验证
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access
                    refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh
                    tokenType: Bearer
                    expiresIn: 3600
                challenge:
                  summary: 需二次验证
                  value:
                    challengeToken: 3kZ9...challenge
                    methods: [sms]
                    expiresIn: 300
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: >
            需邮箱/短信验证码但发送过于频繁（RATE_LIMITED）。响应头 Retry-After 为建议等待秒数；
            等待后重新调用登录即可。仅在密码正确后才可能返回，不暴露账号是否存在。
          headers:
            Retry-After: { schema: { type: integer }, description: 建议等待秒数 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: RATE_LIMITED, message: 验证码发送过于频繁，请稍后再试 }
        "503":
          description: 验证码邮件/短信发送失败（EMAIL_UNAVAILABLE / SMS_UNAVAILABLE），请稍后重试
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: EMAIL_UNAVAILABLE, message: 邮件服务暂不可用，请稍后再试 }

  /auth/login/verify:
    post:
      tags: [Auth]
      summary: 提交二次验证，换取令牌
      operationId: loginVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginVerifyRequest" }
            example: { challengeToken: 3kZ9...challenge, code: "123456" }
      responses:
        "200":
          description: 验证通过
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/login/code:
    post:
      tags: [Auth]
      summary: 重新发送登录二次验证码（email/sms）
      operationId: loginResendCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken]
              properties:
                challengeToken: { type: string }
            example: { challengeToken: 3kZ9...challenge }
      responses:
        "200": { description: 已发送 }
        "400":
          description: 参数错误（VALIDATION_ERROR），或收件邮箱无效/无法投递（INVALID_EMAIL）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: INVALID_EMAIL, message: 邮箱地址无效或无法接收邮件，请检查后重试 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: 发送过于频繁（RATE_LIMITED），响应头 Retry-After 为建议等待秒数
          headers:
            Retry-After: { schema: { type: integer }, description: 建议等待秒数 }
        "503":
          description: 邮件/短信通道不可用（EMAIL_UNAVAILABLE / SMS_UNAVAILABLE），原因见服务端日志
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: EMAIL_UNAVAILABLE, message: email delivery unavailable }

  /auth/password/verify-code:
    post:
      tags: [Auth]
      summary: 找回密码-校验验证码并换取重置令牌
      description: >
        找回密码第一步：校验邮箱/短信验证码，成功后返回短期有效（默认 10 分钟）、
        一次性的 resetToken，随后用它调用 /auth/password/reset 设置新密码。
      operationId: verifyPasswordResetCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyResetCodeRequest" }
            example:
              phone: "13800138000"
              countryCode: "86"
              code: "123456"
      responses:
        "200":
          description: 验证码正确，返回重置令牌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyResetCodeResponse" }
              example: { resetToken: "3kZ9...resetTok", expiresIn: 600 }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/password/reset:
    post:
      tags: [Auth]
      summary: 使用重置令牌设置新密码（撤销全部会话）
      description: 找回密码第二步：用 /auth/password/verify-code 返回的 resetToken 设置新密码。
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
            example:
              resetToken: "3kZ9...resetTok"
              newPassword: "N3w-Passw0rd!"
      responses:
        "204": { description: 重置成功 }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新访问令牌
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
            example:
              refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.newaccess
                refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.newrefresh
                tokenType: Bearer
                expiresIn: 3600
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: 登出（吊销该用户全部刷新令牌和访问令牌）
      description: |
        通常带 `Authorization: Bearer <accessToken>`。服务端吊销该用户所有刷新令牌（全部设备），
        并让此前签发的所有访问令牌立即失效（之后用旧访问令牌请求受保护接口返回 401）。
        若访问令牌缺失或已过期，可在请求体带 `{refreshToken}`，服务端据此识别用户并同样完成登出。
        建议客户端始终同时带上 refreshToken。
      operationId: logout
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: 可选；访问令牌无效/过期时用于识别用户（全部刷新令牌都会被吊销）
      responses:
        "204":
          description: 已登出，刷新令牌已吊销，旧访问令牌立即失效
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: 刷新令牌已吊销，但访问令牌吊销暂时失败（LOGOUT_INCOMPLETE），请重试
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: 服务器内部错误（INTERNAL）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /2fa/totp/bind:
    post:
      tags: [2FA]
      summary: 开始绑定 TOTP（返回密钥与 otpauth URI）
      operationId: bindTotp
      responses:
        "200":
          description: 返回待绑定的密钥
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpBinding" }
              example:
                secret: JBSWY3DPEHPK3PXP
                otpauthUri: otpauth://totp/Linbit:trader@example.com?secret=JBSWY3DPEHPK3PXP&issuer=Linbit
        "401": { $ref: "#/components/responses/Unauthorized" }

  /2fa/totp/verify:
    post:
      tags: [2FA]
      summary: 校验 TOTP 验证码并启用 2FA
      operationId: verifyTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 6 位 TOTP 验证码
            example:
              code: "123456"
      responses:
        "200":
          description: 2FA 已启用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorStatus" }
              example:
                enabled: true
                method: totp
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /2fa/totp/disable:
    post:
      tags: [2FA]
      summary: 关闭 TOTP 二次验证
      operationId: disableTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
            example:
              code: "123456"
      responses:
        "200":
          description: 2FA 已关闭
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorStatus" }
              example:
                enabled: false
                method: null
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account:
    get:
      tags: [Account]
      summary: 获取当前账户信息
      operationId: getAccount
      responses:
        "200":
          description: 账户信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
              example:
                uid: "80000001"
                email: trader@example.com
                nickname: lb_Trader
                kycLevel: 1
                twoFactorEnabled: true
                createdAt: "2026-01-05T08:30:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/preferences:
    get:
      tags: [Account]
      summary: 用户偏好（计价货币唯一来源）
      description: 前端所有法币折算统一读取 quoteCurrency；未设置时返回系统默认（ACCOUNT_DEFAULT_QUOTE_CURRENCY）。
      operationId: getAccountPreferences
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AccountPreferences" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Account]
      summary: 设置计价货币（传空字符串恢复默认）
      operationId: updateAccountPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quoteCurrency: { type: string, example: USD }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AccountPreferences" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /account/profile:
    patch:
      tags: [Account]
      summary: 修改昵称 / 头像
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
            example: { nickname: lb_Trader, avatarUrl: https://cdn.example.com/avatar/lb.png }
      responses:
        "200":
          description: 更新后的账户信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/avatar:
    post:
      tags: [Account]
      summary: 上传头像（multipart）
      description: >
        以 multipart/form-data 上传头像图片（字段名 file）。服务端按内容嗅探类型
        （仅支持 jpeg/png/webp），并限制大小（默认 2MB，可配置）。存储后返回更新后的
        账户信息，其中 avatarUrl 指向受控访问路由 /account/avatars/{file}。
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 头像图片（jpeg/png/webp，≤2MB）
      responses:
        "200":
          description: 上传成功，返回更新后的账户信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: 文件过大
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: FILE_TOO_LARGE, message: 头像超过大小限制 }
        "415":
          description: 不支持的图片类型
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: UNSUPPORTED_MEDIA_TYPE, message: 仅支持 JPEG/PNG/WEBP 图片 }

  /account/avatars/{file}:
    get:
      tags: [Account]
      summary: 读取已上传头像（受控访问路由，公开）
      description: 由本地存储后端通过受控路由提供头像访问；仅服务存储目录内文件，阻止路径穿越。
      operationId: getAvatar
      security: []
      parameters:
        - name: file
          in: path
          required: true
          description: 相对存储键（如 80000001/ab12cd.png）
          schema: { type: string }
      responses:
        "200":
          description: 头像图片
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }

  /account/code/send:
    post:
      tags: [Account]
      summary: 向本人发送敏感操作验证码
      operationId: sendAccountCode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendCodeAuthedRequest" }
            example: { purpose: address, channel: sms }
      responses:
        "200":
          description: 已发送
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendCodeResponse" }
              example: { sent: true, channel: sms, ttlSeconds: 600 }
        "400":
          description: 参数错误（VALIDATION_ERROR），或收件邮箱无效/无法投递（INVALID_EMAIL）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: INVALID_EMAIL, message: 邮箱地址无效或无法接收邮件，请检查后重试 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: 发送过于频繁 }
        "503":
          description: 邮件/短信通道不可用（EMAIL_UNAVAILABLE / SMS_UNAVAILABLE），原因见服务端日志
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: EMAIL_UNAVAILABLE, message: email delivery unavailable }

  /account/security:
    get:
      tags: [Account]
      summary: 账户安全概览
      operationId: getSecurityOverview
      description: 2FA、邮箱/手机（脱敏）、资金密码、防钓鱼码、通行密钥数量、提现锁定状态、最近登录设备及当前安全策略。
      responses:
        "200":
          description: 安全概览
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/password/change:
    post:
      tags: [Account]
      summary: 修改登录密码（原密码 + 2FA/验证码，默认注销其他会话）
      operationId: changePassword
      description: |
        已开启 2FA 时需 totpCode；否则需 code（POST /account/code/send purpose=security）。
        成功后撤销除当前设备外的全部会话，并触发提现锁定（默认 24 小时）与安全通知邮件。
        错误码：OLD_PASSWORD_INVALID、PASSWORD_UNCHANGED、TWOFA_REQUIRED(403)、INVALID_TOTP(401)、AUTH_CODE_INVALID。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200":
          description: 已修改
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  revokedSessions: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden2FA" }

  /account/contact/code:
    post:
      tags: [Account]
      summary: 向新邮箱/手机发送绑定验证码（purpose=bind_new）
      operationId: sendContactCode
      description: 传 email 或 phone(+countryCode)。短信不可用时返回 503 SMS_UNAVAILABLE；已被他人使用返回 409 EMAIL_EXISTS/PHONE_EXISTS。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                phone: { type: string }
                countryCode: { type: string, example: "+86" }
      responses:
        "200":
          description: 已发送
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  channel: { type: string, enum: [email, sms] }
                  ttlSeconds: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/BadRequest" }

  /account/email:
    put:
      tags: [Account]
      summary: 修改/绑定邮箱（新旧双重验证）
      operationId: changeEmail
      description: |
        newCode：发到新邮箱的验证码（/account/contact/code）；oldCode：发到原邮箱（未绑邮箱时为现有联系方式）的验证码
        （/account/code/send purpose=security）；已开启 2FA 时另需 totpCode。成功后触发提现锁定与安全通知。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeContactRequest" }
      responses:
        "200": { description: 已更新, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden2FA" }
        "409": { $ref: "#/components/responses/BadRequest" }

  /account/phone:
    put:
      tags: [Account]
      summary: 修改/绑定手机（新旧双重验证）
      operationId: changePhone
      description: 同 /account/email，传 phone + countryCode。短信不可用时 503 SMS_UNAVAILABLE。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeContactRequest" }
      responses:
        "200": { description: 已更新, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden2FA" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/BadRequest" }

  /account/fund-password:
    post:
      tags: [Account]
      summary: 设置资金密码（6 位数字，首次）
      operationId: setFundPassword
      description: 需 2FA 或 code(purpose=security)。已设置返回 409 FUND_PASSWORD_EXISTS。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FundPasswordRequest" }
      responses:
        "200": { description: 已设置, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden2FA" }
        "409": { $ref: "#/components/responses/BadRequest" }
    put:
      tags: [Account]
      summary: 修改资金密码（需原资金密码 + 2FA/验证码）
      operationId: changeFundPassword
      description: 原资金密码连续错误达上限（默认 5 次）锁定（423 FUND_PASSWORD_LOCKED，含 lockedUntil）。成功后触发提现锁定。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FundPasswordRequest" }
      responses:
        "200": { description: 已修改, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden2FA" }
        "423": { $ref: "#/components/responses/BadRequest" }

  /account/fund-password/reset:
    post:
      tags: [Account]
      summary: 重置资金密码（忘记时，2FA/验证码，清除锁定）
      operationId: resetFundPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FundPasswordRequest" }
      responses:
        "200": { description: 已重置, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden2FA" }

  /account/anti-phishing:
    put:
      tags: [Account]
      summary: 设置/修改防钓鱼码（4-20 位字母数字，显示在平台所有外发邮件开头）
      operationId: setAntiPhishing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [antiPhishingCode]
              properties:
                antiPhishingCode: { type: string, example: "Lb2026" }
                totpCode: { type: string }
                code: { type: string, description: 未开 2FA 时 purpose=security 验证码 }
      responses:
        "200": { description: 已设置, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden2FA" }

  /account/sessions:
    get:
      tags: [Account]
      summary: 列出有效登录会话（refresh token）
      operationId: listSessions
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Session" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/sessions/{id}:
    delete:
      tags: [Account]
      summary: 注销指定会话
      operationId: revokeSession
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 已注销 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /account/sessions/revoke-others:
    post:
      tags: [Account]
      summary: 注销除当前设备外的全部会话
      operationId: revokeOtherSessions
      responses:
        "200":
          description: 已注销
          content:
            application/json:
              schema: { type: object, properties: { revoked: { type: integer } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/passkeys:
    get:
      tags: [Account]
      summary: 列出通行密钥（Passkey / WebAuthn）
      operationId: listPasskeys
      responses:
        "200":
          description: 列表；enabled=false 表示服务端未配置 WEBAUTHN_RP_ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  items: { type: array, items: { $ref: "#/components/schemas/Passkey" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/passkeys/register/begin:
    post:
      tags: [Account]
      summary: 开始注册通行密钥（需 2FA/验证码）
      operationId: beginPasskeyRegistration
      description: 返回 publicKey（PublicKeyCredentialCreationOptions，二进制字段为 base64url）与 sessionId（5 分钟有效、一次性）。未启用时 503 PASSKEY_UNAVAILABLE。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                totpCode: { type: string }
                code: { type: string }
      responses:
        "200": { description: 注册选项, content: { application/json: { schema: { $ref: "#/components/schemas/PasskeyCeremony" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden2FA" }
        "503": { $ref: "#/components/responses/BadRequest" }

  /account/passkeys/register/finish:
    post:
      tags: [Account]
      summary: 完成注册通行密钥
      operationId: finishPasskeyRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, credential]
              properties:
                sessionId: { type: string }
                name: { type: string, maxLength: 64 }
                credential: { type: object, description: navigator.credentials.create() 结果的 JSON（PublicKeyCredential.toJSON()） }
      responses:
        "201": { description: 已绑定, content: { application/json: { schema: { $ref: "#/components/schemas/Passkey" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/BadRequest" }

  /account/passkeys/{id}:
    delete:
      tags: [Account]
      summary: 删除通行密钥
      operationId: deletePasskey
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 已删除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/passkey/login/begin:
    post:
      tags: [Auth]
      summary: 通行密钥登录：获取挑战（可发现凭据，无需用户名）
      operationId: beginPasskeyLogin
      security: []
      responses:
        "200": { description: 登录选项, content: { application/json: { schema: { $ref: "#/components/schemas/PasskeyCeremony" } } } }
        "503": { $ref: "#/components/responses/BadRequest" }

  /auth/passkey/login/finish:
    post:
      tags: [Auth]
      summary: 通行密钥登录：校验断言并签发令牌
      operationId: finishPasskeyLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, credential]
              properties:
                sessionId: { type: string }
                credential: { type: object, description: navigator.credentials.get() 结果的 JSON }
                deviceId: { type: string }
                deviceName: { type: string }
      responses:
        "200": { description: 登录成功, content: { application/json: { schema: { $ref: "#/components/schemas/AuthTokens" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/BadRequest" }

  /account/devices:
    get:
      tags: [Account]
      summary: 列出登录设备
      operationId: listDevices
      responses:
        "200":
          description: 设备列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/devices/{deviceId}:
    delete:
      tags: [Account]
      summary: 移除设备（撤销该设备会话）
      operationId: removeDevice
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: 已移除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /account/withdraw-whitelist:
    get:
      tags: [Account]
      summary: 查询提现白名单开关
      operationId: getWithdrawWhitelist
      responses:
        "200":
          description: 开关状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhitelistStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Account]
      summary: 开关提现白名单（需验证码或 2FA）
      operationId: setWithdrawWhitelist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetWhitelistRequest" }
            example: { enabled: true, code: "123456" }
      responses:
        "200":
          description: 新状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhitelistStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/withdraw-addresses:
    get:
      tags: [Account]
      summary: 提现地址簿列表
      operationId: listWithdrawAddresses
      responses:
        "200":
          description: 地址簿
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithdrawAddressList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Account]
      summary: 新增提现地址（需验证码或 2FA）
      operationId: createWithdrawAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWithdrawAddressRequest" }
            example:
              asset: USDT
              network: TRC20
              address: TXy1Z9DemoAddr000000000000000000000
              label: cold-wallet
              code: "123456"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithdrawAddress" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: 地址已存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: ADDRESS_EXISTS, message: 该地址已在地址簿中 }

  /account/withdraw-addresses/{id}:
    patch:
      tags: [Account]
      summary: 修改提现地址（label / memo / 白名单标记；需验证码或 2FA）
      operationId: updateWithdrawAddress
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                memo: { type: string }
                whitelisted: { type: boolean }
                totpCode: { type: string }
                code: { type: string, description: 未开启 2FA 时提供（purpose=address） }
      responses:
        "200":
          description: 更新后的地址
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithdrawAddress" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Account]
      summary: 删除提现地址（需验证码或 2FA）
      operationId: deleteWithdrawAddress
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: false
          description: 未开启 2FA 时提供（purpose=address）
          schema: { type: string }
        - name: totpCode
          in: query
          required: false
          description: 已开启 2FA 时提供
          schema: { type: string }
      responses:
        "204": { description: 已删除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /kyc:
    post:
      tags: [KYC]
      summary: 提交 KYC 认证资料
      operationId: submitKyc
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KycSubmission" }
            example:
              firstName: San
              lastName: Zhang
              country: SG
              idType: passport
              idNumber: E12345678
              dateOfBirth: "1992-04-18"
      responses:
        "202":
          description: 已受理，进入审核
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
              example:
                level: 1
                status: pending
                submittedAt: "2026-11-02T10:00:00Z"
                reason: null
        "400":
          description: |
            参数错误：VALIDATION_ERROR、UNDERAGE（默认未满 18 岁，KYC_MIN_AGE 可配）、
            KYC_LEVEL_REQUIRED（高级认证需先通过基础认证）、DOCUMENT_NOT_FOUND、DOCUMENT_SIDE_MISMATCH
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: KYC_PENDING（已有审核中的申请）或 ID_NUMBER_TAKEN（证件已被其他账户认证） }

  /kyc/status:
    get:
      tags: [KYC]
      summary: 查询 KYC 状态
      operationId: getKycStatus
      responses:
        "200":
          description: KYC 状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
              example:
                level: 1
                status: approved
                submittedAt: "2026-11-01T10:00:00Z"
                reason: null
        "401": { $ref: "#/components/responses/Unauthorized" }


  /kyc/documents:
    post:
      tags: [KYC]
      summary: 上传 KYC 证件图片
      description: |
        multipart/form-data。按文件内容识别类型，仅支持 JPEG/PNG；默认上限 10MB
        （KYC_DOC_MAX_BYTES 可配）。文件只属于上传者，提交 /kyc 时校验归属与 side。
      operationId: uploadKycDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, side]
              properties:
                file: { type: string, format: binary }
                side: { type: string, enum: [front, selfie, back, proof_of_address] }
      responses:
        "201":
          description: 已上传
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: 文件过大（FILE_TOO_LARGE） }
        "415": { description: 不支持的文件类型（UNSUPPORTED_MEDIA_TYPE） }

  /admin/kyc/applications:
    get:
      tags: [KYC Admin]
      summary: 审核列表
      operationId: adminListKycApplications
      security: [{ internalToken: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        "200":
          description: 申请列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/KycApplication" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/kyc/applications/{id}:
    get:
      tags: [KYC Admin]
      summary: 申请详情（含证件受控读取地址）
      operationId: adminGetKycApplication
      security: [{ internalToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: app_1 } }
      responses:
        "200":
          description: 申请详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycApplication" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/kyc/applications/{id}/approve:
    post:
      tags: [KYC Admin]
      summary: 审核通过（同步账户 kycLevel，只升不降）
      operationId: adminApproveKyc
      security: [{ internalToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 已通过
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycApplication" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: 不在待审核状态（NOT_PENDING）或证件已被他人认证（ID_NUMBER_TAKEN） }

  /admin/kyc/applications/{id}/reject:
    post:
      tags: [KYC Admin]
      summary: 驳回（reason 必填，用户可重新提交）
      operationId: adminRejectKyc
      security: [{ internalToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, example: 证件照片模糊 }
      responses:
        "200":
          description: 已驳回
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycApplication" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: 不在待审核状态（NOT_PENDING） }

  /admin/kyc/documents/{id}:
    get:
      tags: [KYC Admin]
      summary: 受控读取证件图片
      operationId: adminGetKycDocument
      security: [{ internalToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: doc_1 } }
      responses:
        "200":
          description: 图片内容
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/kyc/level-sync:
    get:
      tags: [KYC Admin]
      summary: 待同步到账户服务的认证等级（失败自动重试队列）
      description: |
        审核通过后先持久化同步任务再立即尝试；失败按指数退避（默认 5s 起翻倍，
        上限 1h，KYC_SYNC_BASE_SECONDS / KYC_SYNC_MAX_SECONDS）自动重试直至成功。
      operationId: adminListKycLevelSync
      security: [{ internalToken: [] }]
      responses:
        "200":
          description: 未完成的同步任务
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        userId: { type: string }
                        level: { type: integer }
                        attempts: { type: integer }
                        nextAttemptAt: { type: string, format: date-time }
                        lastError: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /assets/balances:
    get:
      tags: [Assets]
      summary: 获取资产余额列表
      operationId: getBalances
      description: |
        列出一个钱包的余额。account=spot（默认）为现货账户，account=funding 为资金账户；
        大小写不敏感，其他值返回 400 VALIDATION_ERROR。合约账户余额请用 /futures 接口。
        默认资产（USDT、USDC、BTC、ETH、SOL、BNB、TRX）即使余额为 0 也会列出。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: account
          in: query
          required: false
          description: 钱包：spot（默认）或 funding
          schema: { type: string, enum: [spot, funding], default: spot }
      responses:
        "200":
          description: 余额列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedBalances" }
              example:
                items:
                  - asset: USDT
                    free: "10520.33000000"
                    locked: "250.00000000"
                    total: "10770.33000000"
                    valuationUsd: "10770.33"
                  - asset: BTC
                    free: "0.52100000"
                    locked: "0.00000000"
                    total: "0.52100000"
                    valuationUsd: "39994.40"
                page: 1
                pageSize: 20
                total: 2
                account: spot
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }


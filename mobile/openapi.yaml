      operationId: futuresMarkHistory
      security: []
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          example: BTCUSDT
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          description: 默认 200，最大 2000
      - name: interval
        in: query
        required: false
        description: 不传返回原始采样；传入则返回标记价 K 线
        schema:
          type: string
          enum: [1m, 5m, 15m, 30m, 1h, 4h, 1d]
      - name: startTime
        in: query
        required: false
        description: 起始时间（毫秒，含）
        schema:
          type: integer
          format: int64
      - name: endTime
        in: query
        required: false
        description: 结束时间（毫秒，含）；翻页时传上一页的 nextEndTime
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  interval:
                    type: string
                  sampleSeconds:
                    type: integer
                    description: 原始采样间隔（秒）
                  nextEndTime:
                    type: integer
                    format: int64
                  history:
                    type: array

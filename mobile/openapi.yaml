                page: 1
                pageSize: 20
                total: 1
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wallet/withdraw/{id}/cancel:
    post:
      tags: [Wallet]
      summary: 撤销提现申请
      description: >
        仅可撤销处于待人工审核（pending）状态的提现；撤销后冻结金额解冻退回可用余额。
      operationId: cancelWithdrawal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: wd_0001
      responses:
        "200":
          description: 已撤销
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Withdrawal" }
        "409":
          description: 该提现无法撤销（不存在或已进入处理）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }


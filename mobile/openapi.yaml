        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/BadRequest" }
  /assets/transfers:
    get:
      tags: [Assets]
      summary: 划转历史（含旧 /futures/transfer 记录，clientId 为 null）
      operationId: listAssetTransfers
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: asset, in: query, required: false, schema: { type: string, example: USDT } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Transfer" } }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /assets/overview:
    get:
      tags: [Assets]
      summary: 资产总览（资金账户 funding / 现货 spot / 合约 futures 分账户余额与 USDT 估值）
      description: |
        充值默认入 funding、提现默认从 funding 扣（后台可配置为 spot，见 depositAccount/withdrawAccount）。
        合约账户只接受 USDT 划转。价格缺失时该币 valuationUsd 为 null 且不计入合计；合约服务不可用时 futures.available=false。
      operationId: getAssetsOverview
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetsOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /wallet/networks:
    get:
      tags: [Wallet]
      summary: 币种网络参数（充提开关、最小充值、确认数、Memo、提现手续费/最小提现）
      operationId: listWalletNetworks
      parameters:
        - { name: asset, in: query, required: false, description: 不传返回全部网络, schema: { type: string, example: USDT } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [networks]
                properties:
                  asset: { type: string, example: USDT }
                  networks: { type: array, items: { $ref: "#/components/schemas/WalletNetwork" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /wallet/internal-transfer:
    post:
      tags: [Wallet]
      summary: 站内转账（免手续费、实时到账，需 2FA，按 clientId 幂等）
      description: |
        从资金账户（funding）转给另一位平台用户（toUid 或 toEmail 二选一）。收款方须存在、状态正常且不是子账户。
        24 小时滚动额度按 USDT 估值计（后台可配，默认 50000；0=不限）；功能可被后台关闭。
        错误码：VALIDATION_ERROR、TWOFA_REQUIRED(403)、INVALID_TOTP(401)、WITHDRAW_LOCKED(403)、FUND_PASSWORD_*、INTERNAL_TRANSFER_DISABLED(403)、RECIPIENT_NOT_FOUND(404)、SELF_TRANSFER、
        RECIPIENT_SUB_ACCOUNT、RECIPIENT_UNAVAILABLE、PRICE_UNAVAILABLE、INTERNAL_TRANSFER_LIMIT_EXCEEDED、INSUFFICIENT_BALANCE、
        IDEMPOTENCY_CONFLICT(409，同 clientId 不同参数)。
      operationId: createInternalTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InternalTransferRequest" }
      responses:
        "200":
          description: 完成（或同 clientId 重放返回原结果）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalTransfer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
  /wallet/internal-transfers:
    get:
      tags: [Wallet]
      summary: 站内转账记录（转出 + 已到账的转入）
      operationId: listInternalTransfers
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InternalTransfer" } }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /spot/orders/conditional:
    post:
      tags: [Spot]
      summary: 条件单（止损 stop / 止盈 take_profit / 计划委托 trigger），最新成交价穿越触发价后下限价或市价单
      description: |
        创建时即冻结所需资金；触发后释放并按普通下单流程提交子订单（orderId 回填）。
        方向：stop 买=up 卖=down；take_profit 买=down 卖=up；trigger 按当前价自动判断或传 triggerDirection。
        错误码：VALIDATION_ERROR、TRIGGER_WOULD_IMMEDIATELY_FIRE、CONDITIONAL_LIMIT_EXCEEDED（每人最多 50 个未触发）、INSUFFICIENT_BALANCE、IDEMPOTENCY_CONFLICT。
      operationId: createConditionalOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConditionalOrderRequest" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConditionalOrder" }
        "200":
          description: 同 clientOrderId 重放
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConditionalOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      tags: [Spot]
      summary: 条件单列表（默认 status=open 即 pending/triggering；all 或具体状态）
      operationId: listConditionalOrders
      parameters:
        - { name: symbol, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, all, pending, triggering, triggered, canceled, failed] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ConditionalOrder" } }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /spot/orders/conditional/{id}:
    delete:
      tags: [Spot]
      summary: 撤销未触发的条件单（释放冻结；已撤销重复调用返回 200）
      operationId: cancelConditionalOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 已撤销
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConditionalOrder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
  /account/fee-rates:
    get:
      tags: [Account]
      summary: 我的手续费率（现货 + 合约 maker/taker，含后台个人费率覆盖）
      description: VIP 仅提供服务权益，费率统一（vipLevel 恒为 0）；合约服务不可用时 futures 为 null。
      operationId: getFeeRates
      parameters:
        - { name: symbol, in: query, required: false, schema: { type: string, example: BTCUSDT } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeRates" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/v1/announcements/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [Admin]
      summary: 修改公告（部分字段；需 content 编辑权限，审计）
      operationId: adminUpdateAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category: { type: string }
                title: { type: string }
                body: { type: string }
                publishAt: { type: string, format: date-time }
                pinned: { type: boolean }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Announcement" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: NOT_FOUND, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [Admin]
      summary: 删除公告（需 content 编辑权限，审计）
      operationId: adminDeleteAnnouncement
      responses:
        "204": { description: Deleted }
        "404": { description: NOT_FOUND, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/v1/home/placements:
    get:
      tags: [Admin]
      summary: 运营位列表（?slot= 过滤）
      operationId: adminListPlacements
      parameters:
        - { name: slot, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Placement" } } } } } } }
    post:
      tags: [Admin]
      summary: 创建运营位（需 content 权限 + totpCode + reason，审计 levelHigh）
      operationId: adminCreatePlacement
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementChange" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /admin/v1/home/placements/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Admin]
      summary: 更新运营位（totpCode + reason）
      operationId: adminUpdatePlacement
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementChange" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Admin]
      summary: 删除运营位（body 含 totpCode + reason）
      operationId: adminDeletePlacement
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminWriteMeta" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementChange" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/v1/app/features:
    get:
      tags: [Admin]
      summary: 功能开关（含默认值与可用 key）
      operationId: adminGetAppFeatures
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    put:
      tags: [Admin]
      summary: 部分更新功能开关（未知 key 400；totpCode + reason，审计）
      operationId: adminSetAppFeatures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/AdminWriteMeta" }
                - type: object
                  required: [features]
                  properties:
                    features: { type: object, additionalProperties: { type: boolean }, example: { chat: true } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  features: { type: object, additionalProperties: { type: boolean } }
                  updatedAt: { type: string, format: date-time, nullable: true }
                  before: { type: object, additionalProperties: { type: boolean } }
                  after: { type: object, additionalProperties: { type: boolean } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /sub-accounts:
    get:
      tags: [SubAccount]
      summary: 子账户列表（母账户）
      operationId: subAccountList
      security: [{ bearerAuth: [] }]
      parameters:
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SubAccount' } }
                  total: { type: integer }
                  page: { type: integer }
                  size: { type: integer }
                  limit: { type: integer, description: 每个母账户可创建的子账户上限（管理员可调，默认 20） }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: SUB_ACCOUNT_FORBIDDEN（子账户调用）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      tags: [SubAccount]
      summary: 创建子账户（母账户需已开启谷歌验证；上限默认 20，不可嵌套）
      operationId: subAccountCreate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, pattern: '^[a-z0-9][a-z0-9_]{2,19}$', description: 子账户名，生成虚拟登录邮箱 }
                nickname: { type: string, maxLength: 32 }
                note: { type: string, maxLength: 200 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SubAccount' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: TWOFA_REQUIRED / SUB_ACCOUNT_DISABLED / SUB_ACCOUNT_FORBIDDEN / ACCOUNT_FROZEN, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: SUB_ACCOUNT_LIMIT / SUB_ACCOUNT_EXISTS, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /sub-accounts/assets:
    get:
      tags: [SubAccount]
      summary: 全部子账户资产汇总
      operationId: subAccountAssetsAll
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        uid: { type: string }
                        username: { type: string }
                        nickname: { type: string }
                        status: { type: string }
                        balances: { type: array, items: { $ref: '#/components/schemas/SubBalance' } }
                  totals: { type: array, items: { $ref: '#/components/schemas/SubBalance' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /sub-accounts/transfer:
    post:
      tags: [SubAccount]
      summary: 母子账户现货划转（clientId 幂等）
      description: |
        母账户：direction=to_sub 或 to_parent，需 subAccountId。
        子账户（登录或会话）：仅允许 to_parent，subAccountId 可省略。
        同一 clientId 重放返回同一笔记录；参数不同返回 409 CLIENT_ID_REUSED。
      operationId: subAccountTransfer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, direction, asset, amount]
              properties:
                clientId: { type: string, maxLength: 64 }
                subAccountId: { type: string, description: 子账户 UID }
                direction: { type: string, enum: [to_sub, to_parent] }
                asset: { type: string, example: USDT }
                amount: { type: string, example: '100' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SubTransfer' } } } }
        '400': { description: VALIDATION_ERROR / INSUFFICIENT_BALANCE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: SUB_ACCOUNT_FORBIDDEN / SUB_ACCOUNT_FROZEN, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: SUB_ACCOUNT_NOT_FOUND, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: CLIENT_ID_REUSED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: TRANSFER_PENDING（可用同一 clientId 重试）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /sub-accounts/transfers:
    get:
      tags: [SubAccount]
      summary: 母子划转记录
      operationId: subAccountTransfers
      security: [{ bearerAuth: [] }]
      parameters:
      - { name: subAccountId, in: query, required: false, schema: { type: string } }
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SubTransfer' } }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /sub-accounts/{id}:
    parameters:
    - { name: id, in: path, required: true, description: 子账户 UID, schema: { type: string } }
    get:
      tags: [SubAccount]
      summary: 子账户详情
      operationId: subAccountGet
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SubAccount' } } } }
        '404': { description: SUB_ACCOUNT_NOT_FOUND, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      tags: [SubAccount]
      summary: 修改子账户（昵称/备注/登录开关/密码）
      description: 开启登录需 password(≥8) 与母账户 totpCode，返回子账户自己的谷歌验证密钥 loginTotp（仅此一次）。关闭登录会注销子账户全部会话。
      operationId: subAccountPatch
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string }
                note: { type: string }
                loginEnabled: { type: boolean }
                password: { type: string, minLength: 8 }
                totpCode: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  subAccount: { $ref: '#/components/schemas/SubAccount' }
                  loginTotp:
                    type: object
                    properties:
                      secret: { type: string }
                      otpauthUri: { type: string }
        '401': { description: INVALID_TOTP（动态码错误）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: TWOFA_REQUIRED（未绑定或未提供 TOTP）/ SUB_LOGIN_NOT_ALLOWED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /sub-accounts/{id}/freeze:
    parameters:
    - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [SubAccount]
      summary: 冻结子账户（禁止登录、API Key、划入）
      operationId: subAccountFreeze
      security: [{ bearerAuth: [] }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SubAccount' } } } }
  /sub-accounts/{id}/unfreeze:
    parameters:
    - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [SubAccount]
      summary: 解冻子账户
      operationId: subAccountUnfreeze
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SubAccount' } } } }
  /sub-accounts/{id}/assets:
    parameters:
    - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [SubAccount]
      summary: 子账户现货资产
      operationId: subAccountAssets
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid: { type: string }
                  username: { type: string }
                  nickname: { type: string }
                  status: { type: string }
                  balances: { type: array, items: { $ref: '#/components/schemas/SubBalance' } }
  /sub-accounts/{id}/orders:
    parameters:
    - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [SubAccount]
      summary: 子账户现货委托/历史/成交（透传订单服务的分页与筛选参数）
      operationId: subAccountOrders
      security: [{ bearerAuth: [] }]
      parameters:
      - { name: type, in: query, schema: { type: string, enum: [open, history, trades], default: history } }
      - { name: symbol, in: query, schema: { type: string } }
      - $ref: '#/components/parameters/Page'
      responses:
        '200': { description: 与 /spot/orders/open、/spot/orders/history、/spot/trades 相同 }
  /sub-accounts/{id}/api-keys:
    parameters:
    - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [SubAccount]
      summary: 子账户 API Key 列表（不含 secret）
      operationId: subAccountApiKeys
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/SubApiKey' } } } } } } }
    post:
      tags: [SubAccount]
      summary: 为子账户创建 API Key（需母账户 totpCode；无提现权限）
      description: |
        调用方式：请求头 X-LB-APIKEY + X-LB-SECRET（secret 仅在创建时返回一次）。
        read：GET /assets、/spot、/futures；spot_trade：/spot 全部；futures_trade：/futures 全部。
        /wallet、/account、/auth、/2fa、/sub-accounts 等一律 403 API_KEY_FORBIDDEN。
      operationId: subAccountApiKeyCreate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions, totpCode]
              properties:
                label: { type: string, maxLength: 40 }
                permissions: { type: array, items: { type: string, enum: [read, spot_trade, futures_trade] } }
                ipAllowlist: { type: array, maxItems: 20, items: { type: string, description: IP 或 CIDR } }
                totpCode: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SubApiKey' } } } }
        '400': { description: PERMISSION_NOT_ALLOWED / VALIDATION_ERROR, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: INVALID_TOTP, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: TWOFA_REQUIRED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: API_KEY_LIMIT, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /sub-accounts/{id}/api-keys/{apiKey}:
    parameters:
    - { name: id, in: path, required: true, schema: { type: string } }
    - { name: apiKey, in: path, required: true, schema: { type: string } }
    delete:
      tags: [SubAccount]
      summary: 删除（吊销）子账户 API Key
      operationId: subAccountApiKeyDelete
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
  /chat/rooms:
    get:
      tags: [Chat]
      summary: 聊天室列表（公开；general + spot.{SYM} + futures.{SYM}，含在线人数与发言规则；功能开关 chat 关闭时 403 FEATURE_DISABLED）
      description: |
        实时推送：在现有 /ws 上订阅频道 `chat:{room}`（如 `chat:spot.BTCUSDT`）。
        帧 data 为 `{type:"message", message: ChatMessage}` 或 `{type:"delete", id}`。
        推送帧是广播，不含 `mine` 和 `clientId`；客户端用发言接口返回的消息 `id` 与推送 `message.id` 比对来识别自己的消息。
      operationId: listChatRooms
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms: { type: array, items: { $ref: "#/components/schemas/ChatRoom" } }
                  rules: { $ref: "#/components/schemas/ChatRules" }
        "403": { description: FEATURE_DISABLED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /chat/rooms/{room}/messages:
    parameters:
      - { name: room, in: path, required: true, schema: { type: string, example: spot.BTCUSDT } }
    get:
      tags: [Chat]
      summary: 历史消息（公开，新→旧；before=消息 id 游标，limit 默认 50，上限 historyLimitMax）
      operationId: listChatMessages
      security: []
      parameters:
        - { name: before, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
                  hasMore: { type: boolean }
        "403": { description: FEATURE_DISABLED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Chat]
      summary: 发言（需登录 + KYC ≥ minKycLevel；服务端拦截链接/联系方式/屏蔽词；频率与长度限制；clientId 幂等）
      description: |
        错误码：CHAT_KYC_REQUIRED/CHAT_MUTED(含 mutedUntil)/CHAT_BANNED/FEATURE_DISABLED (403)，
        CHAT_RATE_LIMITED (429，含 retryAfterMs 与 Retry-After)，CHAT_TOO_LONG/CHAT_LINK_BLOCKED/CHAT_CONTACT_BLOCKED/CHAT_WORD_BLOCKED/VALIDATION_ERROR (400)，
        CHAT_UNAVAILABLE (503)。相同 clientId 重放返回 200 与原消息。
      operationId: postChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, text]
              properties:
                clientId: { type: string, maxLength: 64 }
                text: { type: string, maxLength: 200 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ChatMessage" } } } }
        "200": { description: 幂等重放, content: { application/json: { schema: { $ref: "#/components/schemas/ChatMessage" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: CHAT_RATE_LIMITED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /chat/messages/{id}/report:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [Chat]
      summary: 举报消息（需登录；不可举报自己；同一人重复举报幂等）
      operationId: reportChatMessage
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 200 } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/v1/mm/testnet-seed:
    post:
      tags: [Admin]
      summary: 做市账户虚拟注资（仅测试网/mock 链；主网或禁用虚拟额度时 403 SEED_DISABLED；totpCode 必填，审计）
      description: |
        三种模式（ref 为幂等键）：
        - 仅 {ref}：注入 MM_SEED_AMOUNT USDT（原行为不变）。
        - {ref, assets[, usdtValue, amounts]}：按指数价为每个基础资产注入约 usdtValue。
        - {ref, asset, amount, reason}：单资产精确注资到做市现货账户，例如 {asset:"USDT", amount:"5000000"}；
          reason 必填，amount ≤ ADMIN_MM_SEED_MAX（默认 10,000,000，可配置；兼容旧名 MM_SEED_MAX），不可与 assets 混用；
          资产须为 USDT 或 MM_SEED_BASE_ASSETS 之一。审计日志记录 asset/amount。
      operationId: adminMMTestnetSeed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref, totpCode]
              properties:
                ref: { type: string, description: 幂等键 }
                assets: { type: array, items: { type: string } }
                usdtValue: { type: string }
                amounts: { type: object, additionalProperties: { type: string } }
                asset: { type: string, example: USDT, description: 单资产模式 }
                amount: { type: string, example: "5000000", description: 单资产模式数量（≤ ADMIN_MM_SEED_MAX） }
                reason: { type: string, description: 单资产模式必填 }
                totpCode: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, already_applied] }
                  txType: { type: string, example: mm_testnet_seed }
                  asset: { type: string }
                  amount: { type: string }
                  usdtValue: { type: string }
                  items: { type: array, items: { type: object, additionalProperties: true } }
        "400": { description: "VALIDATION_ERROR / ASSET_NOT_ALLOWED" }
        "401": { description: "TOTP_INVALID" }
        "403": { description: "SEED_DISABLED（主网/生产）或无权限" }
  /admin/v1/mm/baselines:
    get:
      tags: [Admin]
      summary: 做市现货库存基线（max_position 只限制净头寸 = 当前 base − baseline）
      description: |
        基线优先级：admin targetBase > 测试网 mm_testnet_seed 注资量（seed）> 首次启动时余额（start）> 0（none）。
        GET /admin/v1/mm/status 中每个现货对的 inventory 同时给出 baseQty/baseline/baselineSource/netQty/netValue。
      operationId: adminMMBaselines
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MMBaseline" } }
  /admin/v1/mm/baselines/{asset}:
    put:
      tags: [Admin]
      summary: 设置/清除库存基线（主网库存目标）；totpCode + reason 必填，审计 update_baseline
      operationId: adminMMSetBaseline
      parameters:
        - { name: asset, in: path, required: true, schema: { type: string, example: SOL } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, totpCode]
              properties:
                targetBase: { type: string, example: "6666.66666666", description: 管理员设定的库存目标（基础资产数量） }
                clearTarget: { type: boolean, description: 清除 targetBase }
                resetStart: { type: boolean, description: 清除启动基线，下次启动重新采集 }
                reason: { type: string }
                totpCode: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MMBaseline" } } } }
        "400": { description: VALIDATION_ERROR / INVALID_PARAM }
        "401": { description: TOTP_INVALID }
  /admin/v1/proof-of-reserves:
    get:
      tags: [Admin]
      summary: 储备证明快照列表（后台手动录入，新→旧；content 权限）
      operationId: adminListPorSnapshots
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/PorSnapshot" } } } } } } }
    post:
      tags: [Admin]
      summary: 录入储备证明快照（同一 snapshotAt 已存在 409；totpCode + reason，审计 por_create）。最新快照即 GET /market/proof-of-reserves
      operationId: adminCreatePorSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/AdminWriteMeta" }
                - { $ref: "#/components/schemas/PorSnapshotInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, required: [snapshot], properties: { snapshot: { $ref: "#/components/schemas/PorSnapshot" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: 该时间点已有快照 (SNAPSHOT_EXISTS) }
  /admin/v1/proof-of-reserves/{id}:
    parameters:
      - { name: id, in: path, required: true, description: snapshotAt 的 Unix 毫秒, schema: { type: integer, format: int64 } }
    delete:
      tags: [Admin]
      summary: 删除整个快照（body：totpCode + reason，审计 por_delete）
      operationId: adminDeletePorSnapshot
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminWriteMeta" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { deleted: { type: boolean } } } } } }
        "404": { description: 快照不存在 }
  /admin/v1/chat/config:
    get:
      tags: [Admin]
      summary: 聊天配置（content 权限）
      operationId: adminGetChatConfig
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChatConfig" } } } }
    put:
      tags: [Admin]
      summary: 部分更新聊天配置（未知 key 400；totpCode + reason，审计 chat_config_update）
      operationId: adminUpdateChatConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/AdminWriteMeta" }
                - { $ref: "#/components/schemas/ChatConfig" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChatChange" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /admin/v1/chat/messages:
    get:
      tags: [Admin]
      summary: 消息检索（room/uid/status/q/before/limit；含完整 uid 与举报数）
      operationId: adminListChatMessages
      parameters:
        - { name: room, in: query, required: false, schema: { type: string } }
        - { name: uid, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [visible, deleted] } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: before, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ChatAdminMessage" } }, hasMore: { type: boolean } } } } } }
  /admin/v1/chat/messages/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [Admin]
      summary: 删除消息（WS 推送 delete；关联未处理举报置为 resolved；totpCode + reason）
      operationId: adminDeleteChatMessage
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminWriteMeta" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChatChange" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/v1/chat/sanctions:
    get:
      tags: [Admin]
      summary: 禁言/封禁名单
      operationId: adminListChatSanctions
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ChatSanction" } } } } } } }
  /admin/v1/chat/mutes:
    post:
      tags: [Admin]
      summary: 禁言（durationMinutes 1-525600；totpCode + reason）
      operationId: adminMuteChatUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/AdminWriteMeta" }
                - type: object
                  required: [uid, durationMinutes]
                  properties:
                    uid: { type: string }
                    durationMinutes: { type: integer, minimum: 1, maximum: 525600 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChatChange" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /admin/v1/chat/mutes/{uid}:
    parameters:
      - { name: uid, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Admin]
      summary: 解除禁言（totpCode + reason）
      operationId: adminUnmuteChatUser
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminWriteMeta" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChatChange" } } } }
  /admin/v1/chat/bans:
    post:
      tags: [Admin]
      summary: 封禁发言（永久，直至解除；totpCode + reason）
      operationId: adminBanChatUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/AdminWriteMeta" }
                - { type: object, required: [uid], properties: { uid: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChatChange" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /admin/v1/chat/bans/{uid}:
    parameters:
      - { name: uid, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Admin]
      summary: 解除封禁（totpCode + reason）
      operationId: adminUnbanChatUser
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminWriteMeta" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChatChange" } } } }
  /admin/v1/chat/reports:
    get:
      tags: [Admin]
      summary: 举报列表（status=open|resolved|dismissed|all，默认 open）
      operationId: adminListChatReports
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, resolved, dismissed, all] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ChatReport" } } } } } } }
  /admin/v1/chat/reports/{id}/resolve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [Admin]
      summary: 处理举报（action=resolve|dismiss；totpCode + reason）
      operationId: adminResolveChatReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/AdminWriteMeta" }
                - { type: object, required: [action], properties: { action: { type: string, enum: [resolve, dismiss] } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChatChange" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /event/products:
    get:
      tags: [Event]
      summary: 事件合约产品（公开；标的、周期、赔率、限额与当前指数价；功能开关 eventContracts 关闭时 enabled=false）
      operationId: listEventProducts
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EventProducts" } } } }
  /event/orders:
    post:
      tags: [Event]
      summary: 下单（猜涨跌；clientId 幂等，重放返回原订单）
      description: |
        开仓价 = 下单时指数价（同合约：Binance，OKX 备用）；到期按到期时刻指数结算。
        赢：返还本金 + stake×payoutRatio；输：没收本金；平（到期价 = 开仓价）：退还本金；宽限期内无结算价：退还本金（result=refunded）。
        错误码：FEATURE_DISABLED(403) SYMBOL_NOT_SUPPORTED SYMBOL_PAUSED PERIOD_NOT_SUPPORTED STAKE_OUT_OF_RANGE
        DAILY_LIMIT_EXCEEDED EXPOSURE_LIMIT INSUFFICIENT_BALANCE INDEX_UNAVAILABLE(503)。
        结算实时推送：/ws?token=<accessToken>（或 Authorization: Bearer）后订阅 `event:orders`，帧 data 为 EventOrder。
      operationId: placeEventOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, period, direction, stake, clientId]
              properties:
                symbol: { type: string, example: BTCUSDT }
                period: { type: string, example: 5m }
                direction: { type: string, enum: [up, down] }
                stake: { type: string, example: "10" }
                clientId: { type: string, example: ev-1730600000-1 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EventOrder" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: FEATURE_DISABLED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: INDEX_UNAVAILABLE, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    get:
      tags: [Event]
      summary: 我的事件合约订单（新→旧；status=open|settled|rejected|all，before=id 游标）
      operationId: listEventOrders
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, settled, rejected, all] } }
        - { name: symbol, in: query, required: false, schema: { type: string } }
        - { name: before, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders: { type: array, items: { $ref: "#/components/schemas/EventOrder" } }
                  nextBefore: { type: string, nullable: true }
                  dailyUsed: { type: string, description: 今日（UTC）已用下单额 }
  /event/orders/{id}:
    get:
      tags: [Event]
      summary: 订单详情（仅本人）
      operationId: getEventOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EventOrder" } } } }
        "404": { description: NOT_FOUND, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/v1/event/config:
    get:
      tags: [Admin]
      summary: 事件合约配置与标的（symbol:view）
      operationId: adminGetEventConfig
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  config: { $ref: "#/components/schemas/EventConfig" }
                  symbols: { type: array, items: { $ref: "#/components/schemas/EventSymbol" } }
    put:
      tags: [Admin]
      summary: 部分更新配置（symbol:edit；totpCode + reason，审计 event_config）
      operationId: adminUpdateEventConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/AdminWriteMeta" }
                - { $ref: "#/components/schemas/EventConfig" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { config: { $ref: "#/components/schemas/EventConfig" }, before: { $ref: "#/components/schemas/EventConfig" }, after: { $ref: "#/components/schemas/EventConfig" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /admin/v1/event/symbols/{symbol}:
    put:
      tags: [Admin]
      summary: 暂停/恢复标的、设置单标的敞口上限（symbol:edit；totpCode + reason，审计 event_symbol_pause/resume/event_symbol）
      operationId: adminUpdateEventSymbol
      parameters:
        - { name: symbol, in: path, required: true, schema: { type: string, example: BTCUSDT } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/AdminWriteMeta" }
                - type: object
                  properties:
                    paused: { type: boolean }
                    exposureLimit: { type: string, description: 覆盖全局 exposureLimit }
                    clearExposureLimit: { type: boolean, description: true=恢复使用全局上限 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { symbol: { $ref: "#/components/schemas/EventSymbol" }, before: { $ref: "#/components/schemas/EventSymbol" }, after: { $ref: "#/components/schemas/EventSymbol" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /admin/v1/event/orders:
    get:
      tags: [Admin]
      summary: 订单检索（symbol:view；uid/symbol/status/before/limit）
      operationId: adminListEventOrders
      parameters:
        - { name: uid, in: query, required: false, schema: { type: string } }
        - { name: symbol, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, open, settling, settled, rejected] } }
        - { name: before, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { orders: { type: array, items: { $ref: "#/components/schemas/EventOrder" } }, nextBefore: { type: string, nullable: true } } } } } }
  /admin/v1/event/exposure:
    get:
      tags: [Admin]
      summary: 平台敞口（按 symbol×period 的未结算净额）与今日盈亏（symbol:view）
      operationId: adminEventExposure
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EventExposure" } } } }
  /tradfi/assets:
    get:
      tags: [TradFi]
      summary: TradFi 资产目录（公开；按开关 + active 过滤；只返回已配置合约地址的发行方代币；含参考价与偏离）
      description: |
        参考价 = Binance USDⓈ-M 永续（OKX SWAP 备用），不回退现货。现货偏离参考价超过阈值（默认 200 bps，可在后台按资产配置）时
        做市自动放宽价差（widened=true）并发送 Telegram 告警。
        网关拦截：两个开关都关 → 403 FEATURE_DISABLED；CF-IPCountry 或 KYC 国家在受限列表（默认 US + 美属地区 + OFAC：CU IR KP SY）→ 403 REGION_RESTRICTED。
        同样的拦截作用于 POST /spot/orders、POST /futures/orders（TradFi 标的）、GET /wallet/deposit/address 与 POST /wallet/withdraw（TradFi 资产）；
        撤单与平仓不受影响。
      operationId: listTradFiAssets
      security: []
      parameters:
        - { name: kind, in: query, required: false, schema: { type: string, enum: [stock, metal, commodity] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TradFiAsset" } }
        "403": { description: FEATURE_DISABLED | REGION_RESTRICTED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: SERVICE_UNAVAILABLE（风控门禁不可用，fail closed）, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/v1/tradfi/assets:
    get:
      tags: [Admin]
      summary: TradFi 资产、发行方代币与全局设置（symbol:view）
      operationId: adminListTradFiAssets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TradFiAsset" } }
                  settings: { $ref: "#/components/schemas/TradFiSettings" }
  /admin/v1/tradfi/assets/{asset}:
    put:
      tags: [Admin]
      summary: 更新资产（symbol:edit；totpCode + reason，审计 tradfi_asset）
      operationId: adminUpdateTradFiAsset
      parameters:
        - { name: asset, in: path, required: true, schema: { type: string, example: AAPL } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/AdminWriteMeta" }
                - type: object
                  properties:
                    status: { type: string, enum: [active, suspended] }
                    name: { type: string }
                    deviationBps: { type: integer, minimum: 10, maximum: 5000, description: 单资产偏离阈值（覆盖全局） }
                    clearDeviationBps: { type: boolean, description: true = 恢复使用全局阈值 }
                    refBinance: { type: string, example: AAPLUSDT }
                    refOkx: { type: string, example: AAPL-USDT-SWAP }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TradFiBeforeAfter" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /admin/v1/tradfi/tokens:
    put:
      tags: [Admin]
      summary: 新增/更新发行方代币（symbol:edit；totpCode + reason，审计 tradfi_token）
      description: 开启充值或提现必须先填合约地址，否则 400 ADDRESS_REQUIRED。新开启的代币需重启 wallet 生效；关闭即时生效。
      operationId: adminUpsertTradFiToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/AdminWriteMeta" }
                - type: object
                  required: [asset, issuer, network]
                  properties:
                    asset: { type: string, example: AAPL }
                    issuer: { type: string, enum: [xstocks, ondo, paxos, tether] }
                    network: { type: string, example: SOL, description: 钱包网络名（SOL / ERC20 / TRC20 …） }
                    contractAddress: { type: string }
                    decimals: { type: integer }
                    depositEnabled: { type: boolean }
                    withdrawEnabled: { type: boolean }
                    minWithdraw: { type: string, example: "0.05" }
                    withdrawFee: { type: string, example: "0.02" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TradFiBeforeAfter" } } } }
        "400": { description: VALIDATION_ERROR | ADDRESS_REQUIRED | REASON_REQUIRED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/v1/tradfi/settings:
    get:
      tags: [Admin]
      summary: TradFi 全局设置（symbol:view）
      operationId: adminGetTradFiSettings
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TradFiSettings" } } } }
    put:
      tags: [Admin]
      summary: 更新受限地区 / 偏离阈值 / 放宽倍数 / 告警冷却（symbol:edit；totpCode + reason，审计 tradfi_settings）
      operationId: adminUpdateTradFiSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/AdminWriteMeta" }
                - $ref: "#/components/schemas/TradFiSettings"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TradFiBeforeAfter" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /admin/v1/tradfi/deviation:
    get:
      tags: [Admin]
      summary: 偏离监控状态（每个 TradFi 现货标的：lastPrice、referencePrice、deviationBps、widened）（symbol:view）
      operationId: adminGetTradFiDeviation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TradFiDeviation" } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: VALIDATION_ERROR
            message: 请求参数不合法
            requestId: req_400demo
    Unauthorized:
      description: 未认证或令牌失效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: AUTH_UNAUTHORIZED
            message: 请先登录
            requestId: req_401demo
    Forbidden2FA:
      description: |
        TWOFA_REQUIRED：未提供二次验证或账户未绑定任何二次验证方式（403）。
        注意：提供了但错误的 TOTP/验证码返回 401 INVALID_TOTP（见各接口）。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: TWOFA_REQUIRED
            message: 请提供两步验证码
            requestId: req_403demo
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: NOT_FOUND
            message: 资源不存在
            requestId: req_404demo

  schemas:
    MMBaseline:
      type: object
      properties:
        asset: { type: string }
        baseline: { type: string, description: 生效基线数量 }
        source: { type: string, enum: [admin, seed, start, none] }
        targetBase: { type: string, nullable: true }
        startBase: { type: string, nullable: true }
        seedQty: { type: string }
        updatedBy: { type: string }
    ConvertPairs:
      type: object
      properties:
        assets:
          type: array
          items:
            type: object
            properties: { asset: { type: string }, precision: { type: integer }, enabled: { type: boolean } }
        pairs:
          type: array
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
              fromPrecision: { type: integer }
              toPrecision: { type: integer }
              spreadBps: { type: integer }
              route: { type: string, enum: [direct, via_usdt, stable] }
              paused: { type: boolean, description: 仅 USDC↔USDT 出现；true 表示脱锚保护暂停中 }
              pauseReason: { type: string, enum: [depeg, price_unavailable], description: paused=true 时的原因 }
        minUsdt: { type: string, example: "10" }
        maxUsdt: { type: string, example: "50000" }
        spreadBps: { type: integer, example: 20 }
        fee: { type: string, example: "0" }
        quoteTtlSeconds: { type: integer, example: 10 }
    ConvertQuoteRequest:
      type: object
      required: [from, to]
      description: fromAmount 与 toAmount 二选一
      properties:
        from: { type: string, example: USDT }
        to: { type: string, example: BTC }
        fromAmount: { type: string, example: "1000" }
        toAmount: { type: string }
    ConvertQuote:
      type: object
      properties:
        quoteId: { type: string }
        from: { type: string }
        to: { type: string }
        fromAmount: { type: string }
        toAmount: { type: string }
        rate: { type: string, description: 1 from = rate to（已含点差） }
        inverseRate: { type: string }
        indexRate: { type: string, description: 不含点差的指数汇率 }
        spreadBps: { type: integer }
        fee: { type: string, example: "0" }
        feeAsset: { type: string }
        expiresAt: { type: integer, format: int64, description: 毫秒时间戳 }
        ttlSeconds: { type: integer }
    ConvertOrder:
      type: object
      properties:
        id: { type: integer, format: int64 }
        quoteId: { type: string }
        from: { type: string }
        to: { type: string }
        fromAmount: { type: string }
        toAmount: { type: string }
        rate: { type: string }
        indexRate: { type: string }
        spreadBps: { type: integer }
        fee: { type: string }
        usdtValue: { type: string, description: 按成交时 USDT 估值 }
        status: { type: string, example: filled }
        createdAt: { type: integer, format: int64, description: 毫秒时间戳 }
    LoanMarket:
      type: object
      properties:
        asset: { type: string, example: USDT }
        terms:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              term: { type: string }
              hourlyRate: { type: string, description: 十进制字符串 }
              status: { type: string }
        collaterals:
          type: array
          items:
            type: object
            properties:
              asset: { type: string }
              cap: { type: string, description: 十进制字符串 }
              price: { type: string, description: 十进制字符串 }
        initialLtv: { type: string, description: 十进制字符串 }
        warnLtv: { type: string, description: 十进制字符串 }
        liquidationLtv: { type: string, description: 十进制字符串 }
        userLimit: { type: string, description: 十进制字符串 }
        minAmount: { type: string, description: 十进制字符串 }
        overdueMultiplier: { type: string, description: 十进制字符串 }
        overdueLiquidationDays: { type: integer }
        liquidationFeeRate: { type: string, description: 十进制字符串 }
        earlyRepayPenaltyRate: { type: string, description: 十进制字符串 }
    LoanQuote:
      type: object
      properties:
        amount: { type: string, description: 十进制字符串 }
        collateral: { type: string, description: 十进制字符串 }
        price: { type: string, description: 十进制字符串 }
        ltv: { type: string, description: 十进制字符串 }
        hourlyRate: { type: string, description: 十进制字符串 }
        hourlyInterest: { type: string, description: 十进制字符串 }
        termInterest: { type: string, description: 十进制字符串 }
        liquidationPrice: { type: string, description: 十进制字符串 }
    BorrowRequest:
      type: object
      required: [collateralAsset, amount, term]
      properties:
        collateralAsset: { type: string, example: BTC }
        amount: { type: string, example: "1000" }
        collateralAmount: { type: string, description: 不填则按初始质押率 }
        term: { type: string, example: flexible }
    Loan:
      type: object
      properties:
        id: { type: integer }
        asset: { type: string }
        collateralAsset: { type: string }
        term: { type: string }
        hourlyRate: { type: string, description: 十进制字符串 }
        initialPrincipal: { type: string, description: 十进制字符串 }
        initialCollateral: { type: string, description: 十进制字符串 }
        principal: { type: string, description: 十进制字符串 }
        collateral: { type: string, description: 十进制字符串 }
        interest: { type: string, description: 十进制字符串 }
        interestPaid: { type: string, description: 十进制字符串 }
        debt: { type: string, description: 十进制字符串 }
        status: { type: string, example: active }
        hoursCharged: { type: integer }
        startedAt: { type: integer, format: int64 }
        dueAt: { type: integer, format: int64 }
        closedAt: { type: integer, format: int64 }
        overdue: { type: boolean }
        price: { type: string, description: 十进制字符串 }
        ltv: { type: string, description: 十进制字符串 }
        liquidationPrice: { type: string, description: 十进制字符串 }
        warning: { type: boolean }
    LoanList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Loan" } }
    LoanRepayResult:
      allOf:
        - $ref: "#/components/schemas/Loan"
        - type: object
          properties:
            repaid:
              type: object
              properties:
                principal: { type: string, description: 十进制字符串 }
                interest: { type: string, description: 十进制字符串 }
                penalty: { type: string, description: 十进制字符串 }
                total: { type: string, description: 十进制字符串 }
                collateralReleased: { type: string, description: 十进制字符串 }
    LoanSummary:
      type: object
      properties:
        active: { type: integer }
        totalDebt: { type: string, description: 十进制字符串 }
        totalCollateralValue: { type: string, description: 十进制字符串 }
        asset: { type: string }
    LoanRecord:
      type: object
      properties:
        id: { type: integer }
        loanId: { type: integer }
        type: { type: string }
        amount: { type: string, description: 十进制字符串 }
        interest: { type: string, description: 十进制字符串 }
        penalty: { type: string, description: 十进制字符串 }
        collateral: { type: string, description: 十进制字符串 }
        price: { type: string, description: 十进制字符串 }
        ltv: { type: string, description: 十进制字符串 }
        term: { type: string }
        asset: { type: string }
        collateralAsset: { type: string }
        time: { type: integer, format: int64 }
        detail: { type: object, additionalProperties: true }
    LoanRecordList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LoanRecord" } }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 业务错误码
          example: VALIDATION_ERROR
        message:
          type: string
          description: 可读错误信息
          example: 请求参数不合法
        requestId:
          type: string
          nullable: true
          description: 便于排查的请求 ID
          example: req_8c1f2a
        details:
          type: array
          nullable: true
          description: 字段级错误明细
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }

    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        total: { type: integer, example: 42 }

    SendCodeRequest:
      type: object
      required: [purpose]
      description: >
        请求邮箱/短信验证码。register / reset_password 为公开接口；二选一提供
        email 或 phone（手机号可用 E.164 的 "+8613800138000"，或 phone + countryCode
        拨号区号组合）。为避免账号枚举，reset_password 对不存在的账号也返回 200。
      properties:
        purpose:
          type: string
          enum: [register, reset_password]
          example: register
        email: { type: string, format: email, nullable: true, example: trader@example.com }
        phone: { type: string, nullable: true, description: E.164 或本地号, example: "13800138000" }
        countryCode: { type: string, nullable: true, description: 国家拨号码（如 86）, example: "86" }

    SendCodeResponse:
      type: object
      required: [sent, channel]
      description: 发送验证码的统一响应（/auth/code/send 与 /account/code/send 共用）。
      properties:
        sent: { type: boolean, example: true }
        channel: { type: string, enum: [email, sms], example: sms }
        ttlSeconds: { type: integer, description: 验证码有效期（秒）, example: 600 }

    RegisterRequest:
      type: object
      required: [password, code]
      description: 邮箱或手机号二选一；注册需验证码（先调用 /auth/code/send）。
      properties:
        email: { type: string, format: email, nullable: true, example: trader@example.com }
        phone: { type: string, nullable: true, example: "13800138000" }
        countryCode: { type: string, nullable: true, example: "86" }
        password: { type: string, format: password, minLength: 8, example: "Str0ng-Passw0rd!" }
        code: { type: string, description: 6 位验证码, example: "123456" }
        inviteCode: { type: string, nullable: true, example: LB8DEMO }

    LoginRequest:
      type: object
      required: [password]
      description: >
        邮箱或手机号二选一 + 密码。密码正确后若需二次验证（已开启 TOTP、或新设备
        登录触发邮箱/短信验证），返回 LoginChallenge 而非 AuthTokens。
      properties:
        email: { type: string, format: email, nullable: true, example: trader@example.com }
        phone: { type: string, nullable: true, description: E.164 或本地号, example: "+8613800138000" }
        countryCode: { type: string, nullable: true, description: 手机号为本地号时提供国家拨号码（如 86）, example: "86" }
        password: { type: string, format: password, example: "Str0ng-Passw0rd!" }
        deviceId: { type: string, nullable: true, description: 客户端稳定设备标识；缺省时按 User-Agent 推断, example: web-7f3a }
        deviceName: { type: string, nullable: true, example: Chrome on macOS }

    LoginChallenge:
      type: object
      required: [challengeToken, methods, expiresIn]
      description: 二次验证票据。用 challengeToken 调 /auth/login/verify 换取令牌。
      properties:
        challengeToken: { type: string, example: 3kZ9...challenge }
        methods:
          type: array
          description: 需要完成的二次验证方式（当前恒为单个）。
          items: { type: string, enum: [totp, email, sms] }
          example: [sms]
        expiresIn: { type: integer, description: 票据有效期（秒）, example: 300 }

    LoginVerifyRequest:
      type: object
      required: [challengeToken]
      properties:
        challengeToken: { type: string, example: 3kZ9...challenge }
        totpCode: { type: string, nullable: true, description: method=totp 时必填, example: "123456" }
        code: { type: string, nullable: true, description: method=email/sms 时必填, example: "123456" }

    VerifyResetCodeRequest:
      type: object
      required: [code]
      description: 找回密码第一步请求：邮箱或手机号二选一 + 验证码。
      properties:
        email: { type: string, format: email, nullable: true, example: trader@example.com }
        phone: { type: string, nullable: true, example: "13800138000" }
        countryCode: { type: string, nullable: true, example: "86" }
        code: { type: string, example: "123456" }

    VerifyResetCodeResponse:
      type: object
      required: [resetToken, expiresIn]
      description: 一次性重置令牌（默认 10 分钟有效），用于 /auth/password/reset。
      properties:
        resetToken: { type: string, example: "3kZ9...resetTok" }
        expiresIn: { type: integer, description: resetToken 有效期（秒）, example: 600 }

    PasswordResetRequest:
      type: object
      required: [resetToken, newPassword]
      description: 校验验证码后重置密码，并撤销该用户全部会话（refresh token）。
      properties:
        resetToken: { type: string, description: 由 /auth/password/verify-code 返回, example: "3kZ9...resetTok" }
        newPassword: { type: string, format: password, minLength: 8, example: "N3w-Passw0rd!" }

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, enum: [Bearer], example: Bearer }
        expiresIn: { type: integer, description: accessToken 有效期（秒）, example: 3600 }

    TotpBinding:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, example: JBSWY3DPEHPK3PXP }
        otpauthUri:
          type: string
          example: otpauth://totp/Linbit:trader@example.com?secret=JBSWY3DPEHPK3PXP&issuer=Linbit

    TwoFactorStatus:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean, example: true }
        method:
          type: string
          nullable: true
          enum: [totp, null]
          example: totp

    Account:
      type: object
      required: [uid, kycLevel, twoFactorEnabled, createdAt]
      properties:
        uid: { type: string, example: "80000001" }
        email: { type: string, format: email, nullable: true, example: trader@example.com }
        phone: { type: string, nullable: true, description: E.164, example: "+8613800138000" }
        countryCode: { type: string, example: "86" }
        nickname: { type: string, nullable: true, example: lb_Trader }
        avatarUrl: { type: string, nullable: true, example: https://cdn.example.com/avatar/lb.png }
        kycLevel: { type: integer, example: 1 }
        twoFactorEnabled: { type: boolean, example: true }
        emailVerified: { type: boolean, example: true }
        phoneVerified: { type: boolean, example: true }
        withdrawWhitelistEnabled: { type: boolean, example: false }
        quoteCurrency: { type: string, description: 计价货币（用户偏好，未设置时为系统默认，见 /account/preferences）, example: CNY }
        createdAt: { type: string, format: date-time, example: "2026-01-05T08:30:00Z" }
        inviteCode: { type: string, nullable: true, description: 本人的邀请码（来自 growth 服务，首次读取时自动生成）；growth 不可达时为 null, example: LB8K2Q }

    UpdateProfileRequest:
      type: object
      description: 至少提供一个字段。头像一期只存 URL（http/https，≤512）。
      properties:
        nickname: { type: string, nullable: true, minLength: 1, maxLength: 32, example: lb_Trader }
        avatarUrl: { type: string, nullable: true, example: https://cdn.example.com/avatar/lb.png }

    SendCodeAuthedRequest:
      type: object
      required: [purpose]
      description: 向当前登录用户自己的邮箱/手机发送验证码，用于敏感操作前置校验。
      properties:
        purpose: { type: string, enum: [address, bind, reset_password, withdraw, security], example: address }
        channel: { type: string, nullable: true, enum: [email, sms], description: 缺省按账户已绑定的联系方式, example: sms }

    Device:
      type: object
      required: [deviceId, firstSeen, lastSeen]
      properties:
        deviceId: { type: string, description: 设备指纹（移除设备时回传）, example: "cid:web-7f3a" }
        name: { type: string, example: Chrome on macOS }
        userAgent: { type: string, example: "Mozilla/5.0 ..." }
        ip: { type: string, example: "203.0.113.7" }
        current: { type: boolean, description: 是否为当前请求所在设备, example: true }
        firstSeen: { type: string, format: date-time, example: "2026-11-01T10:00:00Z" }
        lastSeen: { type: string, format: date-time, example: "2026-11-03T08:30:00Z" }

    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Device" }

    WhitelistStatus:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean, example: false }

    SetWhitelistRequest:
      type: object
      required: [enabled]
      description: 开关提现白名单；需验证码或 2FA（二选一）。
      properties:
        enabled: { type: boolean, example: true }
        totpCode: { type: string, nullable: true, description: 已开启 2FA 时提供, example: "123456" }
        code: { type: string, nullable: true, description: 未开启 2FA 时提供（purpose=address）, example: "123456" }

    WithdrawAddress:
      type: object
      required: [id, asset, network, address, whitelisted, createdAt]
      properties:
        id: { type: string, example: "1" }
        asset: { type: string, example: USDT }
        network: { type: string, example: TRC20 }
        address: { type: string, example: TXy1Z9DemoAddr000000000000000000000 }
        memo: { type: string, example: "" }
        label: { type: string, example: cold-wallet }
        whitelisted: { type: boolean, example: true }
        createdAt: { type: string, format: date-time, example: "2026-11-03T08:30:00Z" }

    WithdrawAddressList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WithdrawAddress" }

    CreateWithdrawAddressRequest:
      type: object
      required: [asset, network, address]
      description: 新增地址簿条目；需验证码或 2FA（二选一）。
      properties:
        asset: { type: string, example: USDT }
        network: { type: string, example: TRC20 }
        address: { type: string, example: TXy1Z9DemoAddr000000000000000000000 }
        memo: { type: string, nullable: true, example: "" }
        label: { type: string, nullable: true, example: cold-wallet }
        whitelisted: { type: boolean, nullable: true, example: true }
        totpCode: { type: string, nullable: true, example: "123456" }
        code: { type: string, nullable: true, example: "123456" }

    KycSubmission:
      type: object
      required: [firstName, lastName, country, idType, idNumber, dateOfBirth, documents]
      properties:
        firstName: { type: string, example: San }
        lastName: { type: string, example: Zhang }
        country: { type: string, description: ISO 3166-1 alpha-2, example: SG }
        idType:
          type: string
          enum: [passport, id_card, driver_license]
          example: passport
        idNumber: { type: string, example: E12345678 }
        dateOfBirth: { type: string, format: date, example: "1992-04-18" }
        level:
          type: integer
          enum: [1, 2]
          description: 1 = 基础认证（不填默认 1）；2 = 高级认证（需基础认证已通过）
        documents:
          type: object
          description: |
            由 POST /kyc/documents 返回的 fileId；front 与 selfie 必填，back 可选；
            高级认证（level 2）还必须提供 proofOfAddress（side=proof_of_address 的地址证明），
            缺失时返回 400 DOCUMENT_REQUIRED。
          required: [front, selfie]
          properties:
            front: { type: string, example: doc_1 }
            selfie: { type: string, example: doc_2 }
            back: { type: string, example: doc_3 }
            proofOfAddress: { type: string, example: doc_4, description: 地址证明（level 2 必填） }

    KycDocument:
      type: object
      required: [fileId, side]
      properties:
        fileId: { type: string, example: doc_1 }
        side: { type: string, enum: [front, selfie, back, proof_of_address] }

    KycApplication:
      type: object
      required: [id, userId, level, status, submittedAt]
      properties:
        id: { type: string, example: app_1 }
        userId: { type: string }
        level: { type: integer, enum: [1, 2] }
        status: { type: string, enum: [pending, approved, rejected] }
        firstName: { type: string }
        lastName: { type: string }
        country: { type: string }
        idType: { type: string, enum: [passport, id_card, driver_license] }
        idNumber: { type: string }
        dateOfBirth: { type: string, format: date }
        reason: { type: string, nullable: true }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time, nullable: true }
        documents:
          type: array
          description: 仅详情接口返回；url 为受控读取地址（同样需要内部令牌）
          items:
            type: object
            properties:
              side: { type: string, enum: [front, selfie, back, proof_of_address] }
              fileId: { type: string }
              url: { type: string, example: /admin/kyc/documents/doc_1 }

    KycStatus:
      type: object
      required: [level, status]
      properties:
        level: { type: integer, example: 1 }
        status:
          type: string
          enum: [none, pending, approved, rejected]
          example: approved
        submittedAt: { type: string, format: date-time, nullable: true, example: "2026-11-01T10:00:00Z" }
        reason: { type: string, nullable: true, example: null }

    Balance:
      type: object
      required: [asset, free, locked, total]
      properties:
        asset: { type: string, example: USDT }
        free: { type: string, description: 可用（字符串防精度丢失）, example: "10520.33000000" }
        locked: { type: string, example: "250.00000000" }
        total: { type: string, example: "10770.33000000" }
        valuationUsd: { type: string, nullable: true, example: "10770.33" }

    PaginatedBalances:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Balance" }
            account: { type: string, enum: [spot, funding], description: 本次列出的钱包 }

    DepositAddress:
      type: object
      required: [asset, network, address]
      properties:
        asset: { type: string, example: USDT }
        network: { type: string, example: TRC20 }
        address: { type: string, example: TXy1Z9DemoAddr000000000000000000000 }
        memo: { type: string, nullable: true, example: null, description: memoRequired=true 时为必填的充值 Memo/Tag }
        minDeposit: { type: string, nullable: true, example: "1.00000000" }
        memoRequired: { type: boolean }
        confirmations: { type: integer }

    Deposit:
      type: object
      required: [id, asset, network, amount, status, createdAt]
      properties:
        id: { type: string, example: dep_0001 }
        asset: { type: string, example: USDT }
        network: { type: string, example: TRC20 }
        amount: { type: string, example: "500.00000000" }
        txId: { type: string, nullable: true, example: 9a7b...demo }
        status:
          type: string
          enum: [pending, completed, failed]
          example: completed
        confirmations: { type: integer, nullable: true, example: 20 }
        createdAt: { type: string, format: date-time, example: "2026-10-30T12:00:00Z" }

    PaginatedDeposits:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Deposit" }

    WithdrawRequest:
      type: object
      required: [asset, network, address, amount]
      properties:
        asset: { type: string, example: USDT }
        network: { type: string, example: TRC20 }
        address: { type: string, example: TXy1Z9DemoAddr000000000000000000000 }
        amount: { type: string, example: "100.00000000" }
        memo: { type: string, nullable: true, example: null }
        totpCode:
          type: string
          nullable: true
          description: 已开启 2FA 时必填
          example: "123456"
        code:
          type: string
          nullable: true
          description: >
            未开启 2FA 时必填：发到用户邮箱/手机的验证码（purpose=withdraw）。
            与 totpCode 二选一，由服务端按账户状态校验。
          example: "123456"
        fundPassword:
          type: string
          nullable: true
          description: 资金密码（已设置且后台策略要求时必填；fundPasswordMandatory=true 时未设置将被拒绝 FUND_PASSWORD_NOT_SET）

    OkResponse:
      type: object
      properties:
        ok: { type: boolean }
    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
        totpCode: { type: string, description: 已开启 2FA 时必填 }
        code: { type: string, description: 未开 2FA 时必填（purpose=security） }
        revokeOtherSessions: { type: boolean, default: true }
    ChangeContactRequest:
      type: object
      required: [newCode, oldCode]
      properties:
        email: { type: string }
        phone: { type: string }
        countryCode: { type: string }
        newCode: { type: string, description: 新联系方式收到的验证码（purpose=bind_new） }
        oldCode: { type: string, description: 原联系方式收到的验证码（purpose=security） }
        totpCode: { type: string, description: 已开启 2FA 时必填 }
    FundPasswordRequest:
      type: object
      required: [fundPassword]
      properties:
        fundPassword: { type: string, pattern: "^[0-9]{6}$" }
        oldFundPassword: { type: string, description: PUT（修改）时必填 }
        totpCode: { type: string }
        code: { type: string, description: 未开 2FA 时 purpose=security 验证码 }
    Session:
      type: object
      properties:
        id: { type: string }
        deviceId: { type: string }
        name: { type: string }
        ip: { type: string }
        userAgent: { type: string }
        current: { type: boolean }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    Passkey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
    PasskeyCeremony:
      type: object
      properties:
        sessionId: { type: string }
        publicKey: { type: object, additionalProperties: true }
    AccountPreferences:
      type: object
      required: [quoteCurrency, defaultQuoteCurrency, supportedQuoteCurrencies]
      properties:
        quoteCurrency: { type: string, description: 生效的计价货币, example: CNY }
        defaultQuoteCurrency: { type: string, example: CNY }
        supportedQuoteCurrencies: { type: array, items: { type: string }, example: [CNY, USD, EUR, HKD, JPY, KRW, GBP] }
    SecurityLevel:
      type: object
      required: [score, max, level, missing]
      properties:
        score: { type: integer, minimum: 0, maximum: 5, description: 已完成项数（邮箱验证、手机验证、2FA/通行密钥、资金密码、防钓鱼码） }
        max: { type: integer, example: 5 }
        level: { type: string, enum: [low, medium, high] }
        missing: { type: array, items: { type: string, enum: [email, phone, twoFactor, fundPassword, antiPhishing] } }
    SecurityOverview:
      type: object
      properties:
        securityLevel: { $ref: "#/components/schemas/SecurityLevel" }
        twoFactor:
          type: object
          properties:
            enabled: { type: boolean }
            method: { type: string, nullable: true, enum: [totp, null] }
        email: { type: string, nullable: true, description: 脱敏，与全站一致：保留前 min(3, len-1) 个字符 + ***@域名，如 ali***@example.com }
        emailVerified: { type: boolean }
        phone: { type: string, nullable: true, description: 脱敏，如 138****5678 }
        phoneVerified: { type: boolean }
        fundPasswordSet: { type: boolean }
        fundPasswordLockedUntil: { type: string, format: date-time, nullable: true }
        antiPhishingSet: { type: boolean }
        antiPhishingHint: { type: string, nullable: true, description: 首字符 + 星号 }
        passkeysCount: { type: integer }
        withdrawLockedUntil: { type: string, format: date-time, nullable: true }
        withdrawLockReason: { type: string, nullable: true }
        recentDevices: { type: array, items: { $ref: "#/components/schemas/Device" } }
        policy:
          type: object
          properties:
            fundPasswordForWithdraw: { type: boolean }
            fundPasswordForInternalTransfer: { type: boolean }
            fundPasswordMandatory: { type: boolean }
            withdrawLockHours: { type: integer }

    Withdrawal:
      type: object
      required: [id, asset, network, address, amount, fee, status, createdAt]
      properties:
        id: { type: string, example: wd_0001 }
        asset: { type: string, example: USDT }
        network: { type: string, example: TRC20 }
        address: { type: string, example: TXy1Z9DemoAddr000000000000000000000 }
        amount: { type: string, example: "100.00000000" }
        fee:
          type: string
          description: >
            链上 Gas 费（不含平台手续费——提现不收平台手续费）。等同于 gasFee，保留
            以兼容既有字段。
          example: "1.00000000"
        gasFee:
          type: string
          nullable: true
          description: 实际结算的链上 Gas 费；下单时按 gasFeeEstimate 估算。
          example: "1.00000000"
        gasFeeAsset:
          type: string
          nullable: true
          description: Gas 费计价资产（通常为该网络的原生币或被提资产）。
          example: USDT
        status:
          type: string
          enum: [pending, processing, completed, failed, canceled]
          example: pending
        createdAt: { type: string, format: date-time, example: "2026-11-02T10:05:00Z" }

    WithdrawNetwork:
      type: object
      required: [network]
      properties:
        network: { type: string, example: TRC20 }
        minWithdraw: { type: string, nullable: true, example: "12.00000000" }
        maxWithdraw:
          type: string
          nullable: true
          description: 单笔最大提现数量；USDT 各网络为 20000。为空表示无上限。
          example: "20000.00000000"
        gasFeeEstimate:
          type: string
          nullable: true
          description: 预估链上 Gas 费（提现唯一费用，无平台手续费）。实现前可为 null。
          example: "1.00000000"
        gasFeeAsset:
          type: string
          nullable: true
          description: Gas 费计价资产。
          example: USDT
        confirmations:
          type: integer
          nullable: true
          description: 该网络的到账确认数（充值需达到该确认数才入账；提现完成后等待该确认数结算）。
          example: 19
        estimatedArrivalMinutes:
          type: integer
          nullable: true
          description: 预计到账时间（分钟）。
          example: 5

    WithdrawNetworkOptions:
      type: object
      required: [asset, networks]
      properties:
        asset: { type: string, example: USDT }
        networks:
          type: array
          items: { $ref: "#/components/schemas/WithdrawNetwork" }

    PaginatedWithdrawals:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Withdrawal" }

    OrderSide:
      type: string
      enum: [buy, sell]

    OrderType:
      type: string
      enum: [limit, market]

    OrderStatus:
      type: string
      enum: [new, partially_filled, filled, canceled, rejected]

    TimeInForce:
      type: string
      description: PostOnly（别名 GTX）= 只做 Maker，会立即成交则拒绝（POST_ONLY_REJECTED）
      enum: [GTC, IOC, FOK, PostOnly, GTX]

    PlaceOrderRequest:
      type: object
      required: [symbol, side, type, quantity]
      properties:
        symbol: { type: string, example: BTCUSDT }
        side: { $ref: "#/components/schemas/OrderSide" }
        type: { $ref: "#/components/schemas/OrderType" }
        price:
          type: string
          nullable: true
          description: limit 单必填
          example: "76768.40"
        quantity: { type: string, example: "0.01000000" }
        timeInForce: { $ref: "#/components/schemas/TimeInForce" }
        postOnly: { type: boolean, description: 等价于 timeInForce=PostOnly；会立即成交时返回 POST_ONLY_REJECTED }
        clientOrderId: { type: string, nullable: true, example: cli-20261102-001 }

    Order:
      type: object
      description: >
        现货订单。所有价格/数量字段均为十进制字符串（非浮点），并按交易对精度格式化输出：
        price 按 pricePrecision、quantity/filledQuantity 按 quantityPrecision 补齐定长小数位。
        示例按 BTCUSDT（pricePrecision=2, quantityPrecision=6）。
      required: [orderId, symbol, side, type, quantity, filledQuantity, status, createdAt]
      properties:
        orderId: { type: string, example: "1000000001" }
        clientOrderId: { type: string, nullable: true, example: cli-20261102-001 }
        symbol: { type: string, example: BTCUSDT }
        side: { $ref: "#/components/schemas/OrderSide" }
        type: { $ref: "#/components/schemas/OrderType" }
        price:
          type: string
          nullable: true
          description: 限价，按 pricePrecision 格式化的十进制字符串；市价单为 null。
          example: "76768.40"
        quantity:
          type: string
          description: 下单数量，按 quantityPrecision 格式化的十进制字符串。
          example: "0.010000"
        filledQuantity:
          type: string
          description: 已成交数量，按 quantityPrecision 格式化的十进制字符串。
          example: "0.000000"
        status: { $ref: "#/components/schemas/OrderStatus" }
        timeInForce: { $ref: "#/components/schemas/TimeInForce" }
        createdAt: { type: string, format: date-time, example: "2026-11-02T10:10:00Z" }

    PaginatedOrders:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Order" }

    Trade:
      type: object
      description: >
        成交记录。price/quantity/fee 均为十进制字符串（非浮点）并按交易对精度格式化：
        price 按 pricePrecision、quantity 按 quantityPrecision；fee 按其计价资产精度
        （base 计价按 quantityPrecision、quote 计价按 pricePrecision）。示例按 BTCUSDT。
      required: [tradeId, orderId, symbol, side, price, quantity, createdAt]
      properties:
        tradeId: { type: string, example: "5000000001" }
        orderId: { type: string, example: "0999999900" }
        symbol: { type: string, example: BTCUSDT }
        side: { $ref: "#/components/schemas/OrderSide" }
        price:
          type: string
          description: 成交价，按 pricePrecision 格式化的十进制字符串。
          example: "78000.00"
        quantity:
          type: string
          description: 成交数量，按 quantityPrecision 格式化的十进制字符串。
          example: "0.020000"
        fee:
          type: string
          nullable: true
          description: 手续费，按其计价资产（feeAsset）精度格式化的十进制字符串。
          example: "1.56"
        feeAsset: { type: string, nullable: true, example: USDT }
        role:
          type: string
          enum: [maker, taker]
          example: maker
        createdAt: { type: string, format: date-time, example: "2026-10-30T11:05:00Z" }

    PaginatedTrades:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Trade" }

    Symbol:
      type: object
      required: [symbol, base, quote, pricePrecision, quantityPrecision, status]
      properties:
        symbol: { type: string, example: BTCUSDT }
        base: { type: string, example: BTC }
        quote: { type: string, example: USDT }
        pricePrecision: { type: integer, example: 1 }
        quantityPrecision: { type: integer, example: 6 }

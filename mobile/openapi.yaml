      operationId: futuresFundingHistory
      security: []
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          example: BTCUSDT
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          description: 默认 100，最大 1000
      - name: startTime
        in: query
        required: false
        description: 起始时间（毫秒，含）
        schema:
          type: integer
          format: int64
      - name: endTime
        in: query
        required: false
        description: 结束时间（毫秒，含）；翻页时传上一页的 nextEndTime
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  fundingIntervalHours:
                    type: integer
                  nextEndTime:
                    type: integer
                    format: int64
                    description: 本页满额时返回，作为下一页的 endTime
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        fundingTime:
                          type: integer
                          format: int64
                        fundingRate:
                          type: string
                          description: 十进制字符串
                        markPrice:
                          type: string
                          description: 十进制字符串（外部回填且来源无标记价时为 "0"）
                        source:
                          type: string
                          enum: [settle, binance, okx]

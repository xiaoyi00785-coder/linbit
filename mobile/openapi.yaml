      operationId: createConvertQuote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConvertQuoteRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConvertQuote" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: PRICE_UNAVAILABLE（无指数价格或价格过期）；PAIR_PAUSED_DEPEG（USDC 偏离 1 超过 depegBps，USDC↔USDT 自动暂停；价格缺失/过期同样视为暂停）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /convert/accept:
    post:
      tags: [Convert]
      summary: 确认闪兑（原子、幂等；同一 quoteId 重复提交返回同一订单 replay=true）
      operationId: acceptConvertQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId]
              properties: { quoteId: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: "#/components/schemas/ConvertOrder" }
                  replay: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: QUOTE_EXPIRED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

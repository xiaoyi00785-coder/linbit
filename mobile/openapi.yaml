                      type: object
                      properties:
                        openTime:
                          type: integer
                          format: int64
                        open:
                          type: string
                          description: 十进制字符串
                        high:
                          type: string
                          description: 十进制字符串
                        low:
                          type: string
                          description: 十进制字符串
                        close:
                          type: string
                          description: 十进制字符串
                        indexClose:
                          type: string
                          description: 十进制字符串

                        time:
                          type: integer
                          format: int64
                        indexPrice:
                          type: string
                          description: 十进制字符串
                        markPrice:
                          type: string
                          description: 十进制字符串

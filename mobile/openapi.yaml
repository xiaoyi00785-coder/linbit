  /market/categories:
    get:
      tags: [Market]
      summary: 行情分类标签（公链、贵金属…）
      description: |
        按 sort 排序。symbols 只包含当前已上线的现货交易对；暂无交易对的分类
        （如贵金属 metals）返回空数组。id 固定：layer1 公链, metals 贵金属,
        commodities 大宗商品, stocks 股票, meme Meme, ai AI, defi DeFi,
        layer2 Layer 2, ecosystem 生态, solana Solana 生态, gamefi GameFi,
        depin DePIN, nft NFT, ton TON, lsd LSD, web3 Web3, platform 平台币,
        payment 支付。「全部」由前端自行处理。
      operationId: listMarketCategories
      security: []
      parameters:
        - name: market
          in: query
          required: false
          description: spot（默认）只含现货交易对；futures 只含交易中的永续合约
          schema: { type: string, enum: [spot, futures] }
        - name: nonEmpty
          in: query
          required: false
          description: true 时剔除没有交易对的分类（前端据此隐藏空标签，如 stocks）
          schema: { type: boolean }
      responses:
        "200":
          description: 分类列表

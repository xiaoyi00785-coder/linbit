          $ref: '#/components/responses/Unauthorized'
  /futures/orders/{id}:
    put:
      tags:
      - Futures
      summary: 改单（限价单改价/改量；改价或加量失去时间优先级，减量保留）
      operationId: futuresAmendOrder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuturesAmendOrderRequest'
      responses:
        '200':
          description: OK（PATCH 同义）
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/FuturesOrder'
                  trades:
                    type: array
                    items:
                      $ref: '#/components/schemas/FuturesPublicTrade'
        '400':
          description: VALIDATION_ERROR / INVALID_PRICE / INVALID_QTY / NO_CHANGE / AMEND_LIMIT / POST_ONLY_REJECTED / INSUFFICIENT_MARGIN / POSITION_LIMIT / INVALID_TPSL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: ORDER_NOT_OPEN / NOT_AMENDABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Futures
      summary: 改单（同 PUT）
      operationId: futuresAmendOrderPatch
      parameters:
      - name: id
        in: path

        "401": { $ref: "#/components/responses/Unauthorized" }

  /wallet/withdraw:
    post:
      tags: [Wallet]
      summary: 发起提现申请
      operationId: createWithdrawal
      description: |
        Gas 从提现数量中扣除：冻结且扣减的是 amount，用户实际到账 amount − gas；
        amount 必须大于 gas 且不低于网络最小提现数量（否则 MIN_WITHDRAW）。
        未完成 KYC（level 0）不可提现（403 KYC_REQUIRED）。
        二次验证错误码拆分：TWOFA_REQUIRED(403，未提供/未绑定二次验证)、INVALID_TOTP(401，TOTP 或验证码错误)。
        安全设置：WITHDRAW_LOCKED(403，近期修改密码/邮箱/手机/资金密码/关闭 2FA 后锁定，默认 24h)、
        FUND_PASSWORD_REQUIRED/FUND_PASSWORD_INVALID(400)、FUND_PASSWORD_LOCKED(423)、FUND_PASSWORD_NOT_SET(403)。
      x-error-codes: [MIN_WITHDRAW, WITHDRAW_LIMIT_EXCEEDED, PRICE_UNAVAILABLE, KYC_REQUIRED, TWOFA_REQUIRED, INVALID_TOTP, WITHDRAW_LOCKED, FUND_PASSWORD_REQUIRED, FUND_PASSWORD_INVALID, FUND_PASSWORD_LOCKED, FUND_PASSWORD_NOT_SET]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WithdrawRequest" }
            example:
              asset: USDT
              network: TRC20
              address: TXy1Z9DemoAddr000000000000000000000
              amount: "100.00000000"
              memo: null
              totpCode: "123456"
      responses:
        "202":
          description: 提现申请已受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Withdrawal" }
              example:
                id: wd_0001
                asset: USDT
                network: TRC20
                address: TXy1Z9DemoAddr000000000000000000000
                amount: "100.00000000"
                fee: "1.00000000"
                status: pending
                createdAt: "2026-11-02T10:05:00Z"
        "400":
          description: |
            参数错误；MIN_WITHDRAW 表示低于最小提现数量或 amount 不大于 Gas；
            WITHDRAW_LIMIT_EXCEEDED 表示超过当前 KYC 等级的 24 小时提现额度
            （USDT 等值，默认 level1=50000、level2=200000，可配置）；非 USDT 资产按
            market-data 实时价格（{ASSET}USDT 最新成交价）折算，无可用价格时拒绝提现并返回
            PRICE_UNAVAILABLE。
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            KYC_REQUIRED：未完成身份认证（KYC level 0）不可提现；或已开启提现白名单，
            但目标地址不在白名单内；TWOFA_REQUIRED：未提供/未绑定二次验证；WITHDRAW_LOCKED：安全设置变更后的锁定期；
            FUND_PASSWORD_NOT_SET：后台要求资金密码但尚未设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /wallet/withdraw/networks:
    get:
      tags: [Wallet]
      summary: 可提现网络与 Gas 估算
      description: >
        返回某资产可用的提现网络列表及每个网络的链上 Gas 估算。提现不收取平台
        手续费，仅收取链上 Gas，因此前端据此向用户展示预计到账金额。
      operationId: listWithdrawNetworks
      parameters:
        - name: asset
          in: query
          required: true
          schema: { type: string }
          example: USDT
      responses:
        "200":
          description: 网络与 Gas 估算
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithdrawNetworkOptions" }
              example:
                asset: USDT
                networks:
                  - network: TRC20
                    minWithdraw: "12.00000000"
                    gasFeeEstimate: "1.00000000"
                    gasFeeAsset: USDT
                    estimatedArrivalMinutes: 5
                  - network: ERC20
                    minWithdraw: "12.00000000"
                    gasFeeEstimate: "6.50000000"
                    gasFeeAsset: USDT
                    estimatedArrivalMinutes: 10
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wallet/withdraw/records:
    get:
      tags: [Wallet]
      summary: 提现记录
      operationId: listWithdrawals

          $ref: '#/components/responses/Unauthorized'
  /futures/transfer:
    post:
      tags:
      - Futures
      summary: 现货 ↔ 合约划转（USDT）
      operationId: futuresTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                direction:
                  type: string
                  enum:
                  - in
                  - out
                  description: in = 现货→合约，out = 合约→现货
                amount:
                  type: string
                  description: 十进制字符串
              required:
              - direction
              - amount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ref:
                    type: string
                  status:
                    type: string
                    description: completed 或 pending（202）
        '202':
          description: 已受理，异步完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  ref:
                    type: string
                  status:
                    type: string
        '400':
          description: VALIDATION_ERROR / INVALID_AMOUNT / AMOUNT_TOO_SMALL / INSUFFICIENT_BALANCE / INSUFFICIENT_MARGIN / INSUFFICIENT_OWN_FUNDS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

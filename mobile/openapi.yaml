              schema:
                type: array
                items: { $ref: "#/components/schemas/MarketCategory" }
              example:
                - { id: layer1, name: 公链, symbols: [BNBUSDT, BTCUSDT, ETHUSDT, SOLUSDT, TRXUSDT] }
                - { id: metals, name: 贵金属, symbols: [] }

  /market/ticker:
    get:
      tags: [Market]
      summary: 24 小时行情 ticker（单个或全部）
      description: >
        传入 `symbol` 时返回该交易对的单个 Ticker 对象；不传 `symbol` 时返回全部
        交易对的 Ticker 数组。响应为二者之一（见 oneOf）。价格、quoteVolume 按交易对
        计价币精度，base 成交量按数量精度，均为十进制字符串。
      operationId: getTicker
      security: []
      parameters:
        - name: symbol
          in: query
          required: false
          description: 传入则返回单个对象；不传则返回全部交易对的数组
          schema: { type: string }
          example: BTCUSDT
        - name: symbols
          in: query
          required: false
          description: 逗号分隔，仅返回这些交易对（数组）
          schema: { type: string }
          example: BTCUSDT,ETHUSDT
        - name: category
          in: query
          required: false
          description: 仅返回该分类（/market/categories 的 id）下的交易对
          schema: { type: string }
        - name: sort
          in: query
          required: false
          description: 服务端排序（排行榜）。gainers/losers 按 24h priceChangePercent，volume 按 quoteVolume 降序；并列按 symbol；priceSource=none 的排最后
          schema: { type: string, enum: [gainers, losers, volume, symbol] }
        - name: limit
          in: query
          required: false
          description: 排序后截取前 N 条
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: >
            行情数据。带 `symbol` 为单个 Ticker 对象；不带为 Ticker 数组。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Ticker"
                  - type: array
                    items: { $ref: "#/components/schemas/Ticker" }
              examples:
                single:
                  summary: 带 symbol — 单个对象
                  value:
                    symbol: BTCUSDT
                    lastPrice: "76771.90"
                    priceChangePercent: "-1.71"
                    high: "78878.00"
                    low: "76705.00"
                    volume: "371.65"
                    quoteVolume: "28915681.30"
                all:
                  summary: 不带 symbol — 数组
                  value:
                    - symbol: BTCUSDT
                      lastPrice: "76771.90"
                      priceChangePercent: "-1.71"
                      high: "78878.00"
                      low: "76705.00"
                      volume: "371.65"
                      quoteVolume: "28915681.30"
                    - symbol: ETHUSDT
                      lastPrice: "2252.77"
                      priceChangePercent: "-0.82"
                      high: "2301.10"
                      low: "2230.00"
                      volume: "12850.40"
                      quoteVolume: "28996512.10"


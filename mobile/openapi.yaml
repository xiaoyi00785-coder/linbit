        asset: { type: string }
        free: { type: string }
        locked: { type: string }
        total: { type: string }
    SubTransfer:
      type: object
      properties:
        transferId: { type: string }
        clientId: { type: string }
        subAccountId: { type: string }
        direction: { type: string, enum: [to_sub, to_parent] }
        asset: { type: string }
        amount: { type: string }
        status: { type: string, enum: [pending, success, failed] }
        errorCode: { type: string }
        initiator: { type: string, enum: [parent, sub] }
        createdAt: { type: string, format: date-time }
    SubApiKey:
      type: object
      properties:
        apiKey: { type: string, example: lbk_3f2a... }
        secret: { type: string, description: 仅创建时返回 }
        label: { type: string }
        permissions: { type: array, items: { type: string } }
        ipAllowlist: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
    ChatRoom:
      type: object
      properties:
        id: { type: string, example: spot.BTCUSDT }
        type: { type: string, enum: [general, spot, futures] }
        symbol: { type: string, description: general 房间不返回 }
        name: { type: string, example: BTC/USDT 现货 }
        online: { type: integer }
      required: [id, type, name, online]
    ChatRules:
      type: object
      properties:
        maxLength: { type: integer }
        minIntervalMs: { type: integer }
        minKycLevel: { type: integer }
        blockLinks: { type: boolean }
        blockContacts: { type: boolean }
    ChatMessage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        room: { type: string }
        sender: { type: string, description: 脱敏昵称，如 用户***1234 }
        text: { type: string }
        clientId: { type: string, description: 仅发言接口的响应返回（发送者自己的 clientId）；历史与推送不返回 }
        mine: { type: boolean, description: 发送者是否为当前登录用户；仅历史与发言接口返回，匿名请求与 WS 推送不返回 }
        createdAt: { type: string, format: date-time }
      required: [id, room, sender, text, createdAt]
    ChatAdminMessage:
      allOf:
        - { $ref: "#/components/schemas/ChatMessage" }
        - type: object
          properties:
            uid: { type: string }
            clientId: { type: string }
            status: { type: string, enum: [visible, deleted] }
            deletedBy: { type: string, nullable: true }
            deletedReason: { type: string, nullable: true }
            reports: { type: integer }
    ChatConfig:
      type: object
      properties:
        minIntervalMs: { type: integer, default: 3000 }
        maxLength: { type: integer, default: 200 }
        minKycLevel: { type: integer, default: 1, minimum: 0, maximum: 3 }
        blockLinks: { type: boolean, default: true }
        blockContacts: { type: boolean, default: true }
        bannedWords: { type: array, items: { type: string } }
        historyLimitMax: { type: integer, default: 100 }
        generalRoom: { type: boolean, default: true }
        futuresRooms: { type: boolean, default: true }
        reportsToHide: { type: integer, default: 0, description: 达到该举报数自动隐藏（0=关闭） }
    ChatSanction:
      type: object
      properties:
        uid: { type: string }
        mutedUntil: { type: string, format: date-time, nullable: true }
        banned: { type: boolean }
        reason: { type: string }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    ChatReport:
      type: object
      properties:
        id: { type: integer, format: int64 }
        messageId: { type: integer, format: int64 }
        reporter: { type: string }
        reason: { type: string }
        status: { type: string, enum: [open, resolved, dismissed] }
        handledBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        message: { $ref: "#/components/schemas/ChatAdminMessage" }
    ChatChange:
      type: object
      properties:
        before: { type: object, additionalProperties: true, nullable: true }
        after: { type: object, additionalProperties: true, nullable: true }
    EventProducts:
      type: object
      properties:
        enabled: { type: boolean }
        stakeAsset: { type: string, example: USDT }
        payoutRatio: { type: string, example: "0.8" }
        minStake: { type: string, example: "5" }
        maxStake: { type: string, example: "1000" }
        dailyLimit: { type: string, example: "10000" }
        tieRule: { type: string, enum: [refund] }
        periods:
          type: array
          items: { type: object, properties: { period: { type: string, example: 5m }, seconds: { type: integer } } }
        products:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string, example: BTCUSDT }
              baseAsset: { type: string }
              quoteAsset: { type: string }
              paused: { type: boolean }
              indexPrice: { type: string, nullable: true }
              priceAvailable: { type: boolean }
    EventOrder:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        userId: { type: string, description: 仅管理端 }
        symbol: { type: string }
        period: { type: string }
        direction: { type: string, enum: [up, down] }
        stake: { type: string }
        payoutRatio: { type: string }
        openPrice: { type: string }
        openTime: { type: integer, format: int64, description: ms }
        expiryTime: { type: integer, format: int64, description: ms }
        status: { type: string, enum: [pending, open, settling, settled, rejected] }
        result: { type: string, nullable: true, enum: [won, lost, tie, refunded] }
        settlePrice: { type: string, nullable: true }
        payout: { type: string, nullable: true }
        pnl: { type: string, nullable: true }
        settledAt: { type: integer, format: int64, nullable: true }
        expectedPayout: { type: string, description: 若赢可得（本金 + 收益） }
        rejectReason: { type: string, nullable: true }
        createdAt: { type: integer, format: int64, description: 仅管理端 }
    EventConfig:
      type: object
      properties:
        periods: { type: array, items: { type: string }, example: [5m, 15m, 30m, 1h, 4h, 1d] }
        payoutRatio: { type: string }
        minStake: { type: string }
        maxStake: { type: string }
        dailyLimit: { type: string }
        exposureLimit: { type: string, description: 默认每 symbol×period 净敞口上限 }
        settleGraceSeconds: { type: integer }
        updatedBy: { type: string, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    EventSymbol:
      type: object
      properties:
        symbol: { type: string }
        paused: { type: boolean }
        exposureLimit: { type: string, nullable: true }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    EventExposure:
      type: object
      properties:
        books:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string }
              period: { type: string }
              paused: { type: boolean }
              upStake: { type: string }
              downStake: { type: string }
              netExposure: { type: string }
              limit: { type: string }
              openOrders: { type: integer }
              utilization: { type: string }
        todayStakeSettled: { type: string }
        todayPayout: { type: string }
        todayPlatformPnl: { type: string }
        unfinishedOrders: { type: integer }
    TradFiToken:
      type: object
      properties:
        asset: { type: string }
        issuer: { type: string, enum: [xstocks, ondo, paxos, tether] }
        network: { type: string }
        contractAddress: { type: string }
        decimals: { type: integer }
        depositEnabled: { type: boolean }
        withdrawEnabled: { type: boolean }
        minWithdraw: { type: string }
        withdrawFee: { type: string }
    TradFiAsset:
      type: object
      properties:
        asset: { type: string, example: AAPL }
        kind: { type: string, enum: [stock, metal, commodity] }
        name: { type: string }
        underlying: { type: string, example: "Apple Inc. (NASDAQ: AAPL)" }
        market: { type: string, enum: [spot, futures] }
        symbol: { type: string, example: AAPLUSDT }
        refBinance: { type: string, description: 仅后台返回 }
        refOkx: { type: string, description: 仅后台返回 }
        deviationBps: { type: integer, nullable: true, description: 仅后台返回；null = 全局阈值 }
        status: { type: string, enum: [active, suspended] }
        sort: { type: integer }
        tokens: { type: array, items: { $ref: "#/components/schemas/TradFiToken" } }
        referencePrice: { type: string, description: 仅公开接口 }
        referenceSource: { type: string, example: binance-tradfi }
        lastPrice: { type: string }
        currentDeviationBps: { type: string }
        widened: { type: boolean }
    TradFiSettings:
      type: object
      properties:
        restrictedCountries: { type: array, items: { type: string, pattern: "^[A-Z0-9]{2}$" }, example: [US, PR, GU, VI, AS, MP, UM, CU, IR, KP, SY] }
        deviationBps: { type: integer, minimum: 10, maximum: 5000, example: 200 }
        widenFactor: { type: string, example: "3", description: 1–20 }
        alertCooldownSec: { type: integer, minimum: 0, maximum: 86400, example: 900 }
    TradFiDeviation:
      type: object
      properties:
        symbol: { type: string }
        lastPrice: { type: string }
        referencePrice: { type: string }
        deviationBps: { type: string }
        thresholdBps: { type: integer }
        widened: { type: boolean }
        widenFactor: { type: string }
    TradFiBeforeAfter:
      type: object
      properties:
        before: { type: object, nullable: true }
        after: { type: object }
security:
  - bearerAuth: []

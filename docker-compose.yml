# Linbit spot chain — step 1 (gateway + account + asset) with postgres & redis.
#
# Note: build contexts are the repository root so each service Dockerfile can
# COPY the shared services/go/common module.
#
#   docker compose --env-file .env up --build
#
# (No Docker on this machine — use `bash scripts/smoke.sh` for a Docker-free
# end-to-end run via the embedded-postgres devstack.)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linbit}
      POSTGRES_DB: ${POSTGRES_DB:-linbit}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linbit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  asset:
    build:
      context: .
      dockerfile: services/go/asset/Dockerfile
    environment:
      PORT: "8082"
      DATABASE_URL: ${DATABASE_URL:-postgres://linbit:linbit@postgres:5432/linbit?sslmode=disable}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Optional JSON override for GET /wallet/withdraw/networks (empty = defaults).
      WITHDRAW_NETWORKS_JSON: ${WITHDRAW_NETWORKS_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  wallet:
    build:
      context: .
      dockerfile: services/go/wallet/Dockerfile
    environment:
      PORT: "8086"
      DATABASE_URL: ${DATABASE_URL:-postgres://linbit:linbit@postgres:5432/linbit?sslmode=disable}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
      ACCOUNT_INTERNAL_URL: http://account:8081
      ASSET_INTERNAL_URL: http://asset:8082
      # Real-time prices for the KYC limit (non-stablecoins; no price = rejected).
      MARKET_URL: http://market-data:8085
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Chains are simulated by default (no real node/keys). Set DEV_MODE=true only
      # in local/CI environments to enable the mock-chain injection endpoints.
      DEV_MODE: ${WALLET_DEV_MODE:-false}
      # Where the on-chain gas is charged: "amount" (default) deducts it from the
      # withdrawal amount (user receives amount-gas; only amount is frozen);
      # "extra" adds it on top.
      WALLET_GAS_DEDUCT_MODE: ${WALLET_GAS_DEDUCT_MODE:-amount}
      WALLET_FEE_ACCOUNT: ${WALLET_FEE_ACCOUNT:-platform:gas}
      # Optional JSON array override for the network registry (empty = built-in).
      WALLET_NETWORKS_JSON: ${WALLET_NETWORKS_JSON:-}
      # Lowest KYC level allowed to withdraw (below it: KYC_REQUIRED).
      WALLET_KYC_MIN_LEVEL: ${WALLET_KYC_MIN_LEVEL:-1}
      # KYC-tiered rolling-24h withdrawal caps (USDT-equivalent; <=0 = unlimited).
      # Level 0 only applies if WALLET_KYC_MIN_LEVEL=0.
      WALLET_KYC_LEVEL0_DAILY_USDT: ${WALLET_KYC_LEVEL0_DAILY_USDT:-1000}
      WALLET_KYC_LEVEL1_DAILY_USDT: ${WALLET_KYC_LEVEL1_DAILY_USDT:-50000}
      WALLET_KYC_LEVEL2_DAILY_USDT: ${WALLET_KYC_LEVEL2_DAILY_USDT:-200000}
      # Pinned USDT prices (default USDT=1, USDC=1); others use market-data.
      WALLET_KYC_PRICES_JSON: ${WALLET_KYC_PRICES_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
      asset:
        condition: service_started
      account:
        condition: service_started

  account:
    build:
      context: .
      dockerfile: services/go/account/Dockerfile
    environment:
      PORT: "8081"
      DATABASE_URL: ${DATABASE_URL:-postgres://linbit:linbit@postgres:5432/linbit?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
      ASSET_INTERNAL_URL: http://asset:8082
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      asset:
        condition: service_started

  matching-engine:
    build:
      context: services/rust/matching-engine
    environment:
      BIND: "0.0.0.0:8083"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
      DATA_DIR: /data
      SNAPSHOT_EVERY: "1000"
      SYMBOLS: "BTCUSDT:6,ETHUSDT:5"
      # Stream trade/depth events to market-data (local pub/sub stand-in).
      EVENT_SINK_URL: http://market-data:8085/internal/events
    volumes:
      - enginedata:/data

  order:
    build:
      context: .
      dockerfile: services/go/order/Dockerfile
    environment:
      PORT: "8084"
      DATABASE_URL: ${DATABASE_URL:-postgres://linbit:linbit@postgres:5432/linbit?sslmode=disable}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
      ASSET_INTERNAL_URL: http://asset:8082
      ENGINE_URL: http://matching-engine:8083
      SPOT_MAKER_FEE_RATE: ${SPOT_MAKER_FEE_RATE:-0.001}
      SPOT_TAKER_FEE_RATE: ${SPOT_TAKER_FEE_RATE:-0.001}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      asset:
        condition: service_started
      matching-engine:
        condition: service_started

  market-data:
    build:
      context: .
      dockerfile: services/go/market-data/Dockerfile
    environment:
      PORT: "8085"
      DATABASE_URL: ${DATABASE_URL:-postgres://linbit:linbit@postgres:5432/linbit?sslmode=disable}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
      ENGINE_URL: http://matching-engine:8083
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      order:
        condition: service_started
      matching-engine:
        condition: service_started

  kyc:
    build:
      context: .
      dockerfile: services/go/kyc/Dockerfile
    environment:
      PORT: "8087"
      DATABASE_URL: ${DATABASE_URL:-postgres://linbit:linbit@postgres:5432/linbit?sslmode=disable}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
      ACCOUNT_INTERNAL_URL: http://account:8081
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Minimum applicant age.
      KYC_MIN_AGE: ${KYC_MIN_AGE:-18}
      # Document storage: local disk (default) or s3 (skeleton, not implemented yet).
      STORAGE_BACKEND: ${KYC_STORAGE_BACKEND:-local}
      KYC_DOC_STORAGE_DIR: /data/kyc-docs
      KYC_DOC_MAX_BYTES: ${KYC_DOC_MAX_BYTES:-10485760}
    volumes:
      - kycdocs:/data/kyc-docs
    depends_on:
      postgres:
        condition: service_healthy
      account:
        condition: service_started

  admin:
    build:
      context: .
      dockerfile: services/go/admin/Dockerfile
    environment:
      PORT: "8088"
      DATABASE_URL: ${DATABASE_URL:-postgres://linbit:linbit@postgres:5432/linbit?sslmode=disable}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
      ACCOUNT_INTERNAL_URL: http://account:8081
      ASSET_INTERNAL_URL: http://asset:8082
      ORDER_INTERNAL_URL: http://order:8084
      MARKET_URL: http://market-data:8085
      WALLET_INTERNAL_URL: http://wallet:8086
      KYC_INTERNAL_URL: http://kyc:8087
      # First super admin, created only when the admin_users table is empty.
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_TOTP_SECRET: ${ADMIN_BOOTSTRAP_TOTP_SECRET:-}
      # Comma-separated IPs/CIDRs allowed to reach /admin/v1 (empty = allow all).
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
      ADMIN_SESSION_IDLE_MINUTES: ${ADMIN_SESSION_IDLE_MINUTES:-30}
      ADMIN_FEE_NOTICE_HOURS: ${ADMIN_FEE_NOTICE_HOURS:-24}
      ADMIN_COUPON_FINANCE_THRESHOLD: ${ADMIN_COUPON_FINANCE_THRESHOLD:-10000}
      ADMIN_REWARD_FINANCE_THRESHOLD: ${ADMIN_REWARD_FINANCE_THRESHOLD:-1000}
      ADMIN_WITHDRAW_SECOND_REVIEW_USDT: ${ADMIN_WITHDRAW_SECOND_REVIEW_USDT:-5000}
      ADMIN_WITHDRAW_SECOND_REVIEW_RISK: ${ADMIN_WITHDRAW_SECOND_REVIEW_RISK:-40}
    ports:
      # Back office: bound to localhost only; put it behind VPN / allow-list in prod.
      - "127.0.0.1:${ADMIN_PORT:-8088}:8088"
    depends_on:
      postgres:
        condition: service_healthy
      kyc:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: services/go/gateway/Dockerfile
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      ACCOUNT_URL: http://account:8081
      ASSET_URL: http://asset:8082
      ORDER_URL: http://order:8084
      MARKET_URL: http://market-data:8085
      WALLET_URL: http://wallet:8086
      KYC_URL: http://kyc:8087
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Browser CORS allow-list (empty = dev default: localhost/127.0.0.1 any port).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      account:
        condition: service_started
      asset:
        condition: service_started
      order:
        condition: service_started
      market-data:
        condition: service_started
      wallet:
        condition: service_started
      kyc:
        condition: service_started

volumes:
  pgdata:
  enginedata:
  kycdocs:

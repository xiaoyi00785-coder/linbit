# Linbit iOS CI：生成工程 → 模拟器编译（无签名）→ 启动截图 → 上传产物
# 放置位置：仓库根目录 .github/workflows/ios.yml；IOS_DIR 指向 project.yml 所在目录
#
# macos-14 已于 2026-11-02 下线，且其上的 iPhone 15 模拟器不在现行镜像里。
# 使用 macos-15 + Xcode 16.4；运行时自动选择可用的 iPhone 模拟器及其系统版本。
name: iOS

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      adapt_layout:
        description: "额外跑适配截图（screens-adapt.txt；复用本 workflow 的 adapt job，不跑完整 screens 套件）"
        type: boolean
        default: false
      adapt_device_profile:
        description: "adapt 设备档（仅 adapt_layout=true）：se375_xxxl | mid393_xxxl | max430_xxxl | matrix_se_mid_max（单 job 顺序拍摄，一次 Debug generic build）"
        type: choice
        options:
          - se375_xxxl
          - mid393_xxxl
          - max430_xxxl
          - matrix_se_mid_max
        default: se375_xxxl
      screen_list:
        description: "build 截图清单（仅 workflow_dispatch；PR 仍固定 screens-pr）。screens-risk=高风险 DEBUG 页，同一次 Debug build，无额外部署权限"
        type: choice
        options:
          - screens-pr
          - screens-risk
        default: screens-pr

permissions:
  contents: read

concurrency:
  group: ios-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  IOS_DIR: mobile/ios
  DERIVED: ${{ github.workspace }}/build

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check mobile/openapi.yaml matches docs/api/openapi.yaml (current branch)
        env:
          # pull_request 事件默认检出与最新 main 的合并提交；这里以 PR 分支自身（head）为准
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          if ! git cat-file -e "$HEAD_SHA:docs/api/openapi.yaml" 2>/dev/null; then
            echo "当前分支没有 docs/api/openapi.yaml，跳过一致性检查"
            exit 0
          fi
          git show "$HEAD_SHA:docs/api/openapi.yaml" > /tmp/docs-openapi.yaml
          git show "$HEAD_SHA:mobile/openapi.yaml" > /tmp/mobile-openapi.yaml
          if ! diff -u /tmp/docs-openapi.yaml /tmp/mobile-openapi.yaml > /tmp/openapi.diff; then
            echo "::error file=mobile/openapi.yaml::mobile/openapi.yaml 与当前分支的 docs/api/openapi.yaml 不一致；请执行 cp docs/api/openapi.yaml mobile/openapi.yaml 并用 mobile/tools/gen_models.sh 重新生成模型"
            head -80 /tmp/openapi.diff
            exit 1
          fi
          echo "openapi.yaml 一致（${HEAD_SHA}）"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate AppIcon (logo.svg -> 1024 PNG)
        run: |
          python3 mobile/tools/gen_app_icon.py
          sips -g pixelWidth -g pixelHeight mobile/ios/Linbit/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate project
        working-directory: ${{ env.IOS_DIR }}
        run: xcodegen generate

      - name: Select available iPhone simulator
        working-directory: ${{ env.IOS_DIR }}
        run: |
          set -euo pipefail
          echo "Available simulator devices:"
          xcrun simctl list devices available
          echo "Xcode build destinations:"
          xcodebuild -project Linbit.xcodeproj -scheme Linbit -showdestinations

          xcrun simctl list devices available --json > /tmp/linbit-simulators.json
          python3 - <<'PY_SELECT_SIM'
          import json
          import os
          import re

          with open('/tmp/linbit-simulators.json', encoding='utf-8') as f:
              devices_by_runtime = json.load(f)['devices']

          candidates = []
          for runtime, devices in devices_by_runtime.items():
              match = re.search(r'(?:SimRuntime\.)?iOS-(\d+(?:-\d+)*)$', runtime)
              if not match:
                  continue
              sim_os = match.group(1).replace('-', '.')
              os_version = tuple(int(part) for part in sim_os.split('.'))
              for device in devices:
                  name = device.get('name', '')
                  udid = device.get('udid', '')
                  if not name.startswith('iPhone') or not udid:
                      continue
                  # --json 在部分 Xcode 版本中仍会列出不可用设备，需再过滤。
                  if device.get('isAvailable') is False:
                      continue
                  if device.get('availability') not in (None, '(available)'):
                      continue
                  if name == 'iPhone 16':
                      preference = 0
                  elif name == 'iPhone 15 Pro':
                      preference = 1
                  else:
                      preference = 2
                  candidates.append((preference, os_version, name, sim_os, udid))

          if not candidates:
              raise SystemExit('::error::没有找到可用的 iPhone 模拟器；请查看上面的 simctl 设备列表。')

          # 先按机型优先级，再选该机型可用的最新 iOS 运行时。
          _, _, name, sim_os, udid = min(candidates, key=lambda item: (item[0], tuple(-v for v in item[1]), item[2]))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'SIM_NAME={name}\n')
              f.write(f'SIM_OS={sim_os}\n')
              f.write(f'SIM_UDID={udid}\n')
          print(f'Selected simulator: {name}, iOS {sim_os}, UDID {udid}')
          PY_SELECT_SIM

      - name: Build for simulator
        working-directory: ${{ env.IOS_DIR }}
        run: |
          set -euo pipefail
          DEST="platform=iOS Simulator,id=${SIM_UDID},OS=${SIM_OS}"
          echo "Building for selected destination: ${SIM_NAME}, iOS ${SIM_OS}, UDID ${SIM_UDID}"
          echo "xcodebuild destination: ${DEST}"
          if command -v xcbeautify >/dev/null 2>&1; then
            xcodebuild -project Linbit.xcodeproj -scheme Linbit -configuration Debug \
              -destination "$DEST" \
              -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build | xcbeautify
          else
            xcodebuild -project Linbit.xcodeproj -scheme Linbit -configuration Debug \
              -destination "$DEST" \
              -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build
          fi

      - name: Release compile check (simulator, no screenshots)
        working-directory: ${{ env.IOS_DIR }}
        run: |
          set -euo pipefail
          DEST="platform=iOS Simulator,id=${SIM_UDID},OS=${SIM_OS}"
          echo "Release compile (ShotGate / #if DEBUG 剥离校验): ${DEST}"
          # 独立 derivedData，避免覆盖 Debug .app 影响后续截图
          if command -v xcbeautify >/dev/null 2>&1; then
            xcodebuild -project Linbit.xcodeproj -scheme Linbit -configuration Release \
              -destination "$DEST" \
              -derivedDataPath "${DERIVED}-release" CODE_SIGNING_ALLOWED=NO build | xcbeautify
          else
            xcodebuild -project Linbit.xcodeproj -scheme Linbit -configuration Release \
              -destination "$DEST" \
              -derivedDataPath "${DERIVED}-release" CODE_SIGNING_ALLOWED=NO build
          fi

      - name: Launch & screenshot (light / dark)
        env:
          # pull_request / push：冒烟清单 + 短等待；workflow_dispatch：完整清单
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          APP=$(find "$DERIVED/Build/Products" -name "Linbit.app" -maxdepth 3 | head -1)
          echo "APP=$APP"
          UDID="$SIM_UDID"
          echo "Using selected simulator: ${SIM_NAME}, iOS ${SIM_OS}, UDID ${UDID}"
          test -n "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots

          # pull_request / push：冒烟 screens-pr + sleep 4
          # workflow_dispatch 默认完整 screens.txt + sleep 7；screen_list=screens-risk 仅高风险页（同一次 Debug build，无额外部署权限）
          SCREEN_LIST=mobile/ci/screens-pr.txt
          SLEEP_SECS=4
          RUN_SPLASH_VIDEO=0
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "${{ inputs.screen_list }}" in
              screens-risk)
                SCREEN_LIST=mobile/ci/screens-risk.txt
                SLEEP_SECS=4
                RUN_SPLASH_VIDEO=0
                ;;
              *)
                SCREEN_LIST=mobile/ci/screens.txt
                SLEEP_SECS=7
                RUN_SPLASH_VIDEO=1
                ;;
            esac
          fi
          echo "SCREEN_LIST=$SCREEN_LIST SLEEP_SECS=$SLEEP_SECS RUN_SPLASH_VIDEO=$RUN_SPLASH_VIDEO"

          # lb.shot 只在 CI 写入。
          shoot() {
            local screen="$1" mode="$2"
            xcrun simctl ui "$UDID" appearance "$mode"
            xcrun simctl terminate "$UDID" click.cowa.linbit || true
            xcrun simctl spawn "$UDID" defaults write click.cowa.linbit lb.theme system
            xcrun simctl spawn "$UDID" defaults write click.cowa.linbit lb.shot "$screen"
            xcrun simctl launch "$UDID" click.cowa.linbit
            sleep "$SLEEP_SECS"
            xcrun simctl io "$UDID" screenshot "shots/${screen}-${mode}.png" || true
          }
          # 截图清单（用 fd 3 读取，避免 simctl 吞掉 stdin）：每行 "<screen> [light|dark|both]"，省略模式 = both；# 开头为注释
          while read -r screen mode _ <&3; do
            case "$screen" in ""|\#*) continue ;; esac
            case "${mode:-both}" in
              light) shoot "$screen" light ;;
              dark)  shoot "$screen" dark ;;
              both)  shoot "$screen" light; shoot "$screen" dark ;;
              *) echo "::error file=${SCREEN_LIST}::未知模式: $screen $mode"; exit 1 ;;
            esac
          done 3< "$SCREEN_LIST"

          # 启动动画录屏仅跑全量套件（真实播放，日间 + 夜间）
          if [ "$RUN_SPLASH_VIDEO" = "1" ]; then
            for mode in light dark; do
              xcrun simctl ui "$UDID" appearance "$mode"
              xcrun simctl terminate "$UDID" click.cowa.linbit || true
              xcrun simctl spawn "$UDID" defaults write click.cowa.linbit lb.theme system
              xcrun simctl spawn "$UDID" defaults delete click.cowa.linbit lb.shot || true
              xcrun simctl io "$UDID" recordVideo --codec=h264 --force "shots/splash-${mode}.mp4" &
              REC=$!
              sleep 2
              xcrun simctl launch "$UDID" click.cowa.linbit
              sleep 4
              kill -INT "$REC" || true
              wait "$REC" || true
            done
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linbit-ios-${{ github.sha }}
          path: shots/
          retention-days: 14
          if-no-files-found: warn

  # 可选布局适配截图：仅手动 workflow_dispatch 且勾选 adapt_layout。
  # screens-adapt.txt + adapt_device_profile（se375/mid393/max430/matrix）；单次 generic Debug build，按 profile 顺序截图。
  # 320pt 不在 ci_supported 档；见 adapt-device-matrix.json。不扩大 permissions、不部署。
  adapt:
    if: github.event_name == 'workflow_dispatch' && inputs.adapt_layout == true
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate AppIcon
        run: python3 mobile/tools/gen_app_icon.py
      - name: Generate project
        working-directory: ${{ env.IOS_DIR }}
        run: xcodegen generate
      - name: Select adapt simulator profile(s)
        env:
          ADAPT_DEVICE_PROFILE: ${{ inputs.adapt_device_profile || 'se375_xxxl' }}
          LINBIT_SIM_JSON: /tmp/linbit-simulators.json
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > /tmp/linbit-simulators.json
          echo "Available iPhone device types (for audit):"
          xcrun simctl list devicetypes | grep -i iPhone || true
          python3 mobile/ci/select_adapt_simulators.py
      - name: Build Debug once (generic iOS Simulator — reuse across adapt profiles)
        working-directory: ${{ env.IOS_DIR }}
        run: |
          set -euo pipefail
          # 单次 Debug 构建，后续各 profile 只 boot/install/截图，避免 matrix 重复完整 build
          xcodebuild -project Linbit.xcodeproj -scheme Linbit -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build
      - name: Adapt screenshots (per profile device + content_size)
        run: |
          set -euo pipefail
          APP=$(find "$DERIVED/Build/Products" -name "Linbit.app" -maxdepth 3 | head -1)
          echo "APP=$APP"
          test -n "$APP"
          mkdir -p shots-adapt
          python3 - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path
          app = None
          for p in Path(os.environ["DERIVED"], "Build", "Products").rglob("Linbit.app"):
              app = p; break
          assert app, "Linbit.app missing"
          profiles = json.loads(Path(os.environ.get("ADAPT_PROFILES_FILE", "/tmp/adapt-profiles.json")).read_text())
          screens = []
          for raw in Path("mobile/ci/screens-adapt.txt").read_text().splitlines():
              s = raw.strip()
              if not s or s.startswith("#"): continue
              parts = s.split()
              key = parts[0]
              theme = parts[1] if len(parts) > 1 else "both"
              screens.append((key, theme))

          def run(cmd):
              print("+", " ".join(cmd), flush=True)
              subprocess.run(cmd, check=False)

          for prof in profiles:
              udid = prof["udid"]
              tag = prof["tag"]
              cs = prof["content_size"]
              print(f"=== profile {tag} device={prof['name']} os={prof['os']} "
                    f"expect {prof['points_w']}pt@{prof['scale']}x "
                    f"px {prof['pixels_w']}x{prof['pixels_h']} content_size={cs}", flush=True)
              run(["xcrun", "simctl", "boot", udid])
              run(["xcrun", "simctl", "bootstatus", udid, "-b"])
              run(["xcrun", "simctl", "install", udid, str(app)])
              run(["xcrun", "simctl", "ui", udid, "content_size", cs])
              for key, theme in screens:
                  modes = ["light", "dark"] if theme == "both" else [theme]
                  for mode in modes:
                      run(["xcrun", "simctl", "ui", udid, "appearance", mode])
                      run(["xcrun", "simctl", "terminate", udid, "click.cowa.linbit"])
                      run(["xcrun", "simctl", "spawn", udid, "defaults", "write", "click.cowa.linbit", "lb.theme", "system"])
                      run(["xcrun", "simctl", "spawn", udid, "defaults", "write", "click.cowa.linbit", "lb.shot", key])
                      run(["xcrun", "simctl", "launch", udid, "click.cowa.linbit"])
                      time.sleep(4)
                      # 文件名区分 key / appearance / content_size档 / 设备档
                      out = f"shots-adapt/{key}-{mode}-{tag}.png"
                      run(["xcrun", "simctl", "io", udid, "screenshot", out])
              run(["xcrun", "simctl", "ui", udid, "content_size", "medium"])
              run(["xcrun", "simctl", "shutdown", udid])
          meta = {"profiles": profiles, "screens": screens}
          Path("shots-adapt/adapt-run-meta.json").write_text(json.dumps(meta, ensure_ascii=False, indent=2))
          print("wrote shots-adapt/adapt-run-meta.json", flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linbit-ios-adapt-${{ github.sha }}
          path: shots-adapt/
          retention-days: 14
          if-no-files-found: warn

# Linbit iOS CI：生成工程 → 模拟器编译（无签名）→ 启动截图 → 上传产物
# 放置位置：仓库根目录 .github/workflows/ios.yml；IOS_DIR 指向 project.yml 所在目录
#
# macos-14 已于 2026-11-02 下线，且其上的 iPhone 15 模拟器不在现行镜像里。
# 使用 macos-15 + Xcode 16.4（默认）+ iOS 18.5 的 iPhone 16。
name: iOS

on:
  push:
    branches: [main, "feat/ios-*"]
    paths: ["mobile/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  IOS_DIR: mobile/ios
  SIM_NAME: iPhone 16
  SIM_OS: "18.5"
  DERIVED: ${{ github.workspace }}/build

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check mobile/openapi.yaml matches docs/api/openapi.yaml (current branch)
        env:
          # pull_request 事件默认检出与最新 main 的合并提交；这里以 PR 分支自身（head）为准
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          if ! git cat-file -e "$HEAD_SHA:docs/api/openapi.yaml" 2>/dev/null; then
            echo "当前分支没有 docs/api/openapi.yaml，跳过一致性检查"
            exit 0
          fi
          git show "$HEAD_SHA:docs/api/openapi.yaml" > /tmp/docs-openapi.yaml
          git show "$HEAD_SHA:mobile/openapi.yaml" > /tmp/mobile-openapi.yaml
          if ! diff -u /tmp/docs-openapi.yaml /tmp/mobile-openapi.yaml > /tmp/openapi.diff; then
            echo "::error file=mobile/openapi.yaml::mobile/openapi.yaml 与当前分支的 docs/api/openapi.yaml 不一致；请执行 cp docs/api/openapi.yaml mobile/openapi.yaml 并用 mobile/tools/gen_models.sh 重新生成模型"
            head -80 /tmp/openapi.diff
            exit 1
          fi
          echo "openapi.yaml 一致（${HEAD_SHA}）"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate AppIcon (logo.svg -> 1024 PNG)
        run: |
          python3 mobile/tools/gen_app_icon.py
          sips -g pixelWidth -g pixelHeight mobile/ios/Linbit/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate project
        working-directory: ${{ env.IOS_DIR }}
        run: xcodegen generate

      - name: Build for simulator
        working-directory: ${{ env.IOS_DIR }}
        run: |
          set -o pipefail
          DEST="platform=iOS Simulator,name=${SIM_NAME},OS=${SIM_OS}"
          if command -v xcbeautify >/dev/null 2>&1; then
            xcodebuild -project Linbit.xcodeproj -scheme Linbit -configuration Debug \
              -destination "$DEST" \
              -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build | xcbeautify
          else
            xcodebuild -project Linbit.xcodeproj -scheme Linbit -configuration Debug \
              -destination "$DEST" \
              -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build
          fi

      - name: Launch & screenshot (light / dark)
        run: |
          set -euo pipefail
          APP=$(find "$DERIVED/Build/Products" -name "Linbit.app" -maxdepth 3 | head -1)
          echo "APP=$APP"
          UDID=$(xcrun simctl list devices "iOS ${SIM_OS}" | sed -n 's/^[[:space:]]*iPhone 16 (\([A-F0-9-]*\)).*/\1/p' | head -1)
          echo "UDID=$UDID"
          test -n "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          # 主页面日间/夜间各一张；主要弹窗仅日间。lb.shot 只在 CI 写入。
          shoot() {
            local screen="$1" mode="$2"
            xcrun simctl ui "$UDID" appearance "$mode"
            xcrun simctl terminate "$UDID" click.cowa.linbit || true
            xcrun simctl spawn "$UDID" defaults write click.cowa.linbit lb.theme system
            xcrun simctl spawn "$UDID" defaults write click.cowa.linbit lb.shot "$screen"
            xcrun simctl launch "$UDID" click.cowa.linbit
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/${screen}-${mode}.png" || true
          }
          for screen in home markets spot assets login futures futures-chart futures-plan futures-history futures-position-history futures-algo-history futures-tiers futures-funding \
                        event earn strategy swap chat subaccounts welfare \
                        spot-plan spot-market-amount spot-fee spot-conditional spot-history-conditional \
                        futures-pnl futures-pnl-empty futures-pnl-error password-register password-reset password-change; do
            for mode in light dark; do shoot "$screen" "$mode"; done
          done
          for screen in futures-leverage futures-mode futures-tpsl futures-kind futures-tools event-confirm \
                        futures-orders-tpsl futures-orders-plan futures-amend futures-algo-amend-plan futures-algo-amend-tpsl futures-mode-hedge futures-tpsl-partial earn-subscribe grid-create grid-confirm swap-picker sub-create account-switch; do
            shoot "$screen" light
          done
          # 账户安全：概览 / 资料 / 邮箱手机 / 资金密码 / 防钓鱼码 / 设备会话 / 通行密钥 / 关闭 2FA（日间 + 夜间，含错误/空态）
          for screen in security security-error security-profile security-profile-error security-email security-email-error security-phone security-fund security-fund-error security-fund-reset security-antiphishing security-antiphishing-error security-devices security-sessions security-devices-error security-devices-empty security-passkeys security-passkeys-empty security-passkeys-add security-2fa-disable security-2fa-disable-error; do
            for mode in light dark; do shoot "$screen" "$mode"; done
          done
          # 资产模块：总览 / 网络 / 账户划转 / 内部转账 / 提现记录 / 地址簿（日间 + 夜间）
          for screen in assets-overview assets-networks assets-account-transfer assets-internal-transfer assets-withdraw-records assets-address-book; do
            for mode in light dark; do shoot "$screen" "$mode"; done
          done
          # 启动动画：开始 / 中间 / 结束 三个时刻（冻结进度），日间 + 夜间
          for screen in splash-start splash-mid splash-end; do
            for mode in light dark; do shoot "$screen" "$mode"; done
          done
          # 启动动画录屏（真实播放，日间 + 夜间）
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance "$mode"
            xcrun simctl terminate "$UDID" click.cowa.linbit || true
            xcrun simctl spawn "$UDID" defaults write click.cowa.linbit lb.theme system
            xcrun simctl spawn "$UDID" defaults delete click.cowa.linbit lb.shot || true
            xcrun simctl io "$UDID" recordVideo --codec=h264 --force "shots/splash-${mode}.mp4" &
            REC=$!
            sleep 2
            xcrun simctl launch "$UDID" click.cowa.linbit
            sleep 4
            kill -INT "$REC" || true
            wait "$REC" || true
          done
          # 合约弹窗夜间版
          for screen in futures-orders-tpsl futures-orders-plan futures-amend futures-algo-amend-plan futures-algo-amend-tpsl futures-mode-hedge futures-tpsl-partial futures-tpsl futures-mode futures-leverage futures-kind futures-tools; do
            shoot "$screen" dark
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linbit-ios-${{ github.sha }}
          path: shots/
          retention-days: 14
          if-no-files-found: warn
